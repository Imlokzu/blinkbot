<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="meta.title"></title>
    <meta name="description" data-i18n-attr="content:meta.description" />
    <link rel="canonical" href="https://waveio.me/" />
    <meta property="og:url" content="https://waveio.me/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" data-i18n-attr="content:meta.title" />
    <meta property="og:description" data-i18n-attr="content:meta.description" />
    <meta property="og:image" content="https://waveio.me/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <a class="skip" href="#main" data-i18n="nav.skip"></a>
    <header class="nav">
      <div class="container nav__inner">
        <a class="nav__brand" href="#top" data-i18n-attr="aria-label:brand.home">
          <span data-i18n="brand.wordmark"></span>
        </a>
        <button type="button" class="nav__toggle" data-nav-toggle aria-expanded="false" aria-controls="site-navigation" data-i18n-attr="aria-label:nav.openMenu" hidden>
          <span aria-hidden="true"></span><span aria-hidden="true"></span>
        </button>
        <nav class="nav__links" id="site-navigation" data-i18n-attr="aria-label:nav.primary">
          <a href="#screens" data-i18n="nav.screens"></a>
          <a href="#devices" data-i18n="nav.devices"></a>
          <a href="#start" data-i18n="nav.start"></a>
        </nav>
        <div class="nav__end">
          <div class="lang" role="group" data-i18n-attr="aria-label:nav.lang" hidden>
            <button type="button" data-set-lang="en" lang="en" data-i18n="nav.english"></button>
            <button type="button" data-set-lang="uk" lang="uk" data-i18n="nav.ukrainian"></button>
          </div>
          <a class="hover-pill" href="https://github.com/Imlokzu/blinkbot" rel="noopener" data-i18n-attr="aria-label:nav.github">
            <span class="hover-pill__dot" aria-hidden="true"></span>
            <span class="hover-pill__label" data-i18n="nav.github"></span>
            <span class="hover-pill__reveal" aria-hidden="true"><span data-i18n="nav.github"></span><svg viewBox="0 0 24 24"><use href="#icon-arrow-right" /></svg></span>
          </a>
        </div>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section class="hero" id="top" tabindex="-1" aria-labelledby="hero-title">
        <div class="container">
          <p class="label rise" data-i18n="hero.label"></p>
          <h1 class="hero__title rise" id="hero-title" data-flip>
            <span class="hero__line" data-flip-line data-i18n="hero.titleA"></span>
            <span class="hero__line hero__line--soft" data-flip-line data-i18n="hero.titleB"></span>
          </h1>
          <div class="hero__row rise">
            <p class="hero__lead" data-i18n="hero.lead"></p>
            <div class="hero__actions">
              <a class="discover" href="https://github.com/Imlokzu/blinkbot" rel="noopener">
                <span class="discover__fill" aria-hidden="true"></span>
                <span class="discover__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-arrow-right" /></svg></span>
                <span class="discover__text" data-i18n="hero.cta"></span>
              </a>
              <button type="button" class="install" hidden data-copy="git clone https://github.com/Imlokzu/blinkbot.git" aria-describedby="install-command">
                <code id="install-command"><span aria-hidden="true">$ </span>git clone github.com/Imlokzu/blinkbot</code>
                <span class="install__state"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-copy" /></svg><span data-i18n="start.copy"></span></span>
              </button>
            </div>
          </div>
        </div>

        <div class="container">
          <figure class="stage rise" aria-labelledby="device-caption">
            <div class="stage__glow" aria-hidden="true"></div>
            <div class="bot">
              <div class="bot__screen">
                <img src="%BASE_URL%shots/en/screen-clock-half.webp"
                  srcset="%BASE_URL%shots/en/screen-clock-half.webp 640w, %BASE_URL%shots/en/screen-clock.webp 1280w"
                  sizes="(max-width: 734px) 80vw, 480px"
                  width="320" height="240" data-i18n-attr="alt:device.clockAlt" data-bot-view="clock" />
                <img src="%BASE_URL%shots/en/screen-weather-half.webp"
                  srcset="%BASE_URL%shots/en/screen-weather-half.webp 640w, %BASE_URL%shots/en/screen-weather.webp 1280w"
                  sizes="(max-width: 734px) 80vw, 480px"
                  width="320" height="240" data-i18n-attr="alt:device.weatherAlt" loading="lazy" data-bot-view="weather" hidden />
                <img src="%BASE_URL%shots/en/screen-apps-half.webp"
                  srcset="%BASE_URL%shots/en/screen-apps-half.webp 640w, %BASE_URL%shots/en/screen-apps.webp 1280w"
                  sizes="(max-width: 734px) 80vw, 480px"
                  width="320" height="240" data-i18n-attr="alt:device.appsAlt" loading="lazy" data-bot-view="apps" hidden />
              </div>
              <div class="bot__trim" aria-hidden="true">
                <img src="/blink-mark-white.svg" alt="" width="16" height="16" />
                <span class="bot__speaker"><i></i><i></i><i></i><i></i></span>
              </div>
            </div>
            <figcaption class="stage__bar">
              <span class="stage__caption" id="device-caption" data-i18n="hero.deviceCaption"></span>
              <span class="segmented" role="group" data-i18n-attr="aria-label:device.viewsLabel" hidden>
                <button type="button" aria-pressed="true" data-show-view="clock" data-i18n="device.viewClock"></button>
                <button type="button" aria-pressed="false" data-show-view="weather" data-i18n="device.viewWeather"></button>
                <button type="button" aria-pressed="false" data-show-view="apps" data-i18n="device.viewApps"></button>
              </span>
            </figcaption>
          </figure>
        </div>
      </section>

      <section class="reel section" aria-labelledby="reel-label">
        <div class="container reel__inner">
          <p class="label reel__prefix" id="reel-label" data-i18n="reel.label"></p>
          <div class="reel__viewport" data-reel>
            <ul class="reel__track" role="list" data-reel-track>
              <li data-i18n="reel.item1"></li>
              <li data-i18n="reel.item2"></li>
              <li data-i18n="reel.item3"></li>
              <li data-i18n="reel.item4"></li>
              <li data-i18n="reel.item5"></li>
              <li data-i18n="reel.item6"></li>
              <li data-i18n="reel.item7"></li>
              <li data-i18n="reel.item8"></li>
            </ul>
          </div>
          <p class="reel__note" data-reveal data-i18n="reel.note"></p>
        </div>
      </section>

      <section class="screens section" id="screens" tabindex="-1" aria-labelledby="screens-title">
        <header class="container screens__head" data-reveal>
          <div>
            <h2 id="screens-title" data-i18n="screens.title"></h2>
            <p class="section-lead" data-i18n="screens.lead"></p>
          </div>
          <p class="label screens__hint" aria-hidden="true">
            <svg viewBox="0 0 24 24"><use href="#icon-drag" /></svg>
            <span data-i18n="screens.hint"></span>
          </p>
        </header>
        <div class="marquee" data-marquee tabindex="0" role="region" data-i18n-attr="aria-label:screens.title">
          <ul class="marquee__track" role="list" data-marquee-track>
            <li class="shot shot--wide">
              <div class="shot__frame"><img src="%BASE_URL%shots/en/chat-half.webp" width="1440" height="1000" data-i18n-attr="alt:screens.chatAlt" loading="lazy" decoding="async" draggable="false" /></div>
              <h3 data-i18n="screens.chatTitle"></h3>
              <p data-i18n="screens.chatText"></p>
            </li>
            <li class="shot shot--wide">
              <div class="shot__frame"><img src="%BASE_URL%shots/en/memory-half.webp" width="1440" height="1000" data-i18n-attr="alt:screens.memoryAlt" loading="lazy" decoding="async" draggable="false" /></div>
              <h3 data-i18n="screens.memoryTitle"></h3>
              <p data-i18n="screens.memoryText"></p>
            </li>
            <li class="shot shot--phone">
              <div class="shot__frame"><img src="%BASE_URL%shots/en/mobile-half.webp" width="390" height="844" data-i18n-attr="alt:screens.phoneAlt" loading="lazy" decoding="async" draggable="false" /></div>
              <h3 data-i18n="screens.phoneTitle"></h3>
              <p data-i18n="screens.phoneText"></p>
            </li>
            <li class="shot shot--wide">
              <div class="shot__frame"><img src="%BASE_URL%shots/en/welcome-half.webp" width="1440" height="1000" data-i18n-attr="alt:screens.styleAlt" loading="lazy" decoding="async" draggable="false" /></div>
              <h3 data-i18n="screens.styleTitle"></h3>
              <p data-i18n="screens.styleText"></p>
            </li>
            <li class="shot shot--pi">
              <div class="shot__frame"><img src="%BASE_URL%shots/en/screen-clock-half.webp" width="320" height="240" data-i18n-attr="alt:device.clockAlt" loading="lazy" decoding="async" draggable="false" /></div>
              <h3 data-i18n="screens.clockTitle"></h3>
              <p data-i18n="screens.clockText"></p>
            </li>
            <li class="shot shot--pi">
              <div class="shot__frame"><img src="%BASE_URL%shots/en/screen-weather-half.webp" width="320" height="240" data-i18n-attr="alt:device.weatherAlt" loading="lazy" decoding="async" draggable="false" /></div>
              <h3 data-i18n="screens.weatherTitle"></h3>
              <p data-i18n="screens.weatherText"></p>
            </li>
            <li class="shot shot--pi">
              <div class="shot__frame"><img src="%BASE_URL%shots/en/screen-apps-half.webp" width="320" height="240" data-i18n-attr="alt:device.appsAlt" loading="lazy" decoding="async" draggable="false" /></div>
              <h3 data-i18n="screens.appsTitle"></h3>
              <p data-i18n="screens.appsText"></p>
            </li>
          </ul>
        </div>
      </section>

      <section class="surfaces container section" id="devices" tabindex="-1" aria-labelledby="surfaces-title">
        <header class="surfaces__head" data-reveal>
          <h2 id="surfaces-title" data-i18n="surfaces.title"></h2>
          <p class="section-lead" data-i18n="surfaces.lead"></p>
        </header>
        <ul class="sessions" role="list" data-reveal>
          <li class="session">
            <span class="session__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-laptop" /></svg></span>
            <span class="session__body">
              <span class="session__name"><span data-i18n="surfaces.computerName"></span><span class="badge" data-i18n="surfaces.computerStatus"></span></span>
              <span class="session__detail" data-i18n="surfaces.computerDetail"></span>
            </span>
            <span class="session__live" aria-hidden="true"><i></i></span>
          </li>
          <li class="session">
            <span class="session__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chip" /></svg></span>
            <span class="session__body">
              <span class="session__name"><span data-i18n="surfaces.piName"></span><span class="badge badge--soft" data-i18n="surfaces.piStatus"></span></span>
              <span class="session__detail" data-i18n="surfaces.piDetail"></span>
            </span>
          </li>
          <li class="session">
            <span class="session__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-browser" /></svg></span>
            <span class="session__body">
              <span class="session__name"><span data-i18n="surfaces.dashboardName"></span><span class="badge badge--soft" data-i18n="surfaces.dashboardStatus"></span></span>
              <span class="session__detail" data-i18n="surfaces.dashboardDetail"></span>
            </span>
          </li>
          <li class="session">
            <span class="session__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-phone" /></svg></span>
            <span class="session__body">
              <span class="session__name"><span data-i18n="surfaces.androidName"></span><span class="badge badge--soft" data-i18n="surfaces.androidStatus"></span></span>
              <span class="session__detail" data-i18n="surfaces.androidDetail"></span>
            </span>
          </li>
          <li class="session">
            <span class="session__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-send" /></svg></span>
            <span class="session__body">
              <span class="session__name"><span data-i18n="surfaces.telegramName"></span><span class="badge badge--soft" data-i18n="surfaces.telegramStatus"></span></span>
              <span class="session__detail" data-i18n="surfaces.telegramDetail"></span>
            </span>
          </li>
          <li class="session">
            <span class="session__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chat" /></svg></span>
            <span class="session__body">
              <span class="session__name"><span data-i18n="surfaces.discordName"></span><span class="badge badge--soft" data-i18n="surfaces.discordStatus"></span></span>
              <span class="session__detail" data-i18n="surfaces.discordDetail"></span>
            </span>
          </li>
          <li class="session">
            <span class="session__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-cpu" /></svg></span>
            <span class="session__body">
              <span class="session__name"><span data-i18n="surfaces.modelName"></span><span class="badge badge--soft" data-i18n="surfaces.modelStatus"></span></span>
              <span class="session__detail" data-i18n="surfaces.modelDetail"></span>
            </span>
          </li>
        </ul>
      </section>

      <section class="paths container section" id="start" tabindex="-1" aria-labelledby="paths-title">
        <h2 class="paths__title" id="paths-title" data-reveal data-i18n="paths.title"></h2>
        <div class="split" data-reveal>
          <article class="split__card">
            <p class="label" data-i18n="paths.computerLabel"></p>
            <h3 data-i18n="paths.computerTitle"></h3>
            <p data-i18n="paths.computerText"></p>
          </article>
          <span class="split__divider" aria-hidden="true"></span>
          <article class="split__card">
            <p class="label" data-i18n="paths.piLabel"></p>
            <h3 data-i18n="paths.piTitle"></h3>
            <p data-i18n="paths.piText"></p>
          </article>
        </div>
        <div class="terminal" data-reveal>
          <div class="terminal__bar">
            <span class="window__dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span data-i18n="start.terminalTitle"></span>
          </div>
          <ol class="terminal__body">
            <li class="terminal__step">
              <span class="terminal__label"><span data-i18n="start.step1"></span></span>
              <span class="terminal__line">
                <code id="setup-command-1">git clone https://github.com/Imlokzu/blinkbot.git</code>
                <button type="button" class="copy" hidden aria-describedby="setup-command-1" data-copy="git clone https://github.com/Imlokzu/blinkbot.git">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-copy" /></svg><span data-i18n="start.copy"></span>
                </button>
              </span>
            </li>
            <li class="terminal__step">
              <span class="terminal__label"><span data-i18n="start.step2"></span></span>
              <span class="terminal__line">
                <code id="setup-command-2">cd "blinkbot/Virtual Bot" &amp;&amp; ./start.sh</code>
                <button type="button" class="copy" hidden aria-describedby="setup-command-2" data-copy='cd "blinkbot/Virtual Bot" &amp;&amp; ./start.sh'>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-copy" /></svg><span data-i18n="start.copy"></span>
                </button>
              </span>
            </li>
            <li class="terminal__step">
              <span class="terminal__label"><span data-i18n="start.step3"></span></span>
              <span class="terminal__line">
                <code id="setup-command-3">http://127.0.0.1:8100/dash/</code>
                <button type="button" class="copy" hidden aria-describedby="setup-command-3" data-copy="http://127.0.0.1:8100/dash/">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-copy" /></svg><span data-i18n="start.copy"></span>
                </button>
              </span>
            </li>
          </ol>
          <p class="sr-only" role="status" data-copy-status></p>
        </div>
        <p class="paths__note" data-i18n="start.note"></p>
      </section>
    </main>

    <footer class="footer" aria-labelledby="final-title">
      <div class="footer__lights" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="container footer__top-row">
        <div class="footer__intro" data-reveal>
          <p class="footer__pill" data-i18n="footer.label"></p>
          <h2 id="final-title" data-i18n="footer.title"></h2>
          <p class="footer__lead" data-i18n="footer.lead"></p>
          <a class="discover discover--invert" href="https://github.com/Imlokzu/blinkbot" rel="noopener">
            <span class="discover__fill" aria-hidden="true"></span>
            <span class="discover__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-arrow-right" /></svg></span>
            <span class="discover__text" data-i18n="footer.cta"></span>
          </a>
        </div>
        <nav class="footer__cols" data-i18n-attr="aria-label:footer.navLabel">
          <div data-reveal>
            <h3 data-i18n="footer.colPage"></h3>
            <ul role="list">
              <li><a href="#screens" data-i18n="nav.screens"></a></li>
              <li><a href="#devices" data-i18n="nav.devices"></a></li>
              <li><a href="#start" data-i18n="nav.start"></a></li>
            </ul>
          </div>
          <div data-reveal>
            <h3 data-i18n="footer.colProject"></h3>
            <ul role="list">
              <li><a href="https://github.com/Imlokzu/blinkbot" rel="noopener" data-i18n="footer.source"></a></li>
              <li><a href="https://github.com/Imlokzu/blinkbot#readme" rel="noopener" data-i18n="footer.readme"></a></li>
              <li><a href="https://github.com/Imlokzu/blinkbot/blob/main/LICENSE" rel="noopener" data-i18n="footer.licenseLink"></a></li>
              <li><a href="https://github.com/Imlokzu/blinkbot/issues" rel="noopener" data-i18n="footer.issues"></a></li>
            </ul>
          </div>
          <div data-reveal>
            <h3 data-i18n="footer.colRuns"></h3>
            <ul role="list" class="footer__plain">
              <li data-i18n="footer.runsComputer"></li>
              <li data-i18n="footer.runsPi"></li>
              <li data-i18n="footer.runsPhone"></li>
            </ul>
          </div>
        </nav>
      </div>
      <p class="footer__word" data-flip aria-hidden="true"><span data-flip-line>blink</span><span class="footer__dot">.</span></p>
      <div class="container footer__inner">
        <a class="footer__brand" href="#top" data-i18n-attr="aria-label:brand.home">
          <img src="/blink-tile.svg" alt="" width="22" height="22" />
          <span data-i18n="brand.name"></span>
        </a>
        <span data-i18n="footer.license"></span>
        <span data-i18n="footer.by"></span>
        <a class="footer__top" href="#top" data-i18n="footer.top"></a>
      </div>
    </footer>

    <svg width="0" height="0" class="sprites" aria-hidden="true">
