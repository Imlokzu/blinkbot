# Клод Бот — конфіг Voice Loop (Крок 3, підключено до OpenClaw)

openclaw:
  base_url: http://127.0.0.1:18789   # Gateway OpenClaw (WS+HTTP порт)
  # The gateway token is never kept here: it comes from the OPENCLAW_TOKEN
  # environment variable only (gateway.auth.token in ~/.openclaw/openclaw.json).
  agent: openclaw/default             # або openclaw/<agentId> для конкретного агента

listening:
  sample_rate: 16000
  channels: 1
  silence_threshold: 500      # RMS-поріг тиші (0-32768 для int16)
  silence_duration_s: 1.0     # скільки тиші поспіль = кінець фрази
  max_utterance_s: 15         # аварійний ліміт, щоб не писати вічно

stt:
  model_size: small           # faster-whisper: tiny/base/small/medium
  device: cpu
  compute_type: int8
  language: uk                 # примусово українська; null = автовизначення

tts:
  engine: pyttsx3               # тимчасовий MVP (офлайн); згодом ElevenLabs/ChatterboxTTS
  rate: 175
