<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Breathe</title>
<!-- App kit v1: the screen's own look (Material You or Deep UI, any theme
     or skin) and its safe insets. See docs/SCREEN-PLATFORM.md §2.6. -->
<link rel="stylesheet" href="/static/screen/app-kit.css">
<script src="/static/screen/app-kit.js"></script>
<style>
  /* Only what is the breathing app's own: the pacing circle and the two
     pattern cards. The page, the bar and the buttons are kit parts. */
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .cycles { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 12px; border-radius: 14px;
    background: var(--kit-surface-hi); color: var(--muted); font: 600 11px/1 var(--font); }
  .cycles b { color: var(--text); font-size: 14px; font-variant-numeric: tabular-nums; }

  .main { gap: 12px; align-items: stretch; }
  .stage { position: relative; display: grid; place-items: center; flex: 1; min-width: 0; min-height: 0; }
  .orb { position: relative; }
  /* The outer ring is a full breath in, the inner one a full breath out */
  .orb-guide { position: absolute; inset: 0; border: 1.5px dashed color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 50%; }
  .orb-min { position: absolute; inset: 27.5%; border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 50%; }
  /* Only transform moves: the circle grows and shrinks, nothing repaints */
  .orb-ball { position: absolute; inset: 0; border-radius: 50%; background: var(--kit-tonal); transform: scale(.45);
    transition-property: transform; transition-timing-function: cubic-bezier(.45, 0, .55, 1); will-change: transform; }
  :root[data-ui="deep"] .orb-ball { background: linear-gradient(180deg,
    color-mix(in srgb, var(--accent) 55%, var(--bg)), color-mix(in srgb, var(--accent) 30%, var(--bg))); }
  :root[data-ui="deep"][data-theme="light"] .orb-ball { background: linear-gradient(180deg,
    color-mix(in srgb, var(--accent) 22%, #fff), color-mix(in srgb, var(--accent) 45%, #fff)); }
  .orb-copy { position: absolute; inset: 0; padding: 0 26%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; text-align: center; }
  .orb-phase { font: 700 14px/1.15 var(--font); letter-spacing: -0.01em; color: var(--kit-on-tonal); }
  .orb-count { font: 300 40px/1 var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--text); }
  :root[data-ui="material"] .orb-count { font-weight: 400; }
  .orb-count.idle { color: var(--muted); font: 500 10px/1.25 var(--font); letter-spacing: 0; }
  /* The phase names its colour: in = accent, hold = quiet, out = tonal */
  .orb[data-phase="in"] .orb-phase { color: var(--accent); }
  .orb[data-phase="hold"] .orb-phase { color: var(--muted); }
  :root[data-ui="deep"][data-theme="dark"] .orb[data-phase="in"] .orb-phase { color: #fff; }

  /* Pattern cards and the one primary action */
  .side { display: flex; flex-direction: column; gap: 6px; width: 116px; flex: none; }
  .mode { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; width: 100%;
    min-height: 44px; padding: 6px 12px; border: 0; color: var(--text); text-align: left; cursor: pointer;
    transition: transform 110ms ease; }
  .mode:active { transform: scale(0.96); }
  .mode b { font: 700 15px/1 var(--font); font-variant-numeric: tabular-nums; }
  .mode span { color: var(--muted); font: 500 11px/1.1 var(--font); }
  .mode.on { background: var(--kit-tonal); }
  .mode.on b { color: var(--kit-on-tonal); }
  :root[data-ui="deep"] .mode.on { background: var(--kit-tonal); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .side .spacer { flex: 1; }
  #toggle { width: 100%; }

  @media (max-height: 200px) { .mode { min-height: 32px; padding-block: 3px; } .mode span { display: none; } .orb-count { font-size: 30px; } }
  @media (prefers-reduced-motion: reduce) { .mode { transition: none; } }
</style>
</head>
<body class="kit">
  <main class="kit-app" id="app">
    <header class="kit-bar">
      <span class="kit-title" data-i18n="title"></span>
      <span class="cycles"><span data-i18n="cycles"></span><b id="cycles">0</b></span>
    </header>
    <section class="kit-fill kit-row main">
      <div class="stage" id="stage">
        <div class="orb" id="orb">
          <div class="orb-guide"></div>
          <div class="orb-min"></div>
          <div class="orb-ball" id="ball"></div>
          <div class="orb-copy"><div class="orb-phase" id="phase"></div><div class="orb-count" id="count"></div></div>
        </div>
      </div>
      <aside class="side">
        <button class="kit-card mode" type="button" data-mode="box"><b>4-4-4-4</b><span data-i18n="boxName"></span></button>
        <button class="kit-card mode" type="button" data-mode="relax"><b>4-7-8</b><span data-i18n="relaxName"></span></button>
        <span class="spacer"></span>
        <button class="kit-btn primary big" id="toggle" type="button"></button>
      </aside>
    </section>
  </main>
<script>
  const APP_ID = "breathe";
  const STR = {
    uk: {
      title: "Дихання", cycles: "Цикли", boxName: "Квадрат", relaxName: "Розслаблення",
      start: "Почати", stop: "Стоп", ready: "Готові?", readySub: "Сядь зручно",
      in: "Вдих", hold: "Затримка", out: "Видих",
    },
    en: {
      title: "Breathe", cycles: "Cycles", boxName: "Box", relaxName: "Relax",
      start: "Start", stop: "Stop", ready: "Ready?", readySub: "Sit comfortably",
      in: "Breathe in", hold: "Hold", out: "Breathe out",
    },
  };
  const ICONS = {
    play: '<path d="M8 5.4v13.2L19.2 12z"/>',
    pause: '<path d="M8.6 5.5v13M15.4 5.5v13"/>'
  };

  // Storage throws inside a sandboxed iframe (a shared package runs with an
  // opaque origin), so every access is guarded and the app keeps its state
  // in memory instead of failing.
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(APP_ID + "." + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
  }

  // The kit already knows the screen's language (botScreenLang)
  let lang = window.BotApp ? BotApp.lang : "uk";
  function t(key) { return STR[lang][key] ?? STR.uk[key] ?? key; }
  function icon(name) {
    return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    renderCopy();
    renderButtons();
  }

  const PATTERNS = {
    box: [["in", 4], ["hold", 4], ["out", 4], ["hold", 4]],
    relax: [["in", 4], ["hold", 7], ["out", 8]],
  };
  const SMALL = .45;
  const ball = document.getElementById("ball");
  let mode = load("mode", "box") === "relax" ? "relax" : "box";
  let running = false, step = 0, cycles = 0, phaseStart = 0, phaseTimer = 0, countTimer = 0;

  function setBall(scale, seconds) {
    ball.style.transitionDuration = seconds + "s";
    ball.style.transform = "scale(" + scale + ")";
  }

  function runPhase() {
    const [kind, secs] = PATTERNS[mode][step];
    phaseStart = performance.now();
    if (kind === "in") setBall(1, secs);
    if (kind === "out") setBall(SMALL, secs);
    renderCopy();
    clearInterval(countTimer);
    countTimer = setInterval(renderCopy, 200);
    phaseTimer = setTimeout(() => {
      step += 1;
      if (step >= PATTERNS[mode].length) { step = 0; cycles += 1; document.getElementById("cycles").textContent = cycles; }
      runPhase();
    }, secs * 1000);
  }

  function start() {
    running = true; step = 0; cycles = 0;
    document.getElementById("cycles").textContent = 0;
    runPhase();
    renderButtons();
  }
  function stop() {
    running = false;
    clearTimeout(phaseTimer); clearInterval(countTimer);
    setBall(SMALL, .6);
    renderCopy();
    renderButtons();
  }

  function renderCopy() {
    const phase = document.getElementById("phase");
    const count = document.getElementById("count");
    const orb = document.getElementById("orb");
    if (!running) {
      phase.textContent = t("ready");
      count.textContent = t("readySub");
      count.classList.add("idle");
      orb.dataset.phase = "idle";
      return;
    }
    const [kind, secs] = PATTERNS[mode][step];
    const left = Math.max(1, Math.ceil(secs - (performance.now() - phaseStart) / 1000));
    phase.textContent = t(kind);
    orb.dataset.phase = kind;
    count.classList.remove("idle");
    count.textContent = left;
  }

  function renderButtons() {
    document.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
    const toggle = document.getElementById("toggle");
    toggle.innerHTML = icon(running ? "pause" : "play") + "<span></span>";
    toggle.lastChild.textContent = t(running ? "stop" : "start");
  }

  function layout() {
    const stage = document.getElementById("stage");
    const size = Math.max(90, Math.floor(Math.min(stage.clientWidth, stage.clientHeight)) - 4);
    const orb = document.getElementById("orb");
    orb.style.width = orb.style.height = size + "px";
  }

  document.querySelector(".side").addEventListener("click", (event) => {
    const b = event.target.closest("[data-mode]");
    if (!b) return;
    mode = b.dataset.mode;
    save("mode", mode);
    if (running) { clearTimeout(phaseTimer); start(); }
    renderButtons();
  });
  document.getElementById("toggle").addEventListener("click", () => (running ? stop() : start()));
  // Timers are throttled in a hidden frame, which would desync the circle
  // from the count; stopping is more honest than a drifting guide.
  document.addEventListener("visibilitychange", () => { if (document.hidden && running) stop(); });
  window.addEventListener("resize", layout);

  layout();
  applyI18n();

  // The screen's style and theme are applied by the kit; the app only
  // follows the language.
  if (window.BotApp) BotApp.onChange((s) => { if (s.lang !== lang) { lang = s.lang; applyI18n(); } });
</script>
</body>
</html>
