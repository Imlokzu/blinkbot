<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Device settings</title>
<!-- App kit v1: the screen's own look (Material You or Deep UI, any theme
     or skin) and its safe insets. See docs/SCREEN-PLATFORM.md §2.6. -->
<link rel="stylesheet" href="/static/screen/app-kit.css">
<script src="/static/screen/app-kit.js"></script>
<style>
  /* Only what is this app's own: the device card, status glyphs (signal,
     battery) and the mixer rows. Lists, chips, sliders and buttons are
     kit parts. */
  [hidden] { display: none !important; }
  svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-linecap: round;
    stroke-linejoin: round; stroke-width: 1.9; }
  .kit-bar .kit-btn.icon { width: 30px; height: 30px; margin-left: -4px; }
  .kit-bar .kit-segment .kit-chip { padding: 0 12px; }
  .badge { flex: none; display: inline-flex; align-items: center; min-height: 20px; padding: 0 8px; border-radius: 10px;
    background: var(--kit-tonal); color: var(--kit-on-tonal); font: 700 9px/1 var(--font); letter-spacing: .06em; }

  .content { padding-bottom: 2px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .sec { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 0; }

  /* The bot itself: a raised card with its name and battery */
  .summary { display: flex; align-items: center; gap: 10px; }
  .summary-name { overflow: hidden; font: 700 15px/1.2 var(--font); letter-spacing: -0.01em; text-overflow: ellipsis; white-space: nowrap; }
  .summary-sub { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--accent); }
  .battery { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .battery-top { display: flex; align-items: center; gap: 8px; }
  .battery-pct { font: 600 20px/1 var(--font); font-variant-numeric: tabular-nums; }
  .battery-shell { position: relative; box-sizing: border-box; width: 30px; height: 14px; padding: 2px;
    border: 1.5px solid var(--muted); border-radius: 4px; }
  .battery-shell::after { position: absolute; top: 3px; right: -4px; width: 2px; height: 5px; border-radius: 0 2px 2px 0;
    background: var(--muted); content: ""; }
  .battery-fill { display: block; height: 100%; border-radius: 1.5px; background: var(--accent); }

  /* Round icon badge at the start of every row; "on" = active/connected */
  .ico { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 50%;
    background: var(--kit-tonal); color: var(--kit-on-tonal); }
  .ico.on { background: var(--kit-primary); color: var(--kit-on-accent); }
  .ico.lg { width: 38px; height: 38px; }
  .ico.lg svg { width: 20px; height: 20px; }

  .row { box-sizing: border-box; width: 100%; border: 0; color: var(--text); font: inherit; text-align: left; }
  button.row { cursor: pointer; }
  button.row:active { background: var(--kit-surface-hi); }
  .row-title { display: block; overflow: hidden; font: 600 13px/1.2 var(--font); text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { display: block; overflow: hidden; margin-top: 2px; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .state { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .state-text { color: var(--accent); font: 600 11px/1 var(--font); }
  .state-text.ready { color: var(--muted); }
  .chev { color: var(--muted); }
  .signal { display: flex; align-items: flex-end; gap: 2px; height: 11px; flex: none; }
  .signal i { display: block; width: 3px; border-radius: 1.5px; background: var(--kit-surface-hi); }
  :root[data-ui="deep"] .signal i { background: color-mix(in srgb, var(--text) 18%, transparent); }
  .signal i:nth-child(1) { height: 3px; }
  .signal i:nth-child(2) { height: 5px; }
  .signal i:nth-child(3) { height: 8px; }
  .signal i:nth-child(4) { height: 11px; }
  .signal .signal-on, :root[data-ui="deep"] .signal .signal-on { background: var(--accent); }

  /* Mixer: one row per source — icon, name over its slider, level, mute */
  .mixer { display: flex; flex-direction: column; gap: 10px; }
  .mixer-head { display: flex; flex-direction: column; gap: 2px; }
  .mixer-title { font: 700 13px/1.2 var(--font); }
  .mixer-hint { color: var(--muted); font-size: 10px; }
  .route { display: flex; align-items: center; gap: 8px; }
  .route-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .route-name { overflow: hidden; font: 600 11px/1.1 var(--font); text-overflow: ellipsis; white-space: nowrap; }
  .route .kit-slider { height: 16px; border-radius: 8px; }
  .route .kit-slider::-webkit-slider-thumb { width: 16px; height: 16px; border-width: 3px; }
  .route .kit-slider::-moz-range-thumb { width: 16px; height: 16px; border-width: 3px; }
  .route.muted .kit-slider { opacity: 0.45; }
  .route-value { min-width: 32px; color: var(--muted); font: 600 11px/1 var(--font); font-variant-numeric: tabular-nums; text-align: right; }
  .route .kit-btn.icon { width: 30px; height: 30px; }
  .route .kit-btn.icon.on { background: var(--kit-tonal); color: var(--kit-on-tonal); }

  .note { padding: 0 4px; color: var(--muted); font-size: 10px; line-height: 1.35; }
  .kit-btn.tonal svg { width: 16px; height: 16px; }

  /* Snackbar: inverse surface, above the gesture pill */
  .toast { position: fixed; left: var(--kit-inset-side); right: var(--kit-inset-side); bottom: calc(var(--kit-inset-bottom) + 4px);
    box-sizing: border-box; min-height: 30px; padding: 8px 12px; border-radius: 12px; background: var(--text); color: var(--bg);
    font: 600 11px/1.3 var(--font); opacity: 0; pointer-events: none; transform: translateY(6px);
    transition: opacity .16s ease, transform .16s ease; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { color: color-mix(in srgb, var(--accent) 70%, var(--bg)); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; transform: none; } }
</style>
</head>
<body class="kit">
  <main class="kit-app">
    <header class="kit-bar">
      <button class="kit-btn icon ghost" id="backBtn" type="button" data-action="back" data-i18n-aria="back" hidden></button>
      <span class="kit-title" id="barTitle" data-i18n="title"></span>
      <span class="badge" id="badge" hidden></span>
      <nav class="kit-segment" id="tabs" data-i18n-aria="nav">
        <button class="kit-chip on" type="button" data-tab="connections" data-i18n="tabConnections"></button>
        <button class="kit-chip" type="button" data-tab="audio" data-i18n="tabAudio"></button>
      </nav>
    </header>
    <section class="kit-fill kit-scroll content" id="content"></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  const STR = {
    uk: {
      title: "Підключення", nav: "Налаштування пристрою", tabConnections: "Звʼязок", tabAudio: "Звук",
      signal: "Сигнал {v}%", botName: "Клод Бот", virtualDevice: "віртуальний пристрій", systemConnected: "система підключена",
      charging: "заряджається", onBattery: "від батареї", connections: "Підключення", demoMode: "DEMO MODE", live: "LIVE",
      noNetwork: "Мережу не вибрано", noIp: "без IP", connected: "підключено", ready: "готово", readyToPair: "готовий до підключення",
      enabled: "увімкнено", off: "вимкнено", audioNow: "Аудіо зараз", inOut: "вхід · вихід", builtinSpeaker: "Вбудований динамік",
      builtinMic: "Вбудований мікрофон", voiceOutput: "Вихід для голосу бота", asrInput: "Вхід для розпізнавання", active: "активний",
      refresh: "Оновити стан", noteConnections: "У віртуальному режимі підключення імітуються. На Raspberry Pi ці самі картки покажуть реальний стан.",
      back: "Назад до підключень", wifiNetworks: "Wi‑Fi мережі", secured: "Захищена мережа", open: "Відкрита мережа",
      activeNet: "активна", choose: "обрати", noteWifi: "Тап по мережі збереже вибір локально у virtual mode. Реальне підключення додасть native-адаптер.",
      btDevices: "Bluetooth пристрої", notConnected: "не підключено", battery: "заряд {n}%", connect: "підключити", scan: "Сканувати ще раз",
      noteBt: "Пошук і сполучення стануть реальними після підключення Bluetooth-модуля бота.",
      audioRoutes: "Аудіомаршрути", perSource: "окремо для кожного джерела", playbackOutput: "Вихід відтворення", change: "змінити",
      configure: "налаштувати", perApp: "Гучність по застосунках", sliderHint: "Тап по повзунку — точний рівень",
      volumeOf: "Гучність: {label}", unmute: "Увімкнути {label}", mute: "Вимкнути {label}",
      noteAudio: "Налаштування зберігаються локально у virtual mode. Пізніше вони передаватимуться реальному мікшеру бота.",
      routeBot: "Голос бота", routeAlarm: "Будильник", toastVirtual: "Поки показую virtual mode",
      toastPickOutput: "Оберіть вихід у Bluetooth-пристроях", toastMic: "Мікрофон налаштовано для ASR",
      toastPairRequest: "Запит на підключення збережено", toastNetwork: "Мережу {ssid} обрано",
    },
    en: {
      title: "Connections", nav: "Device settings", tabConnections: "Network", tabAudio: "Sound",
      signal: "Signal {v}%", botName: "Claude Bot", virtualDevice: "virtual device", systemConnected: "system connected",
      charging: "charging", onBattery: "on battery", connections: "Connections", demoMode: "DEMO MODE", live: "LIVE",
      noNetwork: "No network chosen", noIp: "no IP", connected: "connected", ready: "ready", readyToPair: "ready to pair",
      enabled: "on", off: "off", audioNow: "Audio now", inOut: "in · out", builtinSpeaker: "Built-in speaker",
      builtinMic: "Built-in microphone", voiceOutput: "Output for the bot's voice", asrInput: "Input for speech recognition", active: "active",
      refresh: "Refresh status", noteConnections: "In virtual mode connections are simulated. On a Raspberry Pi the same cards show the real state.",
      back: "Back to connections", wifiNetworks: "Wi‑Fi networks", secured: "Secured network", open: "Open network",
      activeNet: "active", choose: "choose", noteWifi: "Tapping a network saves the choice locally in virtual mode. A native adapter will make it real.",
      btDevices: "Bluetooth devices", notConnected: "not connected", battery: "battery {n}%", connect: "connect", scan: "Scan again",
      noteBt: "Search and pairing become real once the bot's Bluetooth module is connected.",
      audioRoutes: "Audio routes", perSource: "per source", playbackOutput: "Playback output", change: "change",
      configure: "configure", perApp: "Volume per app", sliderHint: "Tap the slider for an exact level",
      volumeOf: "Volume: {label}", unmute: "Unmute {label}", mute: "Mute {label}",
      noteAudio: "Settings are stored locally in virtual mode. Later they will go to the bot's real mixer.",
      routeBot: "Bot voice", routeAlarm: "Alarm", toastVirtual: "Showing virtual mode for now",
      toastPickOutput: "Pick an output among the Bluetooth devices", toastMic: "Microphone set up for ASR",
      toastPairRequest: "Pairing request saved", toastNetwork: "Network {ssid} chosen",
    },
  };
  // The kit already knows the screen's language (botScreenLang)
  let lang = window.BotApp ? BotApp.lang : "uk";
  function t(key, vars) {
    let text = STR[lang][key] ?? STR.uk[key] ?? key;
    if (vars) text = text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
    return text;
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  }
  const $ = (selector) => document.querySelector(selector);
  const state = { data: null, tab: "connections", detail: null, toastTimer: null };
  const storageKey = "device-settings.audio-routes";
  const outputKey = "device-settings.output";

  const icons = {
    bot: '<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="13" rx="3"/><path d="M8 6V4m8 2V4M8 13h.01M16 13h.01M9 17h6"/></svg>',
    wifi: '<svg viewBox="0 0 24 24"><path d="M3 8.5a14 14 0 0 1 18 0M6.5 12a8.5 8.5 0 0 1 11 0M10 15.5a3.5 3.5 0 0 1 4 0M12 19h.01"/></svg>',
    bluetooth: '<svg viewBox="0 0 24 24"><path d="m8 7 8 10-4 3V4l4 4-8 9"/></svg>',
    headphones: '<svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><path d="M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1z"/></svg>',
    speaker: '<svg viewBox="0 0 24 24"><path d="M4 10h4l5-4v12l-5-4H4zM17 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>',
    mic: '<svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/></svg>',
    youtube: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="m10 10 5 2-5 2z"/></svg>',
    alarm: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2 1M5 5 3 7m16-2 2 2"/></svg>',
    bell: '<svg viewBox="0 0 24 24"><path d="M6 17h12l-1.5-2v-4a4.5 4.5 0 0 0-9 0v4zM10 20h4"/></svg>',
    keyboard: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>',
    refresh: '<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.8-3L3 11m0 0V6m0 5h5M4 13a8 8 0 0 0 14.8 3L21 13m0 0v5m0-5h-5"/></svg>',
    arrow: '<svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>',
    back: '<svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h13"/></svg>',
    volume: '<svg viewBox="0 0 24 24"><path d="M4 10h4l5-4v12l-5-4H4zM17 9a4 4 0 0 1 0 6"/></svg>',
    mute: '<svg viewBox="0 0 24 24"><path d="M4 10h4l5-4v12l-5-4H4zM18 9l3 3m0-3-3 3"/></svg>'
  };

  function icon(name) { return icons[name] || icons.bot; }
  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
  }
  function loadJson(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key) || "") || fallback; } catch (_) { return fallback; }
  }
  function saveJson(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} }
  function showToast(message, error = false) {
    const toast = $("#toast");
    toast.textContent = message;
    toast.classList.toggle("error", error);
    toast.classList.add("show");
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
  }
  // "*" because a shared package runs with an opaque origin, where naming
  // our own origin as the target would drop the message.
  function post(type, payload = {}) { try { window.parent.postMessage({ type, ...payload }, "*"); } catch (_) {} }

  function signal(value) {
    const filled = Math.max(0, Math.min(4, Math.round(Number(value || 0) / 25)));
    return `<span class="signal" aria-label="${escapeHtml(t("signal", { v: value }))}">${[1, 2, 3, 4].map((item) => `<i class="${item <= filled ? "signal-on" : ""}"></i>`).join("")}</span>`;
  }
  // One list row: round icon, title over subtitle, and whatever goes on the right.
  function row({ tag = "div", attrs = "", ico, on = false, title, sub, right = "" }) {
    return `<${tag} class="kit-item row" ${tag === "button" ? 'type="button"' : ""} ${attrs}><span class="ico ${on ? "on" : ""}">${icon(ico)}</span>` +
      `<span class="kit-grow"><span class="row-title">${title}</span><span class="row-sub">${sub}</span></span>${right}</${tag}>`;
  }
  function section(label, badge) {
    return `<div class="sec"><span class="kit-label">${label}</span>${badge ? `<span class="badge">${badge}</span>` : ""}</div>`;
  }

  function renderBar() {
    const detail = state.tab === "connections" ? state.detail : null;
    const data = state.data || {};
    $("#backBtn").hidden = !detail;
    $("#backBtn").innerHTML = icon("back");
    $("#tabs").hidden = !!detail;
    $("#badge").hidden = !detail;
    $("#barTitle").textContent = detail === "wifi" ? t("wifiNetworks") : detail === "bluetooth" ? t("btDevices") : t("title");
    if (detail === "wifi") $("#badge").textContent = t((data.wifi || {}).status === "connected" ? "connected" : "off");
    if (detail === "bluetooth") $("#badge").textContent = t((data.bluetooth || {}).enabled ? "enabled" : "off");
    document.querySelectorAll("[data-tab]").forEach((tab) => tab.classList.toggle("on", tab.dataset.tab === state.tab));
  }
  function summaryHtml() {
    const data = state.data || {};
    const device = data.device || {};
    const battery = device.battery || {};
    const level = Math.max(0, Math.min(100, battery.level ?? 82));
    return `<div class="kit-card hi summary"><span class="ico lg on">${icon("bot")}</span>
      <div class="kit-grow" style="flex:1;min-width:0"><div class="summary-name">${escapeHtml(device.name || t("botName"))}</div>
        <div class="summary-sub kit-label"><span class="dot"></span>${t(data.mode === "virtual" ? "virtualDevice" : "systemConnected")}</div></div>
      <div class="battery"><div class="battery-top"><span class="battery-pct">${battery.level ?? 82}%</span><span class="battery-shell"><span class="battery-fill" style="width:${level}%"></span></span></div>
        <span class="kit-label">${t(battery.charging ? "charging" : "onBattery")}</span></div></div>`;
  }
  function renderConnections() {
    const data = state.data || {};
    if (state.detail === "wifi") return renderWifiDetail(data.wifi || {});
    if (state.detail === "bluetooth") return renderBluetoothDetail(data.bluetooth || {});
    const wifi = data.wifi || {};
    const bluetooth = data.bluetooth || {};
    const audio = data.audio || {};
    const headphones = (bluetooth.devices || []).find((device) => device.kind === "headphones");
    const wifiOn = wifi.status === "connected";
    $("#content").innerHTML = `<div class="stack">
      ${summaryHtml()}
      ${section(t("connections"), t(data.mode === "virtual" ? "demoMode" : "live"))}
      <div class="kit-list">
        ${row({ tag: "button", attrs: 'data-detail="wifi"', ico: "wifi", on: wifiOn, title: "Wi‑Fi",
          sub: `${escapeHtml(wifi.ssid || t("noNetwork"))} · ${escapeHtml(wifi.ip || t("noIp"))}`,
          right: `<span class="state"><span class="state-text ${wifiOn ? "" : "ready"}">${t(wifiOn ? "connected" : "ready")}</span>${signal(wifi.signal)}</span><span class="chev">${icon("arrow")}</span>` })}
        ${row({ tag: "button", attrs: 'data-detail="bluetooth"', ico: "bluetooth", on: !!headphones?.connected, title: "Bluetooth",
          sub: headphones?.connected ? escapeHtml(headphones.name) + " · " + (headphones.battery ?? 0) + "%" : t("readyToPair"),
          right: `<span class="state"><span class="state-text ${headphones?.connected ? "" : "ready"}">${t(headphones?.connected ? "connected" : "enabled")}</span></span><span class="chev">${icon("arrow")}</span>` })}
      </div>
      ${section(t("audioNow"), t("inOut"))}
      <div class="kit-list">
        ${row({ ico: audio.output?.icon || "speaker", title: escapeHtml(audio.output?.name || t("builtinSpeaker")), sub: t("voiceOutput"),
          right: `<span class="state-text">${t("active")}</span>` })}
        ${row({ ico: "mic", title: escapeHtml(audio.input?.name || t("builtinMic")), sub: t("asrInput"),
          right: `<span class="state-text">${t("active")}</span>` })}
      </div>
      <button class="kit-btn tonal block" type="button" data-action="refresh">${icon("refresh")}<span>${t("refresh")}</span></button>
      <div class="note">${t("noteConnections")}</div>
    </div>`;
  }
  function renderWifiDetail(wifi) {
    const networks = wifi.networks || [];
    $("#content").innerHTML = `<div class="stack"><div class="kit-list">${networks.map((network) => row({
      tag: "button", attrs: `data-network="${escapeHtml(network.ssid)}"`, ico: "wifi", on: !!network.known,
      title: escapeHtml(network.ssid), sub: t(network.secured ? "secured" : "open"),
      right: `${signal(network.signal)}<span class="state-text ${network.known ? "" : "ready"}">${t(network.known ? "activeNet" : "choose")}</span>`,
    })).join("")}</div><div class="note">${t("noteWifi")}</div></div>`;
  }
  function renderBluetoothDetail(bluetooth) {
    const devices = bluetooth.devices || [];
    $("#content").innerHTML = `<div class="stack"><div class="kit-list">${devices.map((device) => row({
      tag: "button", attrs: `data-device="${escapeHtml(device.id)}"`, ico: device.icon, on: !!device.connected,
      title: escapeHtml(device.name), sub: device.battery == null ? t("notConnected") : t("battery", { n: device.battery }),
      right: `<span class="state-text ${device.connected ? "" : "ready"}">${t(device.connected ? "connected" : "connect")}</span>`,
    })).join("")}</div><button class="kit-btn tonal block" type="button" data-action="scan">${icon("refresh")}<span>${t("scan")}</span></button><div class="note">${t("noteBt")}</div></div>`;
  }
  function routes() {
    const defaults = (state.data?.audio?.routes || []).map((route) => ({ ...route }));
    const saved = loadJson(storageKey, {});
    // Demo data carries keys, not text, so a language switch relabels it.
    return defaults.map((route) => ({ ...route, ...(saved[route.id] || {}), label: route.label || t(route.labelKey) }));
  }
  function renderAudio() {
    const audio = state.data?.audio || {};
    const devices = (audio.devices || []).filter((device) => device.kind === "output");
    const output = audio.output || devices[0] || { icon: "speaker" };
    $("#content").innerHTML = `<div class="stack">
      ${section(t("audioRoutes"), t("perSource"))}
      <div class="kit-list">
        ${row({ ico: output.icon || "speaker", on: true, title: escapeHtml(output.name || t("builtinSpeaker")), sub: t("playbackOutput"),
          right: `<button class="kit-chip" type="button" data-action="output">${t("change")}</button>` })}
        ${row({ ico: audio.input?.icon || "mic", title: escapeHtml(audio.input?.name || t("builtinMic")), sub: t("asrInput"),
          right: `<button class="kit-chip" type="button" data-action="input">${t("configure")}</button>` })}
      </div>
      <div class="kit-card mixer">
        <div class="mixer-head"><span class="mixer-title">${t("perApp")}</span><span class="mixer-hint">${t("sliderHint")}</span></div>
        ${routes().map((route) => `<div class="route ${route.muted ? "muted" : ""}"><span class="ico">${icon(route.icon)}</span>
          <span class="route-copy"><span class="route-name">${escapeHtml(route.label)}</span><input class="kit-slider" type="range" min="0" max="100" value="${Math.max(0, Math.min(100, route.volume ?? 0))}" data-route="${escapeHtml(route.id)}" aria-label="${escapeHtml(t("volumeOf", { label: route.label }))}"></span>
          <span class="route-value" data-value="${escapeHtml(route.id)}">${route.muted ? "—" : route.volume}%</span>
          <button class="kit-btn icon ${route.muted ? "on" : ""}" type="button" data-mute="${escapeHtml(route.id)}" aria-label="${escapeHtml(t(route.muted ? "unmute" : "mute", { label: route.label }))}">${icon(route.muted ? "mute" : "volume")}</button></div>`).join("")}
      </div>
      <div class="note">${t("noteAudio")}</div>
    </div>`;
  }
  function render() {
    renderBar();
    if (state.tab === "audio") renderAudio(); else renderConnections();
    // Sliders built from a template need their fill painted once
    if (window.BotApp) BotApp.paint();
  }
  async function refresh() {
    try {
      const response = await fetch("/api/system/status", { cache: "no-store" });
      if (!response.ok) throw new Error("status");
      state.data = await response.json();
    } catch (_) {
      state.data = { mode: "virtual", device: { battery: { level: 82, charging: true } }, wifi: { status: "connected", ssid: "Claude-Bot", ip: "192.168.1.42", signal: 86, networks: [] }, bluetooth: { enabled: true, devices: [] }, audio: { output: { icon: "speaker" }, input: { icon: "mic" }, routes: [{ id: "bot", labelKey: "routeBot", icon: "bot", volume: 72 }, { id: "youtube", label: "YouTube", icon: "youtube", volume: 58 }, { id: "alarm", labelKey: "routeAlarm", icon: "alarm", volume: 84 }] } };
      showToast(t("toastVirtual"), true);
    }
    render();
  }
  function updateRoute(id, changes) {
    const saved = loadJson(storageKey, {});
    saved[id] = { ...(saved[id] || {}), ...changes };
    saveJson(storageKey, saved);
    post("botAudioRoute", { routeId: id, ...changes });
  }
  document.addEventListener("click", (event) => {
    const tab = event.target.closest("[data-tab]");
    if (tab) { state.tab = tab.dataset.tab; state.detail = null; render(); return; }
    const detail = event.target.closest("[data-detail]");
    if (detail) { state.detail = detail.dataset.detail; render(); $("#content").scrollTop = 0; return; }
    const action = event.target.closest("[data-action]");
    if (action) {
      if (action.dataset.action === "back") { state.detail = null; render(); }
      if (action.dataset.action === "refresh" || action.dataset.action === "scan") refresh();
      if (action.dataset.action === "output") { state.tab = "connections"; state.detail = "bluetooth"; render(); showToast(t("toastPickOutput")); }
      if (action.dataset.action === "input") showToast(t("toastMic"));
      return;
    }
    const mute = event.target.closest("[data-mute]");
    if (mute) {
      const route = routes().find((item) => item.id === mute.dataset.mute);
      updateRoute(mute.dataset.mute, { muted: !route?.muted });
      const scroll = $("#content").scrollTop;
      render();
      $("#content").scrollTop = scroll;
    }
    const device = event.target.closest("[data-device]");
    if (device) { post("botBluetoothDevice", { deviceId: device.dataset.device }); showToast(t("toastPairRequest")); }
    const network = event.target.closest("[data-network]");
    if (network) { post("botWifiNetwork", { ssid: network.dataset.network }); showToast(t("toastNetwork", { ssid: network.dataset.network })); }
  });
  document.addEventListener("input", (event) => {
    const range = event.target.closest("[data-route]");
    if (!range) return;
    const value = Number(range.value);
    const label = Array.from(document.querySelectorAll("[data-value]"))
      .find((node) => node.dataset.value === range.dataset.route);
    if (label) label.textContent = `${value}%`;
    const routeRow = range.closest(".route");
    if (routeRow) { routeRow.classList.remove("muted"); routeRow.querySelector("[data-mute]")?.classList.remove("on"); }
    updateRoute(range.dataset.route, { volume: value, muted: false });
  });

  applyI18n();
  refresh();

  // The screen's style and theme are applied by the kit; the app only
  // follows the language.
  if (window.BotApp) BotApp.onChange((s) => {
    if (s.lang !== lang) { lang = s.lang; applyI18n(); if (state.data) render(); }
  });
</script>
</body>
</html>
