<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<!-- App kit v1: the screen's own look (Material You or Deep UI, any theme
     or skin) and its safe insets. See docs/SCREEN-PLATFORM.md §2.6. -->
<link rel="stylesheet" href="/static/screen/app-kit.css">
<script src="/static/screen/app-kit.js"></script>
<style>
  /* Only what is 2048's own: the board, the tiles and the side column.
     Every colour is made from the screen's tokens, so the board follows a
     style, theme or skin switch without a line of JS. */
  [hidden] { display: none !important; }
  .game { flex-direction: row; gap: 10px; }

  /* ---- Board ---- */
  .board-box { position: relative; display: grid; place-items: center; flex: 1; min-width: 0; min-height: 0; touch-action: none; }
  .board { position: relative; border-radius: 14px; background: var(--kit-surface); }
  :root[data-ui="deep"] .board {
    background: linear-gradient(180deg, color-mix(in srgb, var(--text) 8%, var(--bg)), color-mix(in srgb, var(--text) 4%, var(--bg)));
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text) 14%, transparent);
  }
  :root[data-ui="deep"][data-theme="light"] .board { background: #fff; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.07); }
  .slot { position: absolute; left: 0; top: 0; border-radius: 9px; background: color-mix(in srgb, var(--text) 6%, var(--kit-surface)); }
  :root[data-ui="deep"] .slot { border-radius: 11px; background: color-mix(in srgb, var(--text) 6%, transparent); }

  /* ---- Tiles: --c is the tile's colour, --on its text ---- */
  .tile { position: absolute; left: 0; top: 0; transition: transform 110ms ease-out; will-change: transform; }
  .tile.merged-top { z-index: 2; }
  .tile-in {
    display: grid; place-items: center; width: 100%; height: 100%;
    border-radius: 9px; background: var(--c); color: var(--on);
    font: 800 16px/1 var(--font); letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  }
  /* Deep UI: each tile is lit glass in its own hue, light at the top and
     deep at the bottom; one hue per tile, never two. */
  :root[data-ui="deep"] .tile-in {
    border-radius: 11px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 84%, #fff), color-mix(in srgb, var(--c) 84%, #000));
  }
  .tile-in.new { animation: appear 140ms ease-out 90ms backwards; }
  .tile-in.merged { animation: pop 170ms ease-out 80ms backwards; }
  @keyframes appear { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.7); } 60% { opacity: 1; transform: scale(1.12); } 100% { transform: scale(1); } }

  /* The ramp: small tiles are tonal steps of the accent, then the accent
     itself, then the screen's "ok" colour for the hundreds, and 2048 wears
     the primary action's colour. */
  .v2 { --c: color-mix(in srgb, var(--accent) 24%, var(--panel)); --on: var(--text); }
  .v4 { --c: color-mix(in srgb, var(--accent) 36%, var(--panel)); --on: var(--text); }
  .v8 { --c: color-mix(in srgb, var(--accent) 50%, var(--panel)); --on: var(--text); }
  .v16 { --c: color-mix(in srgb, var(--accent) 66%, var(--panel)); --on: var(--kit-on-accent); }
  .v32 { --c: color-mix(in srgb, var(--accent) 80%, var(--panel)); --on: var(--kit-on-accent); }
  .v64 { --c: var(--accent); --on: var(--kit-on-accent); }
  .v128 { --c: color-mix(in srgb, var(--ok) 55%, var(--panel)); --on: var(--text); }
  .v256 { --c: color-mix(in srgb, var(--ok) 75%, var(--panel)); --on: color-mix(in srgb, var(--ok) 18%, #000); }
  .v512 { --c: var(--ok); --on: color-mix(in srgb, var(--ok) 18%, #000); }
  .v1024 { --c: color-mix(in srgb, var(--ok) 72%, #000); --on: #fff; }
  .v2048 { --c: color-mix(in srgb, var(--accent) 58%, #fff); --on: color-mix(in srgb, var(--accent) 35%, #000); }
  .vbig { --c: var(--text); --on: var(--bg); }
  /* On a light panel the middle of the ramp is pale: dark text reads there */
  :root[data-theme="light"] .v16 { --c: color-mix(in srgb, var(--accent) 72%, var(--panel)); --on: color-mix(in srgb, var(--accent) 30%, #000); }

  /* ---- Side column: name, score, best, actions ---- */
  .side { display: flex; flex-direction: column; gap: 6px; width: 84px; flex: none; min-height: 0; }
  .side .kit-bar { min-height: 22px; }
  .side .kit-sub { margin-top: -4px; display: flex; align-items: center; gap: 4px; }
  .side .kit-sub svg { width: 12px; height: 12px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stat { padding: 7px 10px; border-radius: 14px; }
  .stat-value { margin-top: 3px; font: 700 18px/1 var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
    transition: transform 120ms ease; transform-origin: left center; }
  .stat-value.long { font-size: 15px; }
  .stat-value.bump { transform: scale(1.1); }
  .stat.best .stat-value { color: var(--kit-on-tonal); }
  .side .spacer { flex: 1; }
  .side .kit-row { gap: 8px; }
  @media (max-height: 200px) {
    .side { gap: 4px; }
    .stat { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; padding: 4px 8px; }
    .stat-value { margin: 0; font-size: 14px; }
    .side .kit-btn.icon { width: 34px; height: 34px; }
  }

  /* ---- Win / game-over card over the board ---- */
  /* Inside the board, above every tile (tiles are appended after it) */
  .overlay { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    border-radius: 14px; background: color-mix(in srgb, var(--bg) 62%, transparent);
    opacity: 0; pointer-events: none; transition: opacity 200ms ease; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .ov-card { display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 86%; padding: 12px 14px; text-align: center;
    transform: scale(0.94); transition: transform 200ms ease; }
  .overlay.show .ov-card { transform: none; }
  .ov-title { font: 800 18px/1.15 var(--font); letter-spacing: -0.01em; }
  .ov-actions { display: flex; gap: 6px; margin-top: 6px; }
  .ov-actions .kit-btn { min-height: 30px; padding: 0 12px; font-size: 12px; }
</style>
</head>
<body class="kit">
  <main class="kit-app game">
    <div class="board-box" id="boardBox">
      <div class="board" id="board">
        <div class="overlay" id="overlay">
          <div class="ov-card kit-card hi">
            <div class="ov-title" id="ovTitle"></div>
            <div class="kit-label" id="ovSub"></div>
            <div class="ov-actions" id="ovActions"></div>
          </div>
        </div>
      </div>
    </div>
    <aside class="side">
      <header class="kit-bar"><span class="kit-title" data-i18n="title"></span></header>
      <span class="kit-sub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg><span id="hint" data-i18n="hint"></span></span>
      <div class="kit-card stat"><div class="kit-label" data-i18n="score"></div><div class="stat-value" id="score">0</div></div>
      <div class="kit-card stat best"><div class="kit-label" data-i18n="best"></div><div class="stat-value" id="best">0</div></div>
      <span class="spacer"></span>
      <div class="kit-row">
        <button class="kit-btn icon" id="undoBtn" type="button" data-i18n-aria="undo">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button class="kit-btn icon tonal" id="newBtn" type="button" data-i18n-aria="newGame">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.8-3L3 11m0 0V6m0 5h5M4 13a8 8 0 0 0 14.8 3L21 13m0 0v5m0-5h-5"/></svg>
        </button>
      </div>
    </aside>
  </main>
<script>
  const APP_ID = "game-2048";
  const STR = {
    uk: {
      title: "2048", hint: "Свайп", close: "Закрити", score: "Очки", best: "Рекорд",
      undo: "Назад", newGame: "Нова", winTitle: "2048!", winSub: "Можна грати далі за рекордом",
      keepGoing: "Далі", overTitle: "Ходів немає", overSub: "Рахунок: {score}",
    },
    en: {
      title: "2048", hint: "Swipe", close: "Close", score: "Score", best: "Best",
      undo: "Undo", newGame: "New", winTitle: "2048!", winSub: "Keep going for a high score",
      keepGoing: "Continue", overTitle: "No moves left", overSub: "Score: {score}",
    },
  };

  // Storage throws inside a sandboxed iframe (a shared package runs with an
  // opaque origin), so every access is guarded and the game keeps its state
  // in memory instead of failing.
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(APP_ID + "." + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
  }

  // The kit already knows the screen's language (botScreenLang)
  let lang = window.BotApp ? BotApp.lang : "uk";
  function t(key, vars) {
    let text = STR[lang][key] ?? STR.uk[key] ?? key;
    if (vars) text = text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
    return text;
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    if (overlayMode) showOverlay(overlayMode);
  }

  const N = 4, GAP = 6;
  const boardEl = document.getElementById("board");
  const boxEl = document.getElementById("boardBox");
  let grid = [], score = 0, best = load("best", 0), won = false, keepPlaying = false;
  let undoState = null, nextId = 1, cellPx = 40, overlayMode = null;

  function emptyGrid() { return Array.from({ length: N }, () => Array(N).fill(null)); }
  function pos(r, c) { return "translate(" + (GAP + c * (cellPx + GAP)) + "px," + (GAP + r * (cellPx + GAP)) + "px)"; }
  function fontFor(v) {
    const digits = String(v).length;
    return Math.round(cellPx * (digits <= 2 ? 0.44 : digits === 3 ? 0.36 : digits === 4 ? 0.29 : 0.23)) + "px";
  }

  function makeTile(v, r, c, anim) {
    const tile = { id: nextId++, v, r, c, el: document.createElement("div") };
    tile.el.className = "tile" + (anim === "merged" ? " merged-top" : "");
    tile.el.style.width = tile.el.style.height = cellPx + "px";
    tile.el.style.transform = pos(r, c);
    const inner = document.createElement("div");
    inner.className = "tile-in " + (v > 2048 ? "vbig" : "v" + v) + (anim ? " " + anim : "");
    inner.style.fontSize = fontFor(v);
    inner.textContent = v;
    tile.el.appendChild(inner);
    boardEl.appendChild(tile.el);
    return tile;
  }

  // The board takes the largest square the box allows, so the same code
  // fits the full 320x240 panel and a smaller window.
  function layout() {
    const size = Math.max(120, Math.floor(Math.min(boxEl.clientWidth, boxEl.clientHeight)));
    cellPx = Math.floor((size - GAP * (N + 1)) / N);
    const real = cellPx * N + GAP * (N + 1);
    boardEl.style.width = boardEl.style.height = real + "px";
    boardEl.querySelectorAll(".slot").forEach((el) => el.remove());
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.style.width = slot.style.height = cellPx + "px";
      slot.style.transform = pos(r, c);
      boardEl.appendChild(slot);
    }
    renderFromValues(values());
  }

  function values() { return grid.map((row) => row.map((tile) => (tile ? tile.v : 0))); }
  function renderFromValues(vals) {
    boardEl.querySelectorAll(".tile").forEach((el) => el.remove());
    grid = emptyGrid();
    vals.forEach((row, r) => row.forEach((v, c) => { if (v) grid[r][c] = makeTile(v, r, c, null); }));
  }

  function addRandom() {
    const free = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) free.push([r, c]);
    if (!free.length) return;
    const [r, c] = free[Math.floor(Math.random() * free.length)];
    grid[r][c] = makeTile(Math.random() < 0.9 ? 2 : 4, r, c, "new");
  }

  function canMove() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const tile = grid[r][c];
      if (!tile) return true;
      if (c + 1 < N && grid[r][c + 1] && grid[r][c + 1].v === tile.v) return true;
      if (r + 1 < N && grid[r + 1][c] && grid[r + 1][c].v === tile.v) return true;
    }
    return false;
  }

  function move(dir) {
    if (overlayMode) return;
    const [dr, dc] = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] }[dir];
    const rowsOrder = [...Array(N).keys()], colsOrder = [...Array(N).keys()];
    if (dr === 1) rowsOrder.reverse();
    if (dc === 1) colsOrder.reverse();
    const before = { vals: values(), score };
    const mergedNow = new Set();
    const dying = [];
    let moved = false, gained = 0;
    for (const r of rowsOrder) for (const c of colsOrder) {
      const tile = grid[r][c];
      if (!tile) continue;
      let pr = r, pc = c, nr = r + dr, nc = c + dc;
      while (nr >= 0 && nr < N && nc >= 0 && nc < N && !grid[nr][nc]) { pr = nr; pc = nc; nr += dr; nc += dc; }
      const next = nr >= 0 && nr < N && nc >= 0 && nc < N ? grid[nr][nc] : null;
      if (next && next.v === tile.v && !mergedNow.has(next.id)) {
        grid[r][c] = null;
        tile.el.style.transform = pos(nr, nc);
        dying.push(tile, next);
        const merged = makeTile(tile.v * 2, nr, nc, "merged");
        mergedNow.add(merged.id);
        grid[nr][nc] = merged;
        gained += merged.v;
        if (merged.v === 2048 && !won) won = true;
        moved = true;
      } else if (pr !== r || pc !== c) {
        grid[r][c] = null;
        grid[pr][pc] = tile;
        tile.r = pr; tile.c = pc;
        tile.el.style.transform = pos(pr, pc);
        moved = true;
      }
    }
    if (!moved) return;
    // Merged sources slide under the new tile, then disappear.
    setTimeout(() => dying.forEach((tile) => tile.el.remove()), 120);
    undoState = before;
    score += gained;
    if (score > best) { best = score; save("best", best); }
    addRandom();
    persist();
    updateHud(gained > 0);
    if (won && !keepPlaying) showOverlay("win");
    else if (!canMove()) showOverlay("over");
  }

  function persist() { save("state", { vals: values(), score, won, keepPlaying }); }

  function newGame() {
    grid = emptyGrid();
    boardEl.querySelectorAll(".tile").forEach((el) => el.remove());
    score = 0; won = false; keepPlaying = false; undoState = null;
    addRandom(); addRandom();
    hideOverlay();
    persist();
    updateHud(false);
  }

  function undo() {
    if (!undoState) return;
    renderFromValues(undoState.vals);
    score = undoState.score;
    undoState = null;
    hideOverlay();
    persist();
    updateHud(false);
  }

  function setStat(el, value) {
    el.textContent = value;
    // Six digits do not fit the narrow card at full size
    el.classList.toggle("long", String(value).length > 5);
  }
  function updateHud(bump) {
    const s = document.getElementById("score");
    setStat(s, score);
    setStat(document.getElementById("best"), best);
    document.getElementById("undoBtn").disabled = !undoState;
    if (bump) { s.classList.add("bump"); setTimeout(() => s.classList.remove("bump"), 120); }
  }

  function showOverlay(mode) {
    overlayMode = mode;
    const actions = document.getElementById("ovActions");
    document.getElementById("ovTitle").textContent = t(mode === "win" ? "winTitle" : "overTitle");
    document.getElementById("ovSub").textContent = mode === "win" ? t("winSub") : t("overSub", { score });
    actions.innerHTML = "";
    const add = (key, primary, fn) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "kit-btn" + (primary ? " primary" : " tonal");
      b.textContent = t(key);
      b.addEventListener("click", fn);
      actions.appendChild(b);
    };
    if (mode === "win") add("keepGoing", true, () => { keepPlaying = true; persist(); hideOverlay(); });
    if (mode === "over" && undoState) add("undo", false, undo);
    add("newGame", mode === "over", newGame);
    document.getElementById("overlay").classList.add("show");
  }
  function hideOverlay() { overlayMode = null; document.getElementById("overlay").classList.remove("show"); }

  let swipe = null;
  boxEl.addEventListener("pointerdown", (event) => {
    if (event.target.closest("button")) return;
    swipe = { x: event.clientX, y: event.clientY, id: event.pointerId };
    try { boxEl.setPointerCapture(event.pointerId); } catch (_) {}
  });
  // Fires on the move itself rather than on release: on a resistive screen
  // the release point is noisy, the first 20px of travel are not.
  boxEl.addEventListener("pointermove", (event) => {
    if (!swipe || swipe.id !== event.pointerId) return;
    const dx = event.clientX - swipe.x, dy = event.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    swipe = null;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  const endSwipe = () => { swipe = null; };
  boxEl.addEventListener("pointerup", endSwipe);
  boxEl.addEventListener("pointercancel", endSwipe);
  document.addEventListener("keydown", (event) => {
    const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
    if (map[event.key]) { event.preventDefault(); move(map[event.key]); }
  });
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("newBtn").addEventListener("click", newGame);
  window.addEventListener("resize", layout);

  applyI18n();
  grid = emptyGrid();
  const saved = load("state", null);
  const valid = saved && Array.isArray(saved.vals) && saved.vals.length === N && saved.vals.every((row) => Array.isArray(row) && row.length === N);
  layout();
  if (valid) {
    renderFromValues(saved.vals.map((row) => row.map((v) => (Number.isInteger(v) && v > 0 ? v : 0))));
    score = Number(saved.score) || 0; won = !!saved.won; keepPlaying = !!saved.keepPlaying;
    if (!values().some((row) => row.some(Boolean))) newGame();
    else if (!canMove()) showOverlay("over");
  } else {
    newGame();
  }
  updateHud(false);

  // The screen's style, theme and skin are applied by the kit, and the
  // tiles take their colours from its tokens in CSS; the game only follows
  // the language.
  if (window.BotApp) BotApp.onChange((s) => { if (s.lang !== lang) { lang = s.lang; applyI18n(); } });
</script>
</body>
</html>
