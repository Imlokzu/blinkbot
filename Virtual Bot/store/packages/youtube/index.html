<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>YouTube</title>
<!-- App kit v1: the screen's own look (Material You or Deep UI, any theme
     or skin) and its safe insets. See docs/SCREEN-PLATFORM.md §2.6. -->
<link rel="stylesheet" href="/static/screen/app-kit.css">
<script src="/static/screen/app-kit.js"></script>
<style>
  /* Only what is YouTube's own: the search field, video rows, the player
     and its two sheets. Colours, buttons, chips, switches and lists are kit
     parts in the screen's style. */

  /* Icons: viewBox 24x24, stroke-only currentColor, no fill (the contract
     of static/screen/icons.js). Kept in the package: it must stay
     self-contained. */
  svg { width: 16px; height: 16px; flex: none; fill: none;
    stroke: currentColor; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Home: search bar ---------- */
  /* The field IS the bar, as in a phone's video app: the magnifier inside it
     searches, the cross clears. */
  .search { flex: 1; min-width: 0; height: 34px; display: flex; align-items: center;
    gap: 2px; padding: 0 4px; box-sizing: border-box; border-radius: 17px;
    background: var(--kit-surface-hi); }
  :root[data-ui="deep"] .search { border: 1px solid transparent;
    background: linear-gradient(var(--kit-surface-hi), var(--kit-surface-hi)) padding-box, var(--kit-edge) border-box; }
  .search:focus-within { background: var(--kit-tonal); }
  :root[data-ui="deep"] .search:focus-within {
    background: linear-gradient(var(--kit-tonal), var(--kit-tonal)) padding-box, var(--kit-edge) border-box; }
  .search input { flex: 1; min-width: 0; height: 100%; padding: 0 2px; border: 0;
    background: transparent; color: var(--text); font: 500 13px/1 var(--font); outline: none; }
  .search input::placeholder { color: var(--muted); font-weight: 400; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .fbtn { flex: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--muted); cursor: pointer;
    transition: transform 110ms ease, opacity 110ms ease; }
  .fbtn:active { transform: scale(0.9); }
  .fbtn:disabled { opacity: 0.4; }
  .fbtn[hidden] { display: none; }
  .search:focus-within #go { color: var(--kit-on-tonal); }
  .kit-bar .kit-btn.icon { width: 34px; height: 34px; }

  /* Sort chips and the status line share one row. The order is REMEMBERED:
     whoever wants the newest uploads does not want to pick it again. */
  .tools { flex: none; gap: 10px; }
  .status { flex: 1; min-width: 0; text-align: right; font-size: 10.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status.now { color: var(--accent); font-weight: 600; }

  /* ---------- Home: results ---------- */
  #grid { display: flex; flex-direction: column; gap: 6px; margin: 0 -2px; padding: 0 2px; }
  .shelf { font: 600 11px/1.2 var(--font); color: var(--muted); padding: 4px 4px 0; }
  :root[data-ui="material"] .shelf { letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; }
  :root[data-ui="deep"] .shelf { color: var(--text); font-size: 12px; font-weight: 700; }
  .recent .kit-chip { max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* One video per row: a phone's list on a 320 px screen shows more than
     two cramped columns, and the title gets room to be read. */
  .card { width: 100%; min-height: 0; padding: 5px; gap: 9px; border: 0;
    color: var(--text); font: inherit; text-align: left; cursor: pointer;
    transition: transform 110ms ease; }
  .card:active { transform: scale(0.98); }
  .card:disabled { opacity: 0.5; }
  .kit-list > .card { border-radius: 10px; }
  .kit-list > .card:first-child { border-top-left-radius: var(--kit-radius); border-top-right-radius: var(--kit-radius); }
  .kit-list > .card:last-child { border-bottom-left-radius: var(--kit-radius); border-bottom-right-radius: var(--kit-radius); }
  /* aspect-ratio, not a fixed height: the preview must stay 16:9. */
  .tbox { position: relative; flex: none; width: 86px; aspect-ratio: 16 / 9;
    border-radius: 8px; overflow: hidden; background: var(--kit-surface-hi); }
  :root[data-ui="deep"] .tbox { border-radius: 11px; }
  .thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Duration and live badges sit on the picture, as on every video app */
  .badge { position: absolute; right: 4px; bottom: 4px; padding: 1px 4px; border-radius: 4px;
    background: rgba(0, 0, 0, 0.78); color: #fff; font: 600 9px/1.35 var(--font);
    font-variant-numeric: tabular-nums; }
  /* A live stream has no muxed track, so say so NOW rather than after a
     tap into silence. The dot is CSS: a glyph sits off the baseline. */
  .badge.live { background: var(--kit-primary); color: var(--kit-on-accent); letter-spacing: 0.04em; }
  .live::before { content: ""; display: inline-block; width: 5px; height: 5px;
    margin-right: 3px; border-radius: 50%; background: currentColor; vertical-align: 1px; }
  /* Resume bar under a continue-watching preview; scaleX, never width. */
  .resume { position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: rgba(255, 255, 255, 0.35); pointer-events: none; }
  .resume i { display: block; height: 100%; width: 100%; background: var(--accent);
    transform-origin: left center; }
  .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; font-size: 11.5px; line-height: 1.25; font-weight: 600; }
  .s { margin-top: 3px; font-size: 10px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { flex: none; margin-top: 2px; }

  /* Empty home: what the app does, in one calm block */
  .empty { flex: 1; gap: 10px; padding: 4px 10px; text-align: center; }
  .empty .glyph { width: 48px; height: 48px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; background: var(--kit-tonal); color: var(--kit-on-tonal); }
  :root[data-ui="deep"] .empty .glyph { background: var(--kit-primary); color: var(--kit-on-accent); }
  .empty .glyph svg { width: 26px; height: 26px; }
  .hint { max-width: 270px; font-size: 11px; line-height: 1.45; color: var(--muted); }
  .hint b { color: var(--text); font-weight: 600; }

  /* ---------- The player: takes the whole panel ----------
     The picture gets the full width (320 px = a 16:9 frame 180 px tall);
     the title floats over its top edge, the controls dock under it. */
  .player { position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column;
    background: var(--bg); }
  .player.on { display: flex; }
  .vbox { flex: 1; min-height: 0; display: flex; align-items: center;
    justify-content: center; background: #000; position: relative; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }

  /* Top: back, title, captions, transcript — over the picture on a scrim */
  .ptop { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex;
    align-items: center; gap: 6px; padding: 6px var(--kit-inset-side) 18px;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.35) 60%, rgba(0, 0, 0, 0)); color: #fff; }
  .pmeta { flex: 1; min-width: 0; }
  .ptitle { font: 600 12px/1.25 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .psub { font-size: 10px; color: rgba(255, 255, 255, 0.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .psub:empty { display: none; }
  /* Buttons over the picture are dark glass whatever the theme: they sit
     on video, not on the screen's background. */
  .glass .kit-btn:not(.primary),
  .player.full .pbottom .kit-btn:not(.primary) { background: rgba(16, 16, 16, 0.42); color: #fff; }
  .player .kit-btn.icon { width: 30px; height: 30px; }
  .player .kit-btn.icon.play { width: 38px; height: 38px; }
  .player .kit-btn.icon.play svg { width: 20px; height: 20px; }
  .player .kit-btn svg { width: 16px; height: 16px; }
  .txtbtn { font: 700 10.5px/1 var(--font); letter-spacing: 0.02em; }
  .kit-btn.on { background: var(--kit-tonal); color: var(--kit-on-tonal); }
  .glass .kit-btn.on { background: #fff; color: #000; }

  /* Bottom: the progress line on the picture's lower edge, then transport */
  .pbottom { flex: none; position: relative; z-index: 2;
    padding: 0 var(--kit-inset-side) var(--kit-inset-bottom); }
  /* The hit area is 16 px; the drawn line is 3 px. Edge to edge like the
     picture, though the gesture strips own the outer 12 px for taps. */
  .seek { position: relative; height: 16px; margin: -8px calc(-1 * var(--kit-inset-side)) 0;
    cursor: pointer; }
  .seek i { position: absolute; left: 0; right: 0; top: 7px; height: 3px; display: block;
    background: color-mix(in srgb, var(--text) 22%, transparent); }
  /* transform only: width on every frame is a reflow, and on an A53 the
     player and decoder have already taken everything there was. */
  .seek b { position: absolute; left: 0; top: 7px; height: 3px; width: 100%; display: block;
    background: var(--accent); transform: scaleX(0); transform-origin: left center; }
  :root[data-ui="deep"] .seek b { background: linear-gradient(90deg,
    color-mix(in srgb, var(--accent) 78%, #000), color-mix(in srgb, var(--accent) 88%, #fff)); }
  /* The knob rides a full-width layer moved by translateX(part * 100%) */
  .seek u { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block;
    pointer-events: none; transform: translateX(0); }
  .seek u::after { content: ""; position: absolute; left: -5px; top: 3.5px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--accent); }
  /* Sponsor marks on the bar: you see IN ADVANCE where the player will
     jump, so a skip does not read as a broken stream. */
  .seek .ad { position: absolute; top: 7px; height: 3px; background: var(--ok); opacity: 0.9; }
  .ctl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 8px; min-height: 40px; padding-top: 2px; }
  .ctl .mid { display: flex; align-items: center; gap: 10px; }
  .ctl .end { display: flex; justify-content: flex-end; gap: 6px; }
  .time { font: 500 10px/1 var(--font); color: var(--muted); font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Messages over the picture (preparing, buffering, errors) */
  .vmsg { position: absolute; inset: 0; z-index: 1; display: none; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; padding: 0 28px;
    text-align: center; font-size: 11px; line-height: 1.45; color: rgba(255, 255, 255, 0.8); }
  .vmsg.on { display: flex; }
  /* Loading ring: rotates by transform, the only kind of motion allowed */
  .vmsg.busy::before { content: ""; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%;
    border: 2.5px solid rgba(255, 255, 255, 0.2); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Captions: one block over the bottom of the frame. Only opacity and
     transform change; the text swaps in place, so nothing reflows. */
  .cap { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 1; text-align: center;
    pointer-events: none; opacity: 0; transition: opacity 0.15s linear, transform 0.18s ease; }
  .cap.on { opacity: 1; }
  .cap span { display: inline; padding: 1px 6px; border-radius: 4px;
    background: rgba(0, 0, 0, 0.72); color: #fff; font-size: 11.5px; line-height: 1.55;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }

  /* "Skipped" pill: opacity only, no reflow, does not catch taps. Under
     the title, so it never lands on the captions at the bottom. */
  .skipped { position: absolute; left: var(--kit-inset-side); top: 46px; z-index: 3; max-width: 260px;
    display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 14px;
    pointer-events: none; background: rgba(0, 0, 0, 0.78); color: #fff;
    font-size: 10.5px; line-height: 1.3; opacity: 0; transition: opacity 0.18s linear; }
  .skipped svg { color: var(--accent); width: 14px; height: 14px; }
  .skipped.on { opacity: 1; }

  /* Full screen: the picture takes the whole panel and the controls float
     over it on a scrim. They fade (opacity only) instead of leaving the
     layout, so the video never jumps when they come and go. A tap on the
     picture brings them back. */
  .player.full { background: #000; }
  .player.full .pbottom { position: absolute; left: 0; right: 0; bottom: 0; padding-top: 22px;
    background: linear-gradient(0deg, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0)); }
  .player.full .seek { margin-top: 0; margin-left: 0; margin-right: 0; }
  .player.full .seek i { background: rgba(255, 255, 255, 0.3); border-radius: 2px; }
  .player.full .seek b { border-radius: 2px; }
  .player.full .time { color: rgba(255, 255, 255, 0.85); }
  .player.full .ptop, .player.full .pbottom { opacity: 0; pointer-events: none; transition: opacity 0.18s linear; }
  .player.full.chrome .ptop, .player.full.chrome .pbottom { opacity: 1; pointer-events: auto; }
  .player.full .cap { bottom: 22px; }
  .player.full.chrome .cap { transform: translateY(-50px); }

  /* ---------- Sheets (settings, transcript) over the whole app ---------- */
  .sheet { position: absolute; inset: 0; z-index: 6; }
  .sheet:not(.on) { display: none; }
  .sheet, .player:not(.full) { background: var(--bg); }
  :root[data-ui="deep"] .sheet {
    background: radial-gradient(95% 70% at 50% -12%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 66%), var(--bg); }
  .sheet .kit-bar .kit-title { font-size: 16px; }
  :root[data-ui="deep"] .sheet .kit-bar .kit-title { font-size: 17px; }
  .sbody { display: flex; flex-direction: column; gap: 8px; }
  .opt { gap: 10px; padding: 8px 12px; }
  .opt .n { font-size: 12px; font-weight: 600; }
  .opt .d { margin-top: 2px; font-size: 10px; line-height: 1.35; color: var(--muted); }
  .opt.cats { padding: 4px 12px 10px; }
  .opt.cats .kit-chip { min-height: 26px; font-size: 10.5px; }
  .opt.cats.off { opacity: 0.45; }
  .kit-btn.small { min-height: 28px; padding: 0 12px; font-size: 11px; flex: none; }
  .note { padding: 0 4px 4px; font-size: 10px; line-height: 1.45; color: var(--muted); }
  .note b { color: var(--text); font-weight: 600; }
  /* Transcript lines: tap to jump. The current line is marked by colour
     only, so following along costs no layout. */
  .line { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 6px 8px; border: 0;
    border-radius: 10px; background: transparent; color: var(--text); text-align: left;
    font: 400 11px/1.4 var(--font); cursor: pointer; }
  .line .ts { flex: none; min-width: 32px; color: var(--muted); font-size: 10px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .line.now { background: var(--kit-tonal); color: var(--kit-on-tonal); }
  .line.now .ts { color: var(--accent); }
  /* "Loading…" and "no captions" are plain text in the list itself */
  #tbody { font-size: 11px; line-height: 1.45; color: var(--muted); }
</style>
</head>
<body class="kit">
<main class="kit-app">
  <header class="kit-bar">
    <label class="search">
      <button id="go" class="fbtn" type="button" data-i18n-aria="search.go" data-icon="search"></button>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria">
      <button id="clear" class="fbtn" type="button" data-i18n-aria="search.clear" data-icon="close" hidden></button>
    </label>
    <button id="cog" class="kit-btn icon" type="button" data-i18n-aria="settings.aria" data-icon="settings"></button>
  </header>
  <div class="kit-row tools">
    <div class="kit-chips" id="sort" role="group" data-i18n-aria="sort.aria">
      <button class="kit-chip" type="button" data-sort="relevance" data-i18n="sort.relevance"></button>
      <button class="kit-chip" type="button" data-sort="date" data-i18n="sort.date"></button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <section class="kit-fill kit-scroll" id="grid"></section>
</main>

<div class="player" id="player">
  <div class="vbox">
    <video id="v" playsinline preload="metadata"></video>
    <div class="cap" id="cap"><span id="capText"></span></div>
    <div class="vmsg" id="vmsg"></div>
  </div>
  <div class="ptop glass">
    <button class="kit-btn icon" id="pback" type="button" data-i18n-aria="common.back" data-icon="back"></button>
    <div class="pmeta">
      <div class="ptitle" id="ptitle"></div>
      <div class="psub" id="psub"></div>
    </div>
    <button class="kit-btn icon txtbtn" id="cc" type="button" data-i18n="player.cc" data-i18n-aria="player.ccAria"></button>
    <button class="kit-btn icon" id="lines" type="button" data-i18n-aria="player.linesAria" data-icon="list"></button>
  </div>
  <div class="skipped" id="skipped"></div>
  <div class="pbottom">
    <div class="seek" id="seek"><i></i><b id="seekfill"></b><u id="seekknob"></u></div>
    <div class="ctl">
      <div class="time" id="time">0:00</div>
      <!-- The step is SYMMETRIC: 10 back, 10 forward. An asymmetric pair looks
           identical and does different things. -->
      <div class="mid">
        <button class="kit-btn icon" id="seekBack" type="button" data-i18n-aria="player.back10" data-icon="rewind"></button>
        <button class="kit-btn icon primary play" id="pp" type="button" data-i18n-aria="player.playPause"></button>
        <button class="kit-btn icon" id="seekFwd" type="button" data-i18n-aria="player.fwd10" data-icon="forward"></button>
      </div>
      <div class="end">
        <button class="kit-btn icon txtbtn" id="rate" type="button" data-i18n-aria="player.rate">1x</button>
        <button class="kit-btn icon" id="full" type="button" data-i18n-aria="player.fullAria" data-icon="expand"></button>
      </div>
    </div>
  </div>
</div>

<div class="sheet kit-app" id="transcript">
  <header class="kit-bar">
    <button id="tback" class="kit-btn icon" type="button" data-i18n-aria="common.back" data-icon="back"></button>
    <span class="kit-title" data-i18n="transcript.head"></span>
  </header>
  <section class="kit-fill kit-scroll" id="tbody"></section>
</div>

<div class="sheet kit-app" id="sheet">
  <header class="kit-bar">
    <button id="sback" class="kit-btn icon" type="button" data-i18n-aria="common.back" data-icon="back"></button>
    <span class="kit-title" data-i18n="settings.head"></span>
  </header>
  <section class="kit-fill kit-scroll sbody">
    <div class="kit-list">
      <div class="kit-item opt">
        <div class="kit-grow">
          <div class="n" data-i18n="settings.sponsor"></div>
          <div class="d" data-i18n="settings.sponsorHint"></div>
        </div>
        <button class="kit-switch" id="swSponsor" type="button" aria-pressed="false" data-i18n-aria="settings.sponsor"></button>
      </div>
      <div class="kit-item opt cats"><div class="kit-chips" id="cats"></div></div>
      <div class="kit-item opt">
        <div class="kit-grow">
          <div class="n" data-i18n="settings.notify"></div>
          <div class="d" data-i18n="settings.notifyHint"></div>
        </div>
        <button class="kit-switch" id="swNotify" type="button" aria-pressed="false" data-i18n-aria="settings.notify"></button>
      </div>
    </div>
    <div class="kit-list">
      <div class="kit-item opt">
        <div class="kit-grow">
          <div class="n" data-i18n="settings.thumbs"></div>
          <div class="d" data-i18n="settings.thumbsHint"></div>
        </div>
        <button class="kit-switch" id="swThumbs" type="button" aria-pressed="false" data-i18n-aria="settings.thumbs"></button>
      </div>
      <div class="kit-item opt">
        <div class="kit-grow">
          <div class="n" data-i18n="settings.captions"></div>
          <div class="d" data-i18n="settings.captionsHint"></div>
        </div>
        <button class="kit-switch" id="swCaptions" type="button" aria-pressed="false" data-i18n-aria="settings.captions"></button>
      </div>
      <div class="kit-item opt">
        <div class="kit-grow">
          <div class="n" data-i18n="settings.history"></div>
          <div class="d" data-i18n="settings.historyHint"></div>
        </div>
        <button class="kit-btn danger small" id="clearHistory" type="button" data-i18n="settings.clear" data-i18n-aria="settings.history"></button>
      </div>
    </div>
    <div class="note" data-i18n-html="settings.note"></div>
  </section>
</div>
<script>
  // YouTube client for the 320x240 screen. Video only: music has its own
  // app (yt-music), and the bot's play_music goes to Now Playing.
  //   search     -> /api/music/search (yt-dlp on the backend, no keys)
  //   video      -> /api/music/video: muxed mp4 straight into <video>
  //   sponsors   -> /api/video/segments: SponsorBlock segments to jump over
  //   captions   -> /api/music/transcript: segments shown over the video
  //   bot        -> postMessage {type:"botVideo"} from the parent
  //   state      -> POST /api/video/state, so the bot knows where we are
  const $ = (id) => document.getElementById(id);

  /* ---------- i18n ---------- */

  const STR = {
    uk: {
      "search.placeholder": "Що шукати на YouTube?",
      "search.aria": "Пошук",
      "search.go": "Шукати",
      "search.clear": "Очистити",
      "settings.aria": "Налаштування",
      "sort.aria": "Порядок результатів",
      "sort.relevance": "Найкращі",
      "sort.date": "Нові",
      "search.more": "Ще відео",
      "search.loadingMore": "Довантажую…",
      "common.back": "Назад",
      "status.idle": "Пошук по YouTube.",
      "status.searching": "Шукаю «{q}»…",
      "status.found": "Знайдено: {n}.",
      "status.nothing": "Нічого не знайшлось.",
      "status.searchDown": "Пошук недоступний.",
      "status.offline": "Бот недоступний.",
      "status.live": "Прямий ефір поки не граємо — тільки записи.",
      "status.failed": "Не вийшло: {error}",
      "status.ads": "Знайдено вклеєної реклами: {time}",

  function storageGet(key, fallback) {
    // Storage throws in a sandbox and in private mode; the app keeps working.
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
  }
  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* memory only */ }
  }

  // The kit already knows the screen's language (botScreenLang)
  let lang = window.BotApp ? BotApp.lang : (storageGet("botScreenLang", "uk") === "en" ? "en" : "uk");
  function t(key, vars) {
    let text = (STR[lang] && STR[lang][key]) || STR.uk[key] || key;
    if (vars) for (const k in vars) text = text.split("{" + k + "}").join(String(vars[k]));
    return text;
  }
  // HTML only from our own dictionary, never from data: values are escaped.
  function escapeHtml(value) {
    return String(value).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll("[data-i18n-html]")) el.innerHTML = t(el.dataset.i18nHtml);
    for (const el of document.querySelectorAll("[data-i18n-placeholder]")) el.placeholder = t(el.dataset.i18nPlaceholder);
    for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
  }

  /* ---------- icons ---------- */

  const ICONS = {
    // Copied VERBATIM from static/screen/icons.js (play, pause, next,
    // settings, music, list, expand) so the screen never shows two near-identical
    // versions of one icon. "back" follows device-settings.
    play:     '<path d="M8 5.4v13.2L19.2 12z"/>',
    pause:    '<path d="M8.6 5.5v13M15.4 5.5v13"/>',
    skip:     '<path d="M6.5 5.5v13L15.8 12z"/><path d="M17.5 5.5v13"/>',
    settings: '<path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M18 6l-1.4 1.4M7.4 16.6 6 18"/>' +
              '<circle cx="12" cy="12" r="4.2"/>',
    music:    '<path d="M9.2 18V6.2l9.3-2v11.6"/>' +
              '<circle cx="6.9" cy="18" r="2.4"/>' +
              '<circle cx="16.2" cy="15.8" r="2.4"/>',
    list:     '<path d="M4 6.5h.01M4 12h.01M4 17.5h.01M8.5 6.5h11.5M8.5 12h11.5M8.5 17.5h11.5"/>',
    back:     '<path d="m14 5-7 7 7 7M7 12h13"/>',
    // Mirrored double triangles, scaled from play (y 6.6..17.4) so the three
    // transport icons read the same size in a row.
    rewind:   '<path d="M11.5 6.6 5 12l6.5 5.4z"/><path d="M19 6.6 12.5 12l6.5 5.4z"/>',
    forward:  '<path d="M12.5 6.6 19 12l-6.5 5.4z"/><path d="M5 6.6 11.5 12 5 17.4z"/>',
    expand:   '<path d="M8.5 3.5H3.5v5M15.5 3.5h5v5M20.5 15.5v5h-5M3.5 15.5v5h5"/>',
    // close and youtube are verbatim from icons.js; search and shrink are
    // the package's own (the screen's set has neither), drawn to match.
    close:    '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    youtube:  '<rect x="3" y="6.2" width="18" height="11.6" rx="3"/>' +
              '<path d="M10.4 9.6v4.8l4.2-2.4z"/>',
    search:   '<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/>',
    shrink:   '<path d="M3.5 8.5h5v-5M20.5 8.5h-5v-5M15.5 20.5v-5h5M8.5 20.5v-5h-5"/>',
  };

  function iconSvg(name) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.play) + "</svg>";
  }
  function paintIcons(root) {
    for (const el of (root || document).querySelectorAll("[data-icon]")) el.innerHTML = iconSvg(el.dataset.icon);
  }

  const q = $("q"), go = $("go"), grid = $("grid"), status = $("status");
  const player = $("player"), video = $("v"), vmsg = $("vmsg"), sheet = $("sheet");
  const KEY = "youtube.lastQuery";
  const SORT_KEY = "youtube.sort";
  const FULL_KEY = "youtube.full";
  const HISTORY_KEY = "youtube.history";
  const SEARCHES_KEY = "youtube.searches";
  const CAPTIONS_KEY = "youtube.captions";
  const RATES = [1, 1.25, 1.5, 1.75, 2];

  // One YouTube results page is ~20 videos and ~2 s; "More" adds a page up
  // to the backend ceiling (music.SEARCH_MAX), which it enforces anyway.
  const PAGE = 24;
  const MAX_RESULTS = 48;
  let sort = "relevance";
  let searchLimit = PAGE;
  let searchSeq = 0;           // a newer search wins over a slow older one
  let rateIdx = 0;
  let seekRaf = false;
  let current = null;          // track in the player
  let settings = null;         // backend settings (sponsors, previews)
  let catalog = {};            // SponsorBlock category names
  let adSegments = [];         // segments to skip in this video
  let skippedCount = 0, skippedSeconds = 0;
  let skipTimer = 0, stateTimer = 0;
  let lastTracks = [];
  let statusKey = ["status.idle", null, false];

  function fmt(sec) {
    // An hour-long video used to read "100:50" — true, and nonsense to the eye.
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    const s = sec % 60, m = Math.floor(sec / 60) % 60, h = Math.floor(sec / 3600);
    const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
    return h ? h + ":" + mm + ":" + ss : m + ":" + ss;
  }
  // The status line remembers its key, so a language switch re-renders it.
  function say(key, vars, now) {
    statusKey = [key, vars || null, !!now];
    status.textContent = t(key, vars);
    status.className = "status" + (now ? " now" : "");
  }
  /* FastAPI sends detail as a LIST of objects for invalid params; string
     concatenation printed "[object Object]" into the status line. */
  function detailText(payload, fallback) {
    const d = payload && payload.detail;
    if (typeof d === "string" && d) return d;
    if (d && typeof d.message === "string") return d.message;
    if (Array.isArray(d) && d.length && d[0] && d[0].msg) return String(d[0].msg);
    return fallback;
  }

  /* ---------- local history: continue watching + recent searches ----------
     On the device, not the backend: this is what one screen watched, and the
     bot has no business keeping a watch log. */

  function readList(key) {
    try { const v = JSON.parse(storageGet(key, "[]")); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function writeList(key, list) { storageSet(key, JSON.stringify(list)); }

  function rememberSearch(query) {
    const list = readList(SEARCHES_KEY).filter((x) => x !== query);
    list.unshift(query);
    writeList(SEARCHES_KEY, list.slice(0, 6));
  }

  function rememberWatch(track, position, duration) {
    if (!track || !track.id) return;
    const list = readList(HISTORY_KEY).filter((x) => x.id !== track.id);
    // Within 20 s of either end there is nothing to "continue".
    const pos = Number(position) || 0, total = Number(duration) || 0;
    const finished = total && pos > total - 20;
    list.unshift({
      id: track.id, title: track.title || "", uploader: track.uploader || "",
      duration: total || track.duration || 0, thumb: track.thumb || "",
      position: finished || pos < 20 ? 0 : Math.floor(pos),
    });
    writeList(HISTORY_KEY, list.slice(0, 8));
  }

  function renderHome() {
    lastTracks = [];
    grid.innerHTML = "";
    const history = readList(HISTORY_KEY).filter((x) => x.position > 0);
    if (history.length) {
      grid.appendChild(shelf("home.continue"));
      const list = document.createElement("div");
      list.className = "kit-list";
      for (const item of history.slice(0, 4)) list.appendChild(card(item));
      grid.appendChild(list);
    }
    const searches = readList(SEARCHES_KEY);
    if (searches.length) {
      grid.appendChild(shelf("home.recent"));
      const chips = document.createElement("div");
      chips.className = "kit-chips recent";
      for (const query of searches) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "kit-chip";
        chip.textContent = query;
        chip.addEventListener("click", () => { q.value = query; search(); });
        chips.appendChild(chip);
      }
      grid.appendChild(chips);
    }
    if (!history.length && !searches.length) {
      const empty = document.createElement("div");
      empty.className = "empty kit-center";
      const glyph = document.createElement("div");
      glyph.className = "glyph";
      glyph.innerHTML = iconSvg("youtube");
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.innerHTML = t("home.hint");
      empty.append(glyph, hint);
      grid.appendChild(empty);
    }
    say("status.idle");
  }

  function shelf(key) {
    const el = document.createElement("div");
    el.className = "shelf";
    el.textContent = t(key);
    return el;
  }

  /* ---------- settings (shared with the bot) ----------
     On the backend, not in localStorage: otherwise the switch here and the
     phrase "turn off ad skipping" would live separate lives. */

  async function loadSettings() {
    try {
      const r = await fetch("/api/video/settings", { cache: "no-store" });
      const d = await r.json();
      settings = d.settings || null;
      catalog = d.categories || {};
    } catch (e) {
      settings = settings || { sponsorblock: true, categories: ["sponsor"], proxy_thumbnails: true, notify_skips: true };
      catalog = catalog || {};
    }
    renderSettings();
  }

  async function patchSettings(patch) {
    // Draw AT ONCE; a switch that "thinks" for half a second reads as not pressed.
    settings = Object.assign({}, settings, patch);
    renderSettings();
    try {
      const r = await fetch("/api/video/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
      const d = await r.json();
      if (d && d.settings) { settings = d.settings; renderSettings(); }
    } catch (e) { /* keep the optimistic state */ }
  }

  function setSwitch(id, on) {
    $(id).setAttribute("aria-pressed", String(!!on));
  }

  function renderSettings() {
    setSwitch("swCaptions", captionsDefault());
    if (!settings) return;
    setSwitch("swSponsor", settings.sponsorblock);
    setSwitch("swNotify", settings.notify_skips);
    setSwitch("swThumbs", settings.proxy_thumbnails);

    const box = $("cats");
    box.classList.toggle("off", !settings.sponsorblock);
    const active = new Set(settings.categories || []);
    box.innerHTML = "";
    for (const key of Object.keys(catalog)) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = catalog[key];
      b.className = "kit-chip" + (active.has(key) ? " on" : "");
      b.addEventListener("click", () => {
        const next = new Set(settings.categories || []);
        if (next.has(key)) next.delete(key); else next.add(key);
        // No categories left = skip nothing, i.e. the same off switch, only
        // invisible — so turn it off explicitly.
        const list = Array.from(next);
        patchSettings(list.length ? { categories: list, sponsorblock: true } : { sponsorblock: false });
      });
      box.appendChild(b);
    }
  }

  $("swSponsor").addEventListener("click", () => {
    const on = !settings?.sponsorblock;
    const patch = { sponsorblock: on };
    if (on && !(settings?.categories || []).length) {
      patch.categories = ["sponsor", "selfpromo", "interaction", "music_offtopic"];
    }
    patchSettings(patch);
  });
  $("swNotify").addEventListener("click", () => patchSettings({ notify_skips: !settings?.notify_skips }));
  $("swThumbs").addEventListener("click", () => {
    patchSettings({ proxy_thumbnails: !settings?.proxy_thumbnails });
    if (lastTracks.length) render(lastTracks);
  });
  $("swCaptions").addEventListener("click", () => {
    storageSet(CAPTIONS_KEY, captionsDefault() ? "0" : "1");
    renderSettings();
  });
  $("clearHistory").addEventListener("click", () => {
    writeList(HISTORY_KEY, []);
    writeList(SEARCHES_KEY, []);
    storageSet(KEY, "");
    sheet.classList.remove("on");
    q.value = "";
    syncClear();
    renderHome();
  });
  $("cog").addEventListener("click", () => {
    sheet.classList.add("on");
    // Re-read: the bot may have flipped a switch by voice meanwhile.
    loadSettings();
  });
  $("sback").addEventListener("click", () => { sheet.classList.remove("on"); });

  /* ---------- sort order ---------- */

  function setSort(next, rerun) {
    const changed = next !== sort;
    sort = next === "date" ? "date" : "relevance";
    storageSet(SORT_KEY, sort);
    for (const b of $("sort").querySelectorAll("button")) b.classList.toggle("on", b.dataset.sort === sort);
    // Switching the order on shown results means "show them the other way".
    if (rerun && changed && lastTracks.length) search();
  }
  $("sort").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-sort]");
    if (b) setSort(b.dataset.sort, true);
  });

  /* ---------- results ---------- */

  /* Previews through the bot (the device never talks to Google) or direct.
     The direct URL comes from the backend's search result; the package holds
     no Google address of its own. */
  function thumbUrl(item) {
    if (settings && settings.proxy_thumbnails === false && item.thumb) return item.thumb;
    return "/api/video/thumb?id=" + encodeURIComponent(item.id);
  }

  function card(item) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card kit-item";

    const box = document.createElement("div");
    box.className = "tbox";
    const thumb = document.createElement("img");
    thumb.className = "thumb";
    thumb.loading = "lazy";
    thumb.alt = "";
    thumb.decoding = "async";
    thumb.src = thumbUrl(item);
    // No network: a grey 16:9 block stays, not a hole in the grid
    thumb.addEventListener("error", () => { thumb.removeAttribute("src"); }, { once: true });
    box.appendChild(thumb);

    if (item.live) {
      const live = document.createElement("span");
      live.className = "badge live";
      live.textContent = t("card.live");
      box.appendChild(live);
    } else if (item.duration) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = fmt(item.duration);
      box.appendChild(badge);
    }

    if (item.position && item.duration) {
      const bar = document.createElement("div");
      bar.className = "resume";
      const fill = document.createElement("i");
      fill.style.transform = "scaleX(" + Math.min(1, item.position / item.duration).toFixed(3) + ")";
      bar.appendChild(fill);
      box.appendChild(bar);
    }
    btn.appendChild(box);

    const text = document.createElement("div");
    text.className = "kit-grow";
    const title = document.createElement("div");
    title.className = "t";
    title.textContent = item.title;

    const sub = document.createElement("div");
    sub.className = "s";
    sub.textContent = item.uploader || "YouTube";

    text.append(title, sub);
    btn.appendChild(text);
    btn.addEventListener("click", () => start(item, btn));
    return btn;
  }

  function render(tracks) {
    lastTracks = tracks;
    // Keep the scroll position: "More" re-renders the list, and jumping back
    // to the top would lose the place the finger was at.
    const top = grid.scrollTop;
    grid.innerHTML = "";
    if (!tracks.length) { say("status.nothing"); return; }
    const list = document.createElement("div");
    list.className = "kit-list";
    for (const item of tracks) list.appendChild(card(item));
    grid.appendChild(list);
    // A full page means YouTube probably has more; a short one means it ran out.
    if (tracks.length >= searchLimit && searchLimit < MAX_RESULTS) {
      const more = document.createElement("button");
      more.type = "button";
      more.className = "more kit-btn tonal block";
      more.textContent = t("search.more");
      more.addEventListener("click", () => {
        more.disabled = true;
        more.textContent = t("search.loadingMore");
        search(true);
      });
      grid.appendChild(more);
    }
    grid.scrollTop = top;
    say("status.found", { n: tracks.length });
  }

  // more === true: the same query, one page longer (the button, not the event
  // object a click listener would pass in).
  async function search(more) {
    const query = q.value.trim();
    if (!query) { renderHome(); return; }
    const seq = ++searchSeq;
    if (more === true) {
      searchLimit = Math.min(MAX_RESULTS, searchLimit + PAGE);
    } else {
      searchLimit = PAGE;
      storageSet(KEY, query);
      rememberSearch(query);
      say("status.searching", { q: query });
      grid.innerHTML = "";
      grid.scrollTop = 0;
    }
    go.disabled = true;
    try {
      const r = await fetch("/api/music/search?q=" + encodeURIComponent(query) +
        "&limit=" + searchLimit + "&sort=" + sort);
      if (seq !== searchSeq) return;
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        status.textContent = detailText(err, t("status.searchDown"));
        if (more === true && lastTracks.length) render(lastTracks);
        return;
      }
      const d = await r.json();
      if (seq !== searchSeq) return;
      render(d.tracks || []);
    } catch (e) {
      if (seq === searchSeq) say("status.offline");
    } finally {
      if (seq === searchSeq) go.disabled = false;
    }
  }

  go.addEventListener("click", () => search());
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
  q.addEventListener("search", () => { if (!q.value.trim()) renderHome(); });
  // The cross shows only when there is something to clear; the on-screen
  // keyboard fires input on every key, so it follows typing there too.
  function syncClear() { $("clear").hidden = !q.value; }
  q.addEventListener("input", syncClear);
  $("clear").addEventListener("click", () => {
    q.value = "";
    syncClear();
    storageSet(KEY, "");
    searchSeq += 1;              // a search still in flight must not land
    go.disabled = false;
    renderHome();
  });

  /* ---------- play ---------- */

  function start(item) {
    // A live stream has only HLS; say so now instead of "playing" and silence.
    if (item.live) { say("status.live"); return; }
    openVideo(item, item.position || 0);
  }

  /* ---------- the video player ---------- */

  /* The button shows what you CAN do. The truth is video.paused, not our
     intent: with autoplay blocked the player stays paused. */
  function setPlayIcon(playing) { $("pp").innerHTML = iconSvg(playing ? "pause" : "play"); }

  let vmsgKey = "";
  function vsay(key) {
    vmsgKey = key || "";
    vmsg.textContent = key ? t(key) : "";
    vmsg.classList.toggle("on", !!key);
    vmsg.classList.toggle("busy", key === "player.preparing" || key === "player.buffering");
  }

  async function openVideo(item, startAt) {
    // Same video already open: do not restart the stream — the first
    // connection costs seconds, and "show it again" would look like a hang.
    if (current && current.id === item.id && player.classList.contains("on")) {
      if (startAt) video.currentTime = startAt;
      if (video.paused) video.play().catch(() => {});
      return;
    }
    if (current) rememberWatch(current, video.currentTime, video.duration);
    current = item;
    sheet.classList.remove("on");
    $("transcript").classList.remove("on");
    $("ptitle").textContent = item.title || t("player.untitled");
    $("psub").textContent = item.uploader || "";
    player.classList.add("on");
    // Whoever watched the last video full screen gets the next one that way.
    setFull(storageGet(FULL_KEY, "0") === "1", false);
    // Now Playing and video are two sound sources; without this they would
    // play TOGETHER.
    try { await fetch("/api/music/stop", { method: "POST" }); } catch (e) { /* not critical */ }
    vsay("player.preparing");
    $("time").textContent = item.duration ? "0:00 / " + fmt(item.duration) : "0:00";
    $("seekfill").style.transform = "scaleX(0)";
    $("seekknob").style.transform = "translateX(0)";
    setRate(0);
    // "Mute" was about THAT video; the next one starting silent looks broken.
    video.muted = false;
    resetSkips();
    resetCaptions();
    setPlayIcon(false);
    video.src = "/api/music/video?id=" + encodeURIComponent(item.id);
    if (startAt) {
      // currentTime before metadata is dropped by the browser
      video.addEventListener("loadedmetadata", () => { try { video.currentTime = startAt; } catch (e) {} }, { once: true });
    }
    loadSegments(item.id);
    if (captionsDefault()) setCaptions(true);
    // Report BEFORE the first frame: a player waiting for a tap otherwise
    // says nothing, and the bot describes the previous video as current.
    pushState();
    video.addEventListener("loadedmetadata", () => pushState(), { once: true });
    try {
      await video.play();
    } catch (e) {
      vsay("player.tapToPlay");
    }
  }

  function closeVideo() {
    if (current) rememberWatch(current, video.currentTime, video.duration);
    player.classList.remove("on");
    $("transcript").classList.remove("on");
    try { video.pause(); } catch (e) { /* already dead */ }
    // Empty src, not just pause: the proxied stream would keep pulling.
    video.removeAttribute("src");
    try { video.load(); } catch (e) { /* ignore */ }
    vsay("");
    current = null;
    setFull(false, false);
    resetSkips();
    resetCaptions();
    stopStateReports();
    pushState({ closed: true });
    if (!lastTracks.length) renderHome();
  }
  $("pback").addEventListener("click", closeVideo);

  /* ---------- full screen ----------
     The app already owns the whole panel (the screen draws no title bar for
     store apps). Full screen here means the player's own chrome floats over
     the picture and fades away; a tap on the picture brings it back. The
     parent still hears storeAppFullscreen: it refreshes the island. */

  const CHROME_MS = 3000;
  let full = false, chromeTimer = 0;

  function setFull(on, remember) {
    full = !!on;
    if (remember !== false) storageSet(FULL_KEY, full ? "1" : "0");
    player.classList.toggle("full", full);
    $("full").innerHTML = iconSvg(full ? "shrink" : "expand");
    try { window.parent.postMessage({ type: "storeAppFullscreen", on: full }, "*"); } catch (e) { /* standalone */ }
    if (full) showChrome();
    else { clearTimeout(chromeTimer); player.classList.remove("chrome"); }
  }
  // Shown bars hide again after a pause in touching — but never while the
  // video is paused: then the controls are exactly what you need.
  function showChrome() {
    player.classList.add("chrome");
    clearTimeout(chromeTimer);
    chromeTimer = setTimeout(() => {
      if (full && !video.paused) player.classList.remove("chrome");
    }, CHROME_MS);
  }
  $("full").addEventListener("click", () => setFull(!full));
  player.querySelector(".vbox").addEventListener("click", () => {
    if (!full) return;
    if (player.classList.contains("chrome") && !video.paused) {
      clearTimeout(chromeTimer);
      player.classList.remove("chrome");
    } else {
      showChrome();
    }
  });
  // Any touch on the bars themselves keeps them up.
  for (const bar of player.querySelectorAll(".ptop, .pbottom")) {
    bar.addEventListener("pointerdown", () => { if (full) showChrome(); });
  }

  video.addEventListener("playing", () => { vsay(""); setPlayIcon(true); startStateReports(); pushState(); if (full) showChrome(); });
  video.addEventListener("pause", () => {
    setPlayIcon(false);
    if (full) showChrome();
    pushState();
    if (current) rememberWatch(current, video.currentTime, video.duration);
  });
  video.addEventListener("waiting", () => vsay("player.buffering"));
  video.addEventListener("ended", () => { setPlayIcon(false); pushState(); if (current) rememberWatch(current, 0, 0); });
  video.addEventListener("error", () => { if (video.getAttribute("src")) vsay("player.error"); });

  $("pp").addEventListener("click", () => {
    if (video.paused) video.play().catch(() => vsay("player.startFailed"));
    else video.pause();
  });

  /* The seek step equals the video_control tool default (SEEK_STEP_S <->
     DEFAULT_STEP_S), so "skip ahead" by voice and a tap do the same thing. */
  const SEEK_STEP_S = 10;
  function nudge(delta) {
    const total = video.duration;
    if (!(total > 0) || !isFinite(total)) return;
    video.currentTime = Math.min(total, Math.max(0, video.currentTime + delta));
    pushState();
  }
  $("seekBack").addEventListener("click", () => nudge(-SEEK_STEP_S));
  $("seekFwd").addEventListener("click", () => nudge(SEEK_STEP_S));

  /* Speed cycles on one button: five chips next to the transport on 320px
     are misses, not choices. */
  function setRate(idx) {
    rateIdx = ((idx % RATES.length) + RATES.length) % RATES.length;
    setRateValue(RATES[rateIdx]);
  }
  function setRateValue(value) {
    const rate = Number(value) || 1;
    const idx = RATES.indexOf(rate);
    if (idx >= 0) rateIdx = idx;
    // preservesPitch, or the host turns into a chipmunk at 2x
    video.preservesPitch = true;
    video.webkitPreservesPitch = true;
    video.playbackRate = rate;
    $("rate").textContent = String(rate) + "x";
  }
  $("rate").addEventListener("click", () => setRate(rateIdx + 1));

  video.addEventListener("timeupdate", () => {
    maybeSkip();
    updateCaption();
    if (seekRaf) return;
    seekRaf = true;
    requestAnimationFrame(() => {
      seekRaf = false;
      const total = video.duration > 0 && isFinite(video.duration) ? video.duration : 0;
      const part = total ? Math.min(1, video.currentTime / total) : 0;
      $("seekfill").style.transform = "scaleX(" + part.toFixed(4) + ")";
      $("seekknob").style.transform = "translateX(" + (part * 100).toFixed(3) + "%)";
      $("time").textContent = fmt(video.currentTime) + (total ? " / " + fmt(total) : "");
    });
  });

  $("seek").addEventListener("click", (e) => {
    const total = video.duration;
    if (!(total > 0) || !isFinite(total)) return;
    const box = e.currentTarget.getBoundingClientRect();
    const part = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
    video.currentTime = part * total;
    pushState();
  });

  /* ---------- captions and transcript ----------
     Loaded once per video on first need and shared by the overlay and the
     transcript sheet. The backend picks the source (the youtube.com panel
     first), so this works even when YouTube's timedtext is blocked. */

  let captions = null;          // null = not loaded, [] = none
  let captionsError = "";
  let captionsFor = "";
  let captionsOn = false;
  let captionIdx = -1;

  function captionsDefault() { return storageGet(CAPTIONS_KEY, "0") === "1"; }

  function resetCaptions() {
    captions = null; captionsError = ""; captionsFor = ""; captionIdx = -1;
    setCaptions(false);
  }

  async function loadCaptions() {
    if (!current) return [];
    if (captions && captionsFor === current.id) return captions;
    const id = current.id;
    try {
      const r = await fetch("/api/music/transcript?id=" + encodeURIComponent(id) + "&lang=" + lang);
      const d = await r.json().catch(() => ({}));
      if (!current || current.id !== id) return [];
      if (!r.ok) { captions = []; captionsError = detailText(d, String(r.status)); }
      else { captions = (d.segments || []).filter((s) => s && s.text); captionsError = ""; }
    } catch (e) {
      captions = []; captionsError = t("status.offline");
    }
    captionsFor = id;
    return captions;
  }

  // Binary search: an hour of captions is ~1000 lines and timeupdate fires
  // four times a second on a Pi.
  function segmentAt(time) {
    if (!captions || !captions.length) return -1;
    let lo = 0, hi = captions.length - 1, best = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (captions[mid].start <= time) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return best;
  }

  function updateCaption() {
    const idx = segmentAt(video.currentTime + 0.2);
    if (idx === captionIdx) return;
    captionIdx = idx;
    if (captionsOn) {
      $("capText").textContent = idx >= 0 ? captions[idx].text : "";
      $("cap").classList.toggle("on", idx >= 0);
    }
    const sheetOpen = $("transcript").classList.contains("on");
    if (sheetOpen) markLine(idx, false);
  }

  async function setCaptions(on) {
    captionsOn = !!on;
    $("cc").classList.toggle("on", captionsOn);
    if (!captionsOn) { $("cap").classList.remove("on"); return; }
    await loadCaptions();
    if (!captions.length) {
      captionsOn = false;
      $("cc").classList.remove("on");
      if (captionsError) { vsay(""); vmsg.textContent = t("transcript.none", { error: captionsError }); vmsg.classList.add("on"); setTimeout(() => vsay(""), 3000); }
      return;
    }
    captionIdx = -1;
    updateCaption();
  }
  $("cc").addEventListener("click", () => setCaptions(!captionsOn));

  function markLine(idx, scroll) {
    const body = $("tbody");
    const prev = body.querySelector(".line.now");
    if (prev) prev.classList.remove("now");
    const el = idx >= 0 ? body.children[idx] : null;
    if (el) {
      el.classList.add("now");
      // Scroll the list itself: scrollIntoView also scrolls every ancestor,
      // the parent screen's stage included, and shifted the whole app up.
      if (scroll) body.scrollTop = el.offsetTop - body.offsetTop - (body.clientHeight - el.offsetHeight) / 2;
    }
  }

  async function openTranscript() {
    const body = $("tbody");
    $("transcript").classList.add("on");
    body.textContent = t("transcript.loading");
    await loadCaptions();
    body.innerHTML = "";
    if (!captions.length) {
      body.textContent = t("transcript.none", { error: captionsError || "—" });
      return;
    }
    const frag = document.createDocumentFragment();
    captions.forEach((seg) => {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "line";
      const ts = document.createElement("span");
      ts.className = "ts";
      ts.textContent = fmt(seg.start);
      const text = document.createElement("span");
      text.textContent = seg.text;
      row.append(ts, text);
      row.addEventListener("click", () => {
        try { video.currentTime = seg.start; } catch (e) {}
        $("transcript").classList.remove("on");
        if (video.paused) video.play().catch(() => {});
        pushState();
      });
      frag.appendChild(row);
    });
    body.appendChild(frag);
    markLine(segmentAt(video.currentTime + 0.2), true);
  }
  $("lines").addEventListener("click", openTranscript);
  $("tback").addEventListener("click", () => $("transcript").classList.remove("on"));

  /* ---------- sponsor segments (SponsorBlock) ----------
     Ads YouTube inserts never reach us — the video is proxied without their
     player. What is left is sponsorship baked into the video, and only the
     community database knows its bounds. */

  function resetSkips() {
    adSegments = [];
    skippedCount = 0;
    skippedSeconds = 0;
    clearTimeout(skipTimer);
    $("skipped").classList.remove("on");
    for (const el of $("seek").querySelectorAll(".ad")) el.remove();
  }

  async function loadSegments(videoId) {
    try {
      const r = await fetch("/api/video/segments?id=" + encodeURIComponent(videoId));
      if (!r.ok) return;
      const d = await r.json();
      if (!current || current.id !== videoId) return;   // switched meanwhile
      adSegments = (d.segments || []).map((s) => ({ ...s, done: false }));
      if (adSegments.length) {
        say("status.ads", { time: fmt(d.skipped_seconds || 0) }, true);
        markSegments();
      }
    } catch (e) { /* not critical — play without skipping */ }
  }

  function markSegments() {
    const total = video.duration;
    if (!(total > 0) || !isFinite(total)) {
      video.addEventListener("loadedmetadata", markSegments, { once: true });
      return;
    }
    const bar = $("seek");
    for (const el of bar.querySelectorAll(".ad")) el.remove();
    for (const seg of adSegments) {
      const mark = document.createElement("span");
      mark.className = "ad";
      mark.style.left = (100 * seg.start / total).toFixed(2) + "%";
      mark.style.width = Math.max(0.8, 100 * (seg.end - seg.start) / total).toFixed(2) + "%";
      bar.appendChild(mark);
    }
  }

  function maybeSkip() {
    if (!adSegments.length || video.paused) return;
    const now = video.currentTime;
    for (const seg of adSegments) {
      // -0.4 near the end: a jump "to end" sometimes lands half a frame
      // short and the segment gets skipped twice in a row.
      if (seg.done || now < seg.start || now >= seg.end - 0.4) continue;
      seg.done = true;               // rewound by hand — don't fight the user
      const jumped = seg.end - now;
      try { video.currentTime = seg.end; } catch (e) { continue; }
      skippedCount += 1;
      skippedSeconds += Math.max(0, jumped);
      if (settings?.notify_skips !== false) {
        showSkipped(t("player.skipped", { label: seg.label || t("player.ad"), time: fmt(jumped) }));
      }
      pushState();
      return;                        // one jump per tick
    }
  }

  function showSkipped(text) {
    const box = $("skipped");
    box.innerHTML = iconSvg("skip") + "<span></span>";
    box.querySelector("span").textContent = text;
    box.classList.add("on");
    clearTimeout(skipTimer);
    skipTimer = setTimeout(() => box.classList.remove("on"), 2400);
  }

  /* ---------- state report to the bot ----------
     SSE only goes bot -> screen; without this the bot could only invent
     where we stopped. Sent on events and every 5 s while playing; the
     backend's 40 s TTL clears it if the screen sleeps. */

  function pushState(extra) {
    const payload = Object.assign({
      video_id: current ? current.id : "",
      title: current ? (current.title || "") : "",
      position: Number(video.currentTime) || 0,
      duration: (video.duration > 0 && isFinite(video.duration)) ? video.duration : (current?.duration || 0),
      paused: !!video.paused,
      muted: !!video.muted,
      rate: Number(video.playbackRate) || 1,
      skipped_count: skippedCount,
      skipped_seconds: Math.round(skippedSeconds * 10) / 10,
      segments: adSegments.length,
      captions: captionsOn,
    }, extra || {});
    // The screen hears it too: closing this app while a video plays hands
    // it over as sound from this second (the island shows it).
    try {
      window.parent.postMessage(Object.assign({ type: "botVideoState", uploader: current ? (current.uploader || "") : "" }, payload),
        window.location.origin);
    } catch (e) { /* standalone */ }
    fetch("/api/video/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).catch(() => {});
  }

  function startStateReports() {
    if (stateTimer) return;
    stateTimer = setInterval(() => {
      if (!player.classList.contains("on") || video.paused) return;
      pushState();
    }, 5000);
  }
  function stopStateReports() {
    clearInterval(stateTimer);
    stateTimer = 0;
  }

  /* ---------- commands from the bot ----------
     Arrive from the parent (screen.js) after an SSE video event. Unknown
     actions are ignored: a new tool on an old package must break nothing. */

  async function botCommand(cmd) {
    const action = String(cmd.action || "");
    if (action === "play") {
      const tr = cmd.track || {};
      if (!tr.id) return;
      sheet.classList.remove("on");
      await openVideo({
        id: tr.id,
        title: tr.title || t("player.untitled"),
        uploader: tr.uploader || "",
        duration: Number(tr.duration) || 0,
      }, Number(cmd.position) || 0);
      return;
    }
    if (!player.classList.contains("on")) return;
    const total = (video.duration > 0 && isFinite(video.duration)) ? video.duration : 0;

    if (action === "pause") { video.pause(); }
    else if (action === "resume") { video.play().catch(() => vsay("player.tapToResume")); }
    else if (action === "stop") { closeVideo(); return; }
    else if (action === "forward") { nudge(Number(cmd.seconds) || SEEK_STEP_S); return; }
    else if (action === "back") { nudge(-(Number(cmd.seconds) || SEEK_STEP_S)); return; }
    else if (action === "seek") {
      if (!total) return;
      video.currentTime = Math.min(total, Math.max(0, Number(cmd.position) || 0));
    }
    else if (action === "restart") {
      // Watching again means skipping the sponsors again too
      for (const seg of adSegments) seg.done = false;
      skippedCount = 0; skippedSeconds = 0;
      video.currentTime = 0;
      video.play().catch(() => {});
    }
    else if (action === "end") { if (total) video.currentTime = total; }
    else if (action === "speed") { setRateValue(cmd.rate); }
    else if (action === "mute") { video.muted = true; }
    else if (action === "unmute") { video.muted = false; }
    else if (action === "captions_on") { await setCaptions(true); }
    else if (action === "captions_off") { await setCaptions(false); }
    else { return; }
    pushState();
  }

  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const data = e.data;
    if (!data || typeof data !== "object") return;
    // Commands only from the screen itself, never from anything else that
    // got a handle on this window.
    if (data.type === "botVideo" && e.origin === window.location.origin) botCommand(data);
  });

  // The screen's style, theme and skin are applied by the kit (app-kit.js);
  // the app only follows the language.
  if (window.BotApp) BotApp.onChange((st) => {
    if (st.lang === lang) return;
    lang = st.lang;
    applyI18n();
    say(statusKey[0], statusKey[1], statusKey[2]);
    if (vmsgKey) vsay(vmsgKey);
    if (!lastTracks.length && !player.classList.contains("on")) renderHome();
    renderSettings();
  });

  /* Hidden but not closed: do not keep playing sound from an invisible app. */
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && !video.paused) { video.pause(); pushState(); }
  });

  applyI18n();
  paintIcons();
  setPlayIcon(false);
  setSort(storageGet(SORT_KEY, "relevance"), false);
  loadSettings();
  q.value = storageGet(KEY, "");
  syncClear();
  if (q.value) search(); else renderHome();
</script>
</body>
</html>
