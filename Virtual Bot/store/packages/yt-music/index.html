<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>YT Music</title>
<style>
  :root {
    --bg: #16181a; --panel: #1e2124; --line: #2f3438; --text: #e8e4dc;
    --muted: #8e9498; --accent: #d17a58; --ok: #8ca879; --off: #6b7175;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #efe7d9; --panel: #fbf6ec; --line: #ddcdb2; --text: #2f271f;
    --muted: #7d6d5c; --accent: #b95f3d; --ok: #6f8b5f; --off: #a8998a;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--text);
    font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }

  .app { display: flex; flex-direction: column; height: 100%; padding: 6px 8px 6px; gap: 5px; }
  .bar { display: flex; gap: 5px; flex: none; }
  input { flex: 1; min-width: 0; height: 28px; padding: 0 10px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--panel); outline: none; font-size: 12px; }
  input:focus { border-color: var(--accent); }
  .btn { flex: none; min-width: 28px; height: 28px; padding: 0 10px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--panel); font-size: 11px; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .btn.icon { width: 28px; padding: 0; }
  .btn:active { border-color: var(--accent); color: var(--accent); }
  .seg { display: flex; flex: none; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); height: 22px; padding: 0 10px;
    font-size: 10px; font-weight: 700; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--bg); }
  .row2 { display: flex; align-items: center; gap: 6px; flex: none; }
  .status { flex: 1; min-width: 0; color: var(--muted); font-size: 10px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .status.now { color: var(--accent); }

  .list { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; scrollbar-width: none;
    border-top: 1px solid var(--line); padding-top: 3px; }
  .list::-webkit-scrollbar { display: none; }
  .shelf { margin: 6px 0 3px; color: var(--muted); font-size: 9.5px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; }
  /* Albums scroll sideways in one row: a 172px-tall frame cannot spend two
     rows of covers before the first song. */
  .albums { display: flex; gap: 7px; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; padding-bottom: 2px; }
  .albums::-webkit-scrollbar { display: none; }
  .album { flex: none; width: 76px; border: 0; padding: 0; background: transparent; text-align: left; cursor: pointer; }
  .album img, .album .ph { width: 76px; height: 76px; border-radius: 6px; display: block; object-fit: cover;
    background: var(--line); }
  .album .t { margin-top: 3px; font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album .s { font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { display: flex; align-items: center; gap: 7px; width: 100%; min-height: 40px; padding: 3px 0;
    border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
  .track:active .tt { color: var(--accent); }
  .track.on .tt { color: var(--accent); }
  .cover { width: 34px; height: 34px; flex: none; border-radius: 4px; object-fit: cover; background: var(--line); }
  .num { width: 22px; flex: none; text-align: center; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .ti { flex: 1; min-width: 0; }
  .tt { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ts { font-size: 9.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini { flex: none; width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 9px;
    background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .mini:active { color: var(--accent); border-color: var(--accent); }
  .hint { padding: 8px 2px; color: var(--muted); font-size: 10.5px; line-height: 1.45; }

  .sheet { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  .shead { flex: none; display: flex; align-items: center; gap: 7px; padding: 6px 8px 4px; }
  .shead .t { flex: 1; min-width: 0; font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sbody { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; padding: 2px 8px 10px; scrollbar-width: none; }
  .sbody::-webkit-scrollbar { display: none; }
  .ahead { display: flex; gap: 8px; align-items: center; padding: 4px 0 6px; }
  .ahead img, .ahead .ph { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--line); flex: none; }
  .lyrics { white-space: pre-wrap; font-size: 11.5px; line-height: 1.5; }
  .source { margin-top: 8px; color: var(--muted); font-size: 9px; }

  /* Mini bar under the list: what the screen is playing right now. */
  .app { position: relative; }
  .mini-np { flex: none; display: flex; align-items: center; gap: 7px; width: 100%; height: 34px;
    padding: 0 3px 0 0; border: 1px solid var(--line); border-radius: 9px; background: var(--panel);
    text-align: left; cursor: pointer; overflow: hidden; }
  .mini-np img { width: 32px; height: 32px; flex: none; object-fit: cover; background: var(--line); }
  .mini-np .ti { flex: 1; min-width: 0; }
  .mini-np .mini { border: 0; color: var(--text); }

  /* ---- The player: the whole panel, like the YouTube video player ----
     Cover on the left, title and transport on its right, the lyrics under
     both. Only transform and opacity move: on the Pi's A53 a reflow per
     lyric line would be felt. */
  .player { position: absolute; inset: 0; display: flex; flex-direction: column;
    background: var(--bg); overflow: hidden; }
  .pbg { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--tint, var(--accent)) 42%, var(--bg)) 0%,
      color-mix(in srgb, var(--tint, var(--accent)) 14%, var(--bg)) 55%, var(--bg) 100%);
    transition: opacity .4s linear; }
  .ptop { position: relative; flex: none; display: flex; gap: 9px; padding: 8px 8px 4px; }
  .pcover { width: 86px; height: 86px; flex: none; border-radius: 7px; object-fit: cover;
    background: var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .35); }
  .pinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
  .phead { display: flex; align-items: flex-start; gap: 4px; }
  .ptext { flex: 1; min-width: 0; }
  .ptitle { font-size: 13px; font-weight: 800; line-height: 1.2; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .partist { margin-top: 2px; font-size: 10px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .pclose { flex: none; width: 26px; height: 26px; margin: -3px -3px 0 0; border: 0; border-radius: 13px;
    background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .pclose:active { background: var(--line); }
  .pctl { display: flex; align-items: center; gap: 10px; }
  .pctl button { width: 30px; height: 30px; border: 0; border-radius: 15px; background: transparent;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .pctl button svg.i { width: 17px; height: 17px; }
  .pctl button:disabled { opacity: .35; }
  .pctl button:active { background: var(--line); }
  .pctl .big { width: 38px; height: 38px; border-radius: 19px; background: var(--text); color: var(--bg); }
  .pctl .big svg.i { width: 18px; height: 18px; }
  .pctl .big:active { background: var(--accent); }
  .pctl .big.wait { opacity: .6; }
  .pseek { display: flex; align-items: center; gap: 6px; font-size: 9px; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  .pbar { flex: 1; height: 16px; position: relative; cursor: pointer; }
  .pbar i, .pbar b { position: absolute; left: 0; right: 0; top: 7px; height: 3px; border-radius: 2px; display: block; }
  .pbar i { background: color-mix(in srgb, var(--text) 22%, transparent); }
  .pbar b { background: var(--text); transform: scaleX(0); transform-origin: left center; }

  /* Lyrics: a column that slides up so the current line sits a third of
     the way down. The current line grows by transform and fills left to
     right as it is sung (background-clip: text). */
  .plyr { position: relative; flex: 1; min-height: 0; overflow: hidden; padding: 0 12px;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 16%, #000 78%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0, #000 16%, #000 78%, transparent 100%); }
  .plines { will-change: transform; transition: transform .5s cubic-bezier(.22, .61, .36, 1); }
  .l { width: 88%; padding: 3px 0; font-size: 13px; font-weight: 800; line-height: 1.25;
    color: color-mix(in srgb, var(--text) 42%, transparent); transform-origin: left center;
    transition: transform .3s ease, color .3s linear, opacity .3s linear; cursor: pointer; }
  .l.past { opacity: .55; }
  .l.now { transform: scale(1.1); color: transparent;
    background-image: linear-gradient(90deg, var(--text) 50%, color-mix(in srgb, var(--text) 42%, transparent) 50%);
    background-size: 200% 100%; background-position-x: 100%;
    -webkit-background-clip: text; background-clip: text; }
  .l.gap { font-size: 12px; }
  .plain .l { font-size: 11.5px; font-weight: 600; color: color-mix(in srgb, var(--text) 78%, transparent); cursor: default; }
  .pmsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 0 20px; text-align: center; color: var(--muted); font-size: 11px; line-height: 1.45; }
  .psrc.bad { color: var(--accent); }
  .psrc { position: relative; flex: none; height: 13px; padding: 0 12px 2px; font-size: 8.5px;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <input id="q" type="search" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria">
    <button class="btn" id="go" type="button" data-i18n="search.go"></button>
    <button class="btn icon" id="homeBtn" type="button" data-i18n-aria="home.aria" data-icon="home"></button>
  </div>
  <div class="row2">
    <div class="seg" id="kind" role="group">
      <button type="button" data-kind="songs" class="on" data-i18n="kind.songs"></button>
      <button type="button" data-kind="albums" data-i18n="kind.albums"></button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="list" id="list"></div>
  <button class="mini-np" id="miniNp" type="button" hidden>
    <img id="miniCover" alt="">
    <div class="ti"><div class="tt" id="miniTitle"></div><div class="ts" id="miniArtist"></div></div>
    <span class="mini" id="miniPlay" role="button"></span>
  </button>
</div>

<div class="player" id="player" hidden>
  <div class="pbg"></div>
  <div class="ptop">
    <img class="pcover" id="pcover" alt="">
    <div class="pinfo">
      <div class="phead">
        <div class="ptext"><div class="ptitle" id="ptitle"></div><div class="partist" id="partist"></div></div>
        <button class="pclose" id="pclose" type="button" data-i18n-aria="player.close" data-icon="down"></button>
      </div>
      <div class="pctl">
        <button id="pprev" type="button" data-i18n-aria="player.prev" data-icon="prev"></button>
        <button id="pplay" class="big" type="button" data-i18n-aria="player.playPause"></button>
        <button id="pnext" type="button" data-i18n-aria="player.next" data-icon="next"></button>
      </div>
      <div class="pseek"><span id="pcur">0:00</span><div class="pbar" id="pbar"><i></i><b id="pfill"></b></div><span id="pdur">0:00</span></div>
    </div>
  </div>
  <div class="plyr" id="plyr"><div class="plines" id="plines"></div><div class="pmsg" id="pmsg" hidden></div></div>
  <div class="psrc" id="psrc"></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="shead">
    <button class="btn" id="sheetBack" type="button"><span data-icon="back"></span><span data-i18n="common.back"></span></button>
    <div class="t" id="sheetTitle"></div>
  </div>
  <div class="sbody" id="sheetBody"></div>
</div>

<script>
  // YouTube Music on the screen.
  //   what to play -> /api/ytm/... (the Rust helper on the backend)
  //   how to play  -> /api/music/play with an up-next queue: the track goes to
  //                   Now Playing and keeps playing after this app closes
  //   covers       -> /api/ytm/cover, so the device never calls Google itself
  const $ = (id) => document.getElementById(id);

  const STR = {
    uk: {
      "search.placeholder": "Пісня, виконавець, альбом",
      "search.aria": "Пошук у YouTube Music",
      "search.go": "Знайти",
      "home.aria": "Головна",
      "kind.songs": "Пісні",
      "kind.albums": "Альбоми",
      "common.back": "Назад",
      "status.home": "YouTube Music",
      "status.loading": "Завантажую…",
      "status.searching": "Шукаю «{q}»…",
      "status.found": "Знайдено: {n}",
      "status.nothing": "Нічого не знайшлось.",
      "status.starting": "Вмикаю: {title}",
      "status.playing": "Грає: {title} · далі {n}",
      "status.failed": "Не вийшло: {error}",
      "status.offline": "Бот недоступний.",
      "status.unavailable": "YouTube Music не підключено: на боті не зібрано ytm-helper.",
      "shelf.new": "Нові альбоми",
      "shelf.charts": "Чарт",
      "shelf.trending": "У тренді",
      "shelf.newTracks": "Нові кліпи",
      "shelf.recent": "Нещодавно",
      "album.play": "Грати все",
      "lyrics.title": "Текст",
      "lyrics.none": "Тексту для цієї пісні немає.",
      "lyrics.aria": "Текст пісні",
      "hint.empty": "Шукай пісні й альбоми. Тап по пісні відкриває плеєр із текстом, що йде за музикою, і додає радіо «далі» — схожі треки, як у YouTube Music.",
      "player.close": "Згорнути плеєр",
      "player.prev": "Попередній",
      "player.next": "Наступний",
      "player.playPause": "Грати або пауза",
      "player.lyricsLoading": "Шукаю текст…",
      "player.noLyrics": "Тексту для цієї пісні не знайшлось.",
      "player.plainSource": "Текст без таймінгу · {source}",
      "player.syncedSource": "Текст синхронізовано · {source}",
      "player.starting": "Вмикаю…",
      "player.streamFailed": "Звук не пішов: YouTube не віддав потік. Спробуй ще раз.",
    },
    en: {
      "search.placeholder": "Song, artist, album",
      "search.aria": "Search YouTube Music",
      "search.go": "Search",
      "home.aria": "Home",
      "kind.songs": "Songs",
      "kind.albums": "Albums",
      "common.back": "Back",
      "status.home": "YouTube Music",
      "status.loading": "Loading…",
      "status.searching": "Searching “{q}”…",
      "status.found": "Found {n}",
      "status.nothing": "Nothing found.",
      "status.starting": "Starting: {title}",
      "status.playing": "Playing: {title} · {n} up next",
      "status.failed": "Failed: {error}",
      "status.offline": "The bot is offline.",
      "status.unavailable": "YouTube Music isn't set up: ytm-helper is not built on the bot.",
      "shelf.new": "New albums",
      "shelf.charts": "Charts",
      "shelf.trending": "Trending",
      "shelf.newTracks": "New videos",
      "shelf.recent": "Recently played",
      "album.play": "Play all",
      "lyrics.title": "Lyrics",
      "lyrics.none": "No lyrics for this song.",
      "lyrics.aria": "Lyrics",
      "hint.empty": "Search songs and albums. Tapping a song opens the player with lyrics that follow the music, plus an up-next radio of similar tracks, like YouTube Music.",
      "player.close": "Collapse player",
      "player.prev": "Previous",
      "player.next": "Next",
      "player.playPause": "Play or pause",
      "player.lyricsLoading": "Looking for lyrics…",
      "player.noLyrics": "No lyrics found for this song.",
      "player.plainSource": "Unsynced lyrics · {source}",
      "player.syncedSource": "Synced lyrics · {source}",
      "player.starting": "Starting…",
      "player.streamFailed": "No sound: YouTube did not hand over the stream. Try again.",
    },
  };

  function storageGet(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
  }
  function storageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  let lang = storageGet("botScreenLang", "uk") === "en" ? "en" : "uk";
  function t(key, vars) {
    let text = (STR[lang] && STR[lang][key]) || STR.uk[key] || key;
    if (vars) for (const k in vars) text = text.split("{" + k + "}").join(String(vars[k]));
    return text;
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll("[data-i18n-placeholder]")) el.placeholder = t(el.dataset.i18nPlaceholder);
    for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
  }

  // play/pause/prev/next/list/music copied verbatim from static/screen/icons.js
  const ICONS = {
    play: '<path d="M8 5.4v13.2L19.2 12z"/>',
    pause: '<path d="M8.6 5.5v13M15.4 5.5v13"/>',
    prev: '<path d="M17.5 5.5v13L8.2 12z"/><path d="M6.5 5.5v13"/>',
    next: '<path d="M6.5 5.5v13L15.8 12z"/><path d="M17.5 5.5v13"/>',
    down: '<path d="m6 9.5 6 6 6-6"/>',
    list: '<path d="M4 6.5h.01M4 12h.01M4 17.5h.01M8.5 6.5h11.5M8.5 12h11.5M8.5 17.5h11.5"/>',
    music: '<path d="M9.2 18V6.2l9.3-2v11.6"/><circle cx="6.9" cy="18" r="2.4"/><circle cx="16.2" cy="15.8" r="2.4"/>',
    back: '<path d="m14 5-7 7 7 7M7 12h13"/>',
    home: '<path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>',
    lyrics: '<path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8.5h5M9 12.5h7M9 16h5"/>',
  };
  function icon(name) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.play) + "</svg>"; }
  function paintIcons() { for (const el of document.querySelectorAll("[data-icon]")) el.innerHTML = icon(el.dataset.icon); }

  const list = $("list"), status = $("status"), q = $("q");
  const RECENT_KEY = "yt-music.recent";
  let kind = "songs";
  let statusState = ["status.home", null, false];
  let view = "home";            // what the list shows, for relocalising
  let lastData = null;
  let playingId = "";
  // Covers by video id: the screen's Now Playing knows the track, not its
  // album art, so the player looks the cover up in what this app has shown.
  const covers = {};

  function say(key, vars, now) {
    statusState = [key, vars || null, !!now];
    status.textContent = t(key, vars);
    status.className = "status" + (now ? " now" : "");
  }
  function fmt(sec) {
    sec = Math.max(0, Math.floor(Number(sec) || 0));
    return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  }
  function coverUrl(url) { return url ? "/api/ytm/cover?u=" + encodeURIComponent(url) : ""; }
  function errorText(payload, fallback) {
    const d = payload && payload.detail;
    if (d && typeof d === "object" && d.code === "unavailable") return t("status.unavailable");
    if (d && typeof d.message === "string") return d.message;
    if (typeof d === "string") return d;
    return fallback;
  }

  async function api(path) {
    let resp;
    try { resp = await fetch(path); } catch (e) { throw new Error(t("status.offline")); }
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(errorText(data, String(resp.status)));
    return data;
  }

  function img(url, cls) {
    if (!url) { const ph = document.createElement("div"); ph.className = cls + " ph"; return ph; }
    const el = document.createElement("img");
    el.className = cls; el.alt = ""; el.loading = "lazy"; el.decoding = "async";
    el.src = coverUrl(url);
    el.addEventListener("error", () => el.removeAttribute("src"), { once: true });
    return el;
  }

  function shelf(key) {
    const el = document.createElement("div");
    el.className = "shelf";
    el.textContent = t(key);
    return el;
  }

  /* A track row. `queue` is what should follow it: the rest of an album, or
     nothing — then the YouTube Music radio for that track is fetched. */
  function trackRow(track, opts) {
    if (track.id && track.cover) covers[track.id] = track.cover;
    const row = document.createElement("div");
    row.className = "track" + (track.id === playingId ? " on" : "");
    row.setAttribute("role", "button");
    if (opts && opts.number) {
      const n = document.createElement("div");
      n.className = "num"; n.textContent = String(opts.number);
      row.appendChild(n);
    } else {
      row.appendChild(img(track.cover, "cover"));
    }
    const info = document.createElement("div");
    info.className = "ti";
    const title = document.createElement("div");
    title.className = "tt"; title.textContent = track.title;
    const sub = document.createElement("div");
    sub.className = "ts";
    sub.textContent = [(track.artists || []).join(", "), track.duration ? fmt(track.duration) : ""].filter(Boolean).join(" · ");
    info.append(title, sub);
    row.appendChild(info);
    const words = document.createElement("button");
    words.type = "button"; words.className = "mini";
    words.setAttribute("aria-label", t("lyrics.aria"));
    words.innerHTML = icon("lyrics");
    words.addEventListener("click", (e) => { e.stopPropagation(); openLyrics(track); });
    row.appendChild(words);
    row.addEventListener("click", () => play(track, opts && opts.queue));
    return row;
  }

  function albumCard(album) {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "album";
    btn.appendChild(img(album.cover, ""));
    const title = document.createElement("div");
    title.className = "t"; title.textContent = album.title;
    const sub = document.createElement("div");
    sub.className = "s"; sub.textContent = [(album.artists || []).join(", "), album.year || ""].filter(Boolean).join(" · ");
    btn.append(title, sub);
    btn.addEventListener("click", () => openAlbum(album));
    return btn;
  }

  /* ---------- play ---------- */

  function toQueueItem(track) {
    return { id: track.id, title: track.title || "", uploader: (track.artists || []).join(", "), duration: track.duration || 0 };
  }

  async function play(track, queue) {
    say("status.starting", { title: track.title }, true);
    openPlayer({ id: track.id, title: track.title, uploader: (track.artists || []).join(", "),
                 duration: track.duration || 0, cover: track.cover || "" }, true);
    let upNext = queue;
    if (!upNext) {
      // Radio first, then play: two plays would restart the stream. The
      // helper answers in about a second, and the result is cached.
      try {
        const radio = await Promise.race([
          api("/api/ytm/radio?id=" + encodeURIComponent(track.id) + "&limit=25"),
          new Promise((_, reject) => setTimeout(() => reject(new Error("slow")), 4000)),
        ]);
        upNext = radio.tracks || [];
      } catch (e) { upNext = []; }
    }
    try {
      const resp = await fetch("/api/music/play", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...toQueueItem(track), queue: upNext.filter((x) => x.id && x.id.length === 11).slice(0, 50).map(toQueueItem) }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        say("status.failed", { error: errorText(err, String(resp.status)) });
        pending = null;
        showLyricsMessage(t("status.failed", { error: errorText(err, String(resp.status)) }));
        return;
      }
      playingId = track.id;
      remember(track);
      for (const row of document.querySelectorAll(".track.on")) row.classList.remove("on");
      say("status.playing", { title: track.title, n: upNext.length }, true);
    } catch (e) {
      say("status.offline");
    }
  }

  function remember(track) {
    let recent = [];
    try { recent = JSON.parse(storageGet(RECENT_KEY, "[]")) || []; } catch (e) {}
    recent = [track].concat(recent.filter((x) => x.id !== track.id)).slice(0, 8);
    storageSet(RECENT_KEY, JSON.stringify(recent));
  }
  function recentTracks() {
    try { const v = JSON.parse(storageGet(RECENT_KEY, "[]")); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }

  /* ---------- views ---------- */

  async function showHome() {
    view = "home";
    list.innerHTML = "";
    const recent = recentTracks();
    if (recent.length) {
      list.appendChild(shelf("shelf.recent"));
      for (const tr of recent.slice(0, 3)) list.appendChild(trackRow(tr));
    }
    say("status.loading");
    let data;
    try {
      data = lastData && view === "home" && lastData.home ? lastData.home : await api("/api/ytm/home?country=UA");
      lastData = { home: data };
    } catch (e) {
      status.textContent = e.message;
      if (!recent.length) {
        const hint = document.createElement("div");
        hint.className = "hint"; hint.textContent = t("hint.empty");
        list.appendChild(hint);
      }
      return;
    }
    if (view !== "home") return;
    if ((data.new_albums || []).length) {
      list.appendChild(shelf("shelf.new"));
      const row = document.createElement("div");
      row.className = "albums";
      for (const a of data.new_albums) row.appendChild(albumCard(a));
      list.appendChild(row);
    }
    const sections = [["shelf.charts", data.charts], ["shelf.trending", data.trending], ["shelf.newTracks", data.new_tracks]];
    for (const [key, tracks] of sections) {
      if (!(tracks || []).length) continue;
      list.appendChild(shelf(key));
      for (const tr of tracks.slice(0, 10)) list.appendChild(trackRow(tr));
    }
    say("status.home");
  }

  async function search() {
    const query = q.value.trim();
    if (!query) { showHome(); return; }
    view = "search";
    storageSet("yt-music.lastQuery", query);
    list.innerHTML = "";
    say("status.searching", { q: query });
    try {
      const path = kind === "albums" ? "/api/ytm/albums?q=" : "/api/ytm/search?q=";
      const data = await api(path + encodeURIComponent(query) + "&limit=20");
      if (view !== "search") return;
      const items = kind === "albums" ? (data.albums || []) : (data.tracks || []);
      if (!items.length) { say("status.nothing"); return; }
      if (kind === "albums") {
        const grid = document.createElement("div");
        grid.className = "albums";
        grid.style.flexWrap = "wrap";
        grid.style.overflowX = "visible";
        for (const a of items) grid.appendChild(albumCard(a));
        list.appendChild(grid);
      } else {
        for (const tr of items) list.appendChild(trackRow(tr));
      }
      say("status.found", { n: items.length });
    } catch (e) {
      status.textContent = e.message;
    }
  }

  function openSheet(title) {
    $("sheetTitle").textContent = title;
    $("sheetBody").innerHTML = "";
    $("sheet").hidden = false;
    return $("sheetBody");
  }
  $("sheetBack").addEventListener("click", () => { $("sheet").hidden = true; });

  async function openAlbum(album) {
    const body = openSheet(album.title);
    body.textContent = t("status.loading");
    let data;
    try { data = await api("/api/ytm/album?id=" + encodeURIComponent(album.id)); }
    catch (e) { body.textContent = e.message; return; }
    body.innerHTML = "";
    const head = document.createElement("div");
    head.className = "ahead";
    head.appendChild(img(data.cover || album.cover, ""));
    const info = document.createElement("div");
    info.className = "ti";
    const title = document.createElement("div");
    title.className = "tt"; title.textContent = data.title || album.title;
    const sub = document.createElement("div");
    sub.className = "ts"; sub.textContent = [(data.artists || []).join(", "), data.year || ""].filter(Boolean).join(" · ");
    const all = document.createElement("button");
    all.type = "button"; all.className = "btn"; all.style.marginTop = "5px";
    all.innerHTML = icon("play") + "<span></span>";
    all.querySelector("span").textContent = t("album.play");
    const tracks = (data.tracks || []).filter((x) => x.id);
    all.addEventListener("click", () => { if (tracks.length) play(tracks[0], tracks.slice(1)); });
    info.append(title, sub, all);
    head.appendChild(info);
    body.appendChild(head);
    tracks.forEach((tr, i) => {
      const withCover = { ...tr, cover: tr.cover || data.cover };
      body.appendChild(trackRow(withCover, { number: i + 1, queue: tracks.slice(i + 1) }));
    });
  }

  async function openLyrics(track) {
    const body = openSheet(t("lyrics.title") + " · " + track.title);
    body.textContent = t("status.loading");
    let data;
    try { data = await api("/api/ytm/lyrics?id=" + encodeURIComponent(track.id)); }
    catch (e) { body.textContent = e.message; return; }
    body.innerHTML = "";
    const text = document.createElement("div");
    text.className = "lyrics";
    text.textContent = data.lyrics ? String(data.lyrics).replace(/\r/g, "") : t("lyrics.none");
    body.appendChild(text);
    if (data.lyrics && data.source) {
      const src = document.createElement("div");
      src.className = "source"; src.textContent = data.source;
      body.appendChild(src);
    }
  }

  /* ---------- the player ----------
     The sound plays in the screen (Now Playing), which pushes its state here
     as {type:"botMusic"} and takes {type:"botMusicControl"} back. So music
     keeps going when this app closes, and there is never a second <audio>.
     Between messages the position is interpolated, so a lyric line changes
     on time rather than on the next message. */

  const player = $("player"), plines = $("plines"), pmsg = $("pmsg");
  let np = null;               // last botMusic state
  let npAt = 0;                // performance.now() when it arrived
  let pending = null;          // {id, until}: a tap we are waiting on
  let shown = null;            // track the player shows
  let lyr = { id: "", kind: "none", lines: [], els: [] };
  let lineIdx = -2;
  let raf = 0, lastSec = -1;

  function control(action, extra) {
    try { window.parent.postMessage({ type: "botMusicControl", action, ...(extra || {}) }, "*"); } catch (e) {}
  }
  function fullScreen(on) {
    try { window.parent.postMessage({ type: "storeAppFullscreen", on: !!on }, "*"); } catch (e) {}
  }

  function coverFor(tr) {
    if (!tr) return "";
    const c = tr.cover || covers[tr.id];
    // Fallback: the video thumbnail, which for a song is its album art
    // (the square box crops the 16:9 frame to its middle).
    return c ? coverUrl(c) : "/api/video/thumb?id=" + encodeURIComponent(tr.id);
  }

  /* Tint the background with the cover's own colour: an 8x8 average,
     computed once per track. Same-origin images only, which ours are. */
  function tintFrom(imgEl) {
    try {
      const c = document.createElement("canvas");
      c.width = c.height = 8;
      const g = c.getContext("2d", { willReadFrequently: true });
      g.drawImage(imgEl, 0, 0, 8, 8);
      const d = g.getImageData(0, 0, 8, 8).data;
      let r = 0, gg = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; n++; }
      player.style.setProperty("--tint", "rgb(" + [r, gg, b].map((v) => Math.round(v / n)).join(",") + ")");
    } catch (e) { player.style.removeProperty("--tint"); }
  }
  $("pcover").addEventListener("load", (e) => tintFrom(e.target));
  $("pcover").addEventListener("error", (e) => { e.target.removeAttribute("src"); player.style.removeProperty("--tint"); });

  function showTrack(tr) {
    const same = shown && shown.id === tr.id;
    shown = { ...(shown && same ? shown : {}), ...tr };
    if (!shown.cover && covers[tr.id]) shown.cover = covers[tr.id];
    $("ptitle").textContent = shown.title || "";
    $("partist").textContent = shown.uploader || "";
    if (!same) {
      $("pcover").src = coverFor(shown);
      loadLyrics(shown);
    }
  }

  function openPlayer(tr, starting) {
    player.hidden = false;
    fullScreen(true);
    if (tr) {
      if (starting) pending = { id: tr.id, until: performance.now() + 20000 };
      showTrack(tr);
      if (starting) setPlayButton(false, true);
    }
    control("state");
    startLoop();
  }
  function closePlayer() {
    player.hidden = true;
    fullScreen(false);
    cancelAnimationFrame(raf);
    raf = 0;
    renderMini();
  }
  $("pclose").addEventListener("click", closePlayer);

  function setPlayButton(playing, waiting) {
    const b = $("pplay");
    b.innerHTML = icon(playing ? "pause" : "play");
    b.classList.toggle("wait", !!waiting);
  }
  $("pplay").addEventListener("click", () => control("toggle"));
  $("pprev").addEventListener("click", () => control("prev"));
  $("pnext").addEventListener("click", () => control("next"));
  $("pbar").addEventListener("click", (e) => {
    const total = np && np.duration;
    if (!total || np.live) return;
    const box = e.currentTarget.getBoundingClientRect();
    control("seek", { position: Math.max(0, Math.min(1, (e.clientX - box.left) / box.width)) * total });
  });

  // Swipe down collapses the player, the way phones do it.
  (function swipeDown() {
    let start = null;
    player.addEventListener("pointerdown", (e) => { start = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
    player.addEventListener("pointerup", (e) => {
      if (!start || start.id !== e.pointerId) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      start = null;
      if (dy > 60 && dy > Math.abs(dx) * 2) closePlayer();
    });
    player.addEventListener("pointercancel", () => { start = null; });
  })();

  function position() {
    if (!np) return 0;
    const drift = np.playing && !np.loading ? (performance.now() - npAt) / 1000 : 0;
    return Math.min(np.duration || Infinity, (np.position || 0) + drift);
  }

  /* ---------- lyrics ---------- */

  function showLyricsMessage(text) {
    plines.innerHTML = "";
    plines.style.transform = "";
    pmsg.textContent = text;
    pmsg.hidden = !text;
  }

  async function loadLyrics(tr) {
    const id = tr.id;
    lyr = { id, kind: "loading", lines: [], els: [] };
    lineIdx = -2;
    $("psrc").textContent = "";
    showLyricsMessage(t("player.lyricsLoading"));
    let data;
    try {
      data = await api("/api/ytm/synced?id=" + encodeURIComponent(id) +
        "&title=" + encodeURIComponent(tr.title || "") +
        "&artist=" + encodeURIComponent(tr.uploader || "") +
        "&duration=" + encodeURIComponent(Math.round(tr.duration || 0)));
    } catch (e) { data = { kind: "none" }; }
    if (!shown || shown.id !== id) return;       // the song changed meanwhile
    plines.innerHTML = "";
    plines.classList.toggle("plain", data.kind === "plain");
    if (data.kind === "synced" && (data.lines || []).length) {
      lyr = { id, kind: "synced", lines: data.lines, els: [] };
      for (const line of data.lines) {
        const el = document.createElement("div");
        el.className = "l" + (line.text ? "" : " gap");
        el.textContent = line.text || "· · ·";   // an instrumental gap
        el.addEventListener("click", () => control("seek", { position: line.t }));
        plines.appendChild(el);
        lyr.els.push(el);
      }
      lyr.srcText = t("player.syncedSource", { source: data.source || "LRCLIB" });
      $("psrc").textContent = lyr.srcText;
    } else if (data.kind === "plain" && data.text) {
      lyr = { id, kind: "plain", lines: [], els: [] };
      for (const text of String(data.text).split("\n")) {
        const el = document.createElement("div");
        el.className = "l";
        el.textContent = text || " ";
        plines.appendChild(el);
      }
      lyr.srcText = t("player.plainSource", { source: data.source || "YouTube Music" });
      $("psrc").textContent = lyr.srcText;
    } else {
      lyr = { id, kind: "none", lines: [], els: [] };
      showLyricsMessage(t("player.noLyrics"));
      return;
    }
    pmsg.hidden = true;
    lineIdx = -2;
    tick(true);
  }

  // The last line whose start has passed. Binary search: a song has ~60
  // lines and this runs every frame.
  function currentLine(pos) {
    const lines = lyr.lines;
    let lo = 0, hi = lines.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (lines[mid].t <= pos + 0.15) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }

  function placeLines(targetEl) {
    const box = $("plyr").clientHeight;
    const y = targetEl ? targetEl.offsetTop - box * 0.34 : 0;
    plines.style.transform = "translate3d(0," + (-Math.max(0, y)).toFixed(1) + "px,0)";
  }

  function tick(force) {
    const pos = position();
    const total = np ? np.duration || 0 : 0;
    const sec = Math.floor(pos);
    if (force || sec !== lastSec) {
      lastSec = sec;
      $("pcur").textContent = fmt(pos);
      $("pdur").textContent = total ? fmt(total) : "0:00";
    }
    $("pfill").style.transform = "scaleX(" + (total ? Math.min(1, pos / total) : 0).toFixed(4) + ")";

    if (lyr.kind === "synced") {
      const idx = currentLine(pos);
      if (idx !== lineIdx || force) {
        if (lyr.els[lineIdx]) lyr.els[lineIdx].classList.remove("now");
        lyr.els.forEach((el, i) => el.classList.toggle("past", i < idx));
        lineIdx = idx;
        const el = lyr.els[idx];
        if (el) el.classList.add("now");
        placeLines(el || null);
      }
      const el = lyr.els[lineIdx];
      if (el) {
        const start = lyr.lines[lineIdx].t;
        const next = lyr.lines[lineIdx + 1];
        const end = next ? next.t : start + 4;
        const p = Math.max(0, Math.min(1, (pos - start) / Math.max(0.3, end - start)));
        el.style.backgroundPositionX = ((1 - p) * 100).toFixed(1) + "%";
      }
    } else if (lyr.kind === "plain" && total) {
      // No timing: glide through the text by progress, no fake highlight.
      const room = Math.max(0, plines.scrollHeight - $("plyr").clientHeight * 0.6);
      const y = room * Math.min(1, pos / total);
      if (force || Math.abs(y - (tick.lastY || 0)) > 2) {
        tick.lastY = y;
        plines.style.transform = "translate3d(0," + (-y).toFixed(1) + "px,0)";
      }
    }
  }

  function loop() {
    raf = 0;
    if (player.hidden) return;
    tick(false);
    if (np && np.playing) raf = requestAnimationFrame(loop);
  }
  function startLoop() {
    if (!raf && !player.hidden) raf = requestAnimationFrame(loop);
  }

  function onMusicState(data) {
    np = data;
    npAt = performance.now();
    const tr = data.track;
    if (pending && (!tr || tr.id !== pending.id)) {
      // The previous song is still reporting while ours resolves: do not let
      // it take the player back.
      if (performance.now() < pending.until) { renderMini(); return; }
      pending = null;
    }
    if (tr && pending && tr.id === pending.id && (data.playing || data.failed || !data.loading)) pending = null;
    if (tr && tr.provider === "youtube" && !player.hidden) showTrack(tr);
    const waiting = !data.failed && (!!pending || data.loading);
    setPlayButton(data.playing && !data.loading, waiting);
    // Say it where the eye already is, instead of a player frozen at 0:00.
    $("psrc").classList.toggle("bad", !!data.failed);
    $("psrc").textContent = data.failed ? t("player.streamFailed") : (lyr.srcText || "");
    $("pprev").disabled = !tr;
    $("pnext").disabled = !data.hasNext;
    if (!player.hidden) { tick(true); startLoop(); }
    renderMini();
  }

  /* Mini bar in the list: the screen is playing a song, one tap opens it. */
  function renderMini() {
    const tr = np && np.track;
    const bar = $("miniNp");
    if (!tr || tr.provider !== "youtube" || !player.hidden) { bar.hidden = true; return; }
    bar.hidden = false;
    $("miniTitle").textContent = tr.title || "";
    $("miniArtist").textContent = tr.uploader || "";
    const src = coverFor(tr);
    if ($("miniCover").dataset.src !== src) { $("miniCover").dataset.src = src; $("miniCover").src = src; }
    $("miniPlay").innerHTML = icon(np.playing ? "pause" : "play");
  }
  $("miniNp").addEventListener("click", (e) => {
    if (e.target.closest("#miniPlay")) { control("toggle"); return; }
    if (np && np.track) openPlayer(np.track, false);
  });

  /* ---------- controls ---------- */

  $("go").addEventListener("click", search);
  q.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
  $("homeBtn").addEventListener("click", () => { q.value = ""; showHome(); });
  $("kind").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-kind]");
    if (!b) return;
    kind = b.dataset.kind;
    for (const x of $("kind").querySelectorAll("button")) x.classList.toggle("on", x === b);
    if (q.value.trim()) search();
  });

  // Sideways swipe closes the app, like the rest of the screen. Vertical is
  // left to the lists, which scroll.
  (function swipeToClose() {
    let start = null;
    const root = $("app");
    root.addEventListener("pointerdown", (e) => {
      if (e.target.closest("input, .albums")) return;
      start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    });
    root.addEventListener("pointerup", (e) => {
      if (!start || start.id !== e.pointerId) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      start = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) {
        window.parent.postMessage({ type: "storeAppSwipe", direction: dx < 0 ? "left" : "right" }, "*");
      }
    });
    root.addEventListener("pointercancel", () => { start = null; });
  })();

  window.addEventListener("message", (e) => {
    if (e.source !== window.parent || !e.data) return;
    if (e.data.type === "botMusic") {
      if (e.origin === window.location.origin) onMusicState(e.data);
      return;
    }
    if (e.data.type !== "botSkin") return;
    if (e.data.vars) for (const k in e.data.vars) document.documentElement.style.setProperty(k, e.data.vars[k]);
    document.documentElement.dataset.theme = e.data.theme === "light" ? "light" : "dark";
    if ((e.data.lang === "uk" || e.data.lang === "en") && e.data.lang !== lang) {
      lang = e.data.lang;
      applyI18n();
      say(statusState[0], statusState[1], statusState[2]);
      if (view === "home") showHome(); else if (view === "search") search();
      if (shown && !player.hidden) { const tr = shown; shown = null; showTrack(tr); }
    }
  });

  applyI18n();
  paintIcons();
  setPlayButton(false, false);
  control("state");
  q.value = storageGet("yt-music.lastQuery", "");
  if (q.value) search(); else showHome();
</script>
</body>
</html>
