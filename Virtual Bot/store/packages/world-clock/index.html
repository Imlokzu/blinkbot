<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>World clock</title>
  <!-- App kit v1: the screen's own look (Material You or Deep UI, any theme
       or skin) and its safe insets. See docs/SCREEN-PLATFORM.md §2.6. -->
  <link rel="stylesheet" href="/static/screen/app-kit.css">
  <script src="/static/screen/app-kit.js"></script>
  <style>
    /* Only what is the world clock's own, laid out like the Pixel Clock's
       world tab: the local time big on top, then one row per city. The
       palette, buttons and surfaces come from the kit. */
    [hidden] { display: none !important; }
    svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .kit-btn svg.i { width: 18px; height: 18px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }

    /* The local clock: the one number this screen is about */
    .here { flex: none; display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .here-time { font-size: 40px; line-height: 1; }
    .here-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .here-copy .kit-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .here-copy .here-name { color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
    .here-date { font: 600 12px/1.2 var(--font); color: var(--text); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .here-date::first-letter { text-transform: uppercase; }
    /* While editing, the pencil turns into the screen's "done" */
    #editBtn[aria-pressed="true"] { background: var(--kit-primary); color: var(--kit-on-accent); }

    /* Cities: a kit list whose rows share the height that is left */
    .list { flex: 1; min-height: 0; }
    .city { flex: 1; min-height: 0; max-height: 52px; gap: 10px; padding: 0 12px 0 8px; }
    .dn { display: grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--kit-surface-hi); color: var(--muted); }
    .dn.day { background: var(--kit-tonal); color: var(--kit-on-tonal); }
    :root[data-ui="deep"] .dn.day { background: var(--kit-primary); color: var(--kit-on-accent); }
    .city-name { overflow: hidden; font: 700 13px/1.2 var(--font); text-overflow: ellipsis; white-space: nowrap; }
    .city-sub { margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
    .city-time { font: 400 24px/1 var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    :root[data-ui="deep"] .city-time { font-weight: 300; }
    .city .kit-btn.icon { width: 30px; height: 30px; min-width: 30px; min-height: 30px; }
    .add-row { justify-content: center; gap: 8px; border: 0; color: var(--accent); font: 600 12px/1 var(--font); cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1.5px var(--kit-surface-hi); }
    .add-row:active { transform: scale(.98); }
    .empty { margin: auto; padding: 0 16px; text-align: center; }

    /* The city picker: a page of its own that slides over the list */
    .picker { position: absolute; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .16s ease, transform .16s ease; }
    :root[data-ui="deep"] .picker { background: radial-gradient(95% 70% at 50% -12%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 66%), var(--bg); }
    .picker.show { opacity: 1; pointer-events: auto; transform: none; }
    .picks { display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 6px; }
    .pick { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--kit-surface); color: var(--text); text-align: left; cursor: pointer; transition: transform 110ms ease; }
    .pick:active { transform: scale(.96); }
    .pick span { overflow: hidden; font: 600 12px/1.2 var(--font); text-overflow: ellipsis; white-space: nowrap; }
    .pick small { flex: none; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    @media (max-height: 200px) { .here-time { font-size: 30px; } .here { min-height: 34px; } .city-time { font-size: 18px; } .dn { width: 24px; height: 24px; } .city-sub { display: none; } }
  </style>
</head>
<body class="kit">
  <main class="kit-app" id="app">
    <header class="here" data-i18n-aria="title">
      <span class="kit-display here-time" id="local">00:00</span>
      <div class="here-copy">
        <span class="kit-label here-name" data-i18n="here"></span>
        <span class="here-date" id="localDate"></span>
      </div>
      <button class="kit-btn icon" id="editBtn" type="button" aria-pressed="false" data-icon="pencil" data-i18n-aria="edit"></button>
    </header>
    <section class="kit-list list" id="list"></section>
  </main>
  <section class="kit-app picker" id="picker">
    <header class="kit-bar">
      <button class="kit-btn icon" id="pickClose" type="button" data-icon="back" data-i18n-aria="close"></button>
      <span class="kit-title" data-i18n="pickTitle"></span>
    </header>
    <div class="kit-fill kit-scroll picks" id="picks"></div>
  </section>
  <script>
    const APP_ID = "world-clock";
    const CITIES = {
      kyiv: ["Europe/Kyiv", "Europe/Kiev"], london: ["Europe/London"], lisbon: ["Europe/Lisbon"], paris: ["Europe/Paris"],
      berlin: ["Europe/Berlin"], warsaw: ["Europe/Warsaw"], rome: ["Europe/Rome"], madrid: ["Europe/Madrid"],
      reykjavik: ["Atlantic/Reykjavik"], istanbul: ["Europe/Istanbul"], tbilisi: ["Asia/Tbilisi"], dubai: ["Asia/Dubai"],
      cairo: ["Africa/Cairo"], nairobi: ["Africa/Nairobi"], johannesburg: ["Africa/Johannesburg"], delhi: ["Asia/Kolkata", "Asia/Calcutta"],
      bangkok: ["Asia/Bangkok"], singapore: ["Asia/Singapore"], hongkong: ["Asia/Hong_Kong"], beijing: ["Asia/Shanghai"],
      seoul: ["Asia/Seoul"], tokyo: ["Asia/Tokyo"], sydney: ["Australia/Sydney"], auckland: ["Pacific/Auckland"],
      honolulu: ["Pacific/Honolulu"], losangeles: ["America/Los_Angeles"], denver: ["America/Denver"], chicago: ["America/Chicago"],
      newyork: ["America/New_York"], toronto: ["America/Toronto"], mexico: ["America/Mexico_City"], saopaulo: ["America/Sao_Paulo"],
      buenosaires: ["America/Argentina/Buenos_Aires"],
    };
    const STR = {
      uk: {
        title: "Світовий час", here: "Тут", edit: "Змінити список", close: "Закрити", pickTitle: "Додати місто",
        add: "Додати місто", remove: "Прибрати", empty: "Додай до чотирьох міст",
        today: "Сьогодні", tomorrow: "Завтра", yesterday: "Вчора", same: "як тут", hours: "{sign}{h} год", hoursMin: "{sign}{h}:{m} год",
        day: "День", night: "Ніч",
        kyiv: "Київ", london: "Лондон", lisbon: "Лісабон", paris: "Париж", berlin: "Берлін", warsaw: "Варшава", rome: "Рим",
        madrid: "Мадрид", reykjavik: "Рейкʼявік", istanbul: "Стамбул", tbilisi: "Тбілісі", dubai: "Дубай", cairo: "Каїр",
        nairobi: "Найробі", johannesburg: "Йоганнесбург", delhi: "Делі", bangkok: "Бангкок", singapore: "Сингапур",
        hongkong: "Гонконг", beijing: "Пекін", seoul: "Сеул", tokyo: "Токіо", sydney: "Сідней", auckland: "Окленд",
        honolulu: "Гонолулу", losangeles: "Лос-Анджелес", denver: "Денвер", chicago: "Чикаго", newyork: "Нью-Йорк",
        toronto: "Торонто", mexico: "Мехіко", saopaulo: "Сан-Паулу", buenosaires: "Буенос-Айрес",
      },
      en: {
        title: "World clock", here: "Here", edit: "Edit list", close: "Close", pickTitle: "Add a city",
        add: "Add a city", remove: "Remove", empty: "Add up to four cities",
        today: "Today", tomorrow: "Tomorrow", yesterday: "Yesterday", same: "same as here", hours: "{sign}{h} h", hoursMin: "{sign}{h}:{m} h",
        day: "Day", night: "Night",
        kyiv: "Kyiv", london: "London", lisbon: "Lisbon", paris: "Paris", berlin: "Berlin", warsaw: "Warsaw", rome: "Rome",
        madrid: "Madrid", reykjavik: "Reykjavik", istanbul: "Istanbul", tbilisi: "Tbilisi", dubai: "Dubai", cairo: "Cairo",
        nairobi: "Nairobi", johannesburg: "Johannesburg", delhi: "Delhi", bangkok: "Bangkok", singapore: "Singapore",
        hongkong: "Hong Kong", beijing: "Beijing", seoul: "Seoul", tokyo: "Tokyo", sydney: "Sydney", auckland: "Auckland",
        honolulu: "Honolulu", losangeles: "Los Angeles", denver: "Denver", chicago: "Chicago", newyork: "New York",
        toronto: "Toronto", mexico: "Mexico City", saopaulo: "Sao Paulo", buenosaires: "Buenos Aires",
      },
    };
    const ICONS = {
      pencil: '<path d="M4 20h4l10-10a2.1 2.1 0 0 0-3-3L5 17z"/>',
      x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
      back: '<path d="m14 5-7 7 7 7M7 12h13"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      sun: '<circle cx="12" cy="12" r="3.8"/><path d="M12 3v2M12 19v2M21 12h-2M5 12H3M18.4 5.6l-1.4 1.4M7 17l-1.4 1.4M18.4 18.4 17 17M7 7 5.6 5.6"/>',
      check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
      moon: '<path d="M20 14.2A8.5 8.5 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2z"/>'
    };
    /* ---- app runtime: storage, i18n, parent messages. The theme, style
       and skin are the kit's (app-kit.js). ---- */

    // Storage throws inside a sandboxed iframe (a shared .cbp runs with an
    // opaque origin), so every access is guarded and the app keeps its state
    // in memory instead of failing.
    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(APP_ID + "." + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch (_) { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
    }

    // Start in the screen's language. The kit knows it (botScreenLang, then
    // the screen's message, which also covers the sandbox).
    let lang = window.BotApp ? BotApp.lang : "uk";

    function t(key, vars) {
      let text = STR[lang][key];
      if (text == null) text = STR.uk[key];
      if (text == null) return key;
      if (vars) text = text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
      return text;
    }
    function icon(name, cls) {
      return '<svg class="i' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
    }
    function fillIcons(root) {
      (root || document).querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = icon(el.dataset.icon); });
    }
    function applyI18n() {
      document.documentElement.lang = lang;
      document.title = t("title");
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
      if (typeof onLang === "function") onLang();
    }
    // "*" on purpose: in a sandbox our origin is "null", and naming a real
    // origin as the target would silently drop the message.
    function post(message) {
      try { window.parent.postMessage(message, "*"); } catch (_) {}
    }
    document.addEventListener("click", (event) => {
      if (event.target.closest("[data-close]")) post({ type: "closeStoreApp" });
    });
    // Swipe left/right/down closes the app, same gesture as the screen's own
    // layers. Pointer capture keeps the swipe alive when the finger leaves a
    // small element; a native scroll cancels the pointer and is not a swipe.
    function enableSwipeClose(root) {
      let start = null;
      root.addEventListener("pointerdown", (event) => {
        if (start || event.target.closest("input, select, textarea, [data-noswipe]")) return;
        start = { x: event.clientX, y: event.clientY, id: event.pointerId };
        if (!event.target.closest("button")) {
          try { root.setPointerCapture(event.pointerId); } catch (_) {}
        }
      });
      function finish(event) {
        if (!start || start.id !== event.pointerId) return;
        const s = start;
        start = null;
        try { if (root.hasPointerCapture(s.id)) root.releasePointerCapture(s.id); } catch (_) {}
        if (event.type === "pointercancel") return;
        const dx = event.clientX - s.x;
        const dy = event.clientY - s.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
        if (Math.abs(dx) >= Math.abs(dy)) post({ type: "storeAppSwipe", direction: dx < 0 ? "left" : "right" });
        else if (dy > 0) post({ type: "storeAppSwipe", direction: "down" });
      }
      root.addEventListener("pointerup", finish);
      root.addEventListener("pointercancel", finish);
      window.addEventListener("pointerup", finish);
      window.addEventListener("pointercancel", finish);
      root.addEventListener("lostpointercapture", (event) => { if (start && start.id === event.pointerId) start = null; });
    }

    const MAX = 4;
    const formatters = {};
    let chosen = load("cities", ["kyiv", "london", "newyork", "tokyo"]);
    if (!Array.isArray(chosen)) chosen = ["kyiv"];
    chosen = chosen.filter((id, i) => CITIES[id] && chosen.indexOf(id) === i).slice(0, MAX);
    let editing = false, lastMinute = -1;

    // The first zone name the browser's ICU knows wins: Europe/Kyiv only
    // exists in newer builds, older Chromium on the Pi still says Kiev.
    function formatter(id) {
      if (formatters[id] !== undefined) return formatters[id];
      formatters[id] = null;
      for (const zone of CITIES[id]) {
        try {
          formatters[id] = new Intl.DateTimeFormat("en-GB", { timeZone: zone, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric" });
          break;
        } catch (_) {}
      }
      return formatters[id];
    }
    function partsIn(id, date) {
      const f = formatter(id);
      if (!f) return null;
      const out = {};
      f.formatToParts(date).forEach((p) => { if (p.type !== "literal") out[p.type] = Number(p.value); });
      out.hour %= 24;
      return out;
    }
    function offsetMin(p, date) { return Math.round((Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) - date.getTime()) / 60000); }

    function describe(id, date) {
      const p = partsIn(id, date);
      if (!p) return null;
      const diff = offsetMin(p, date) + date.getTimezoneOffset();
      const localDay = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
      const cityDay = Date.UTC(p.year, p.month - 1, p.day);
      const dayKey = cityDay > localDay ? "tomorrow" : cityDay < localDay ? "yesterday" : "today";
      let rel = t("same");
      if (diff) {
        const abs = Math.abs(diff), h = Math.floor(abs / 60), m = abs % 60;
        rel = t(m ? "hoursMin" : "hours", { sign: diff > 0 ? "+" : "−", h, m: String(m).padStart(2, "0") });
      }
      return {
        time: String(p.hour).padStart(2, "0") + ":" + String(p.minute).padStart(2, "0"),
        day: p.hour >= 6 && p.hour < 18,
        sub: t(dayKey) + ", " + rel,
      };
    }

    // Weekday and date in the screen's language, e.g. "Sat, 27 Sep"
    const dateFormats = {};
    function localDate(date) {
      try {
        if (!dateFormats[lang]) dateFormats[lang] = new Intl.DateTimeFormat(lang === "en" ? "en-GB" : "uk-UA", { weekday: "short", day: "numeric", month: "short" });
        return dateFormats[lang].format(date);
      } catch (_) { return ""; }
    }

    function render() {
      const now = new Date(Math.floor(Date.now() / 60000) * 60000);
      lastMinute = now.getTime();
      document.getElementById("local").textContent = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
      const editBtn = document.getElementById("editBtn");
      editBtn.setAttribute("aria-pressed", editing ? "true" : "false");
      editBtn.innerHTML = icon(editing ? "check" : "pencil");
      document.getElementById("localDate").textContent = localDate(now);
      const list = document.getElementById("list");
      list.innerHTML = "";
      chosen.forEach((id, i) => {
        const d = describe(id, now);
        if (!d) return;
        const row = document.createElement("div");
        row.className = "kit-item city";
        row.innerHTML = '<span class="dn ' + (d.day ? "day" : "night") + '">' + icon(d.day ? "sun" : "moon") + '</span><div class="city-copy kit-grow"><div class="city-name"></div><div class="city-sub"></div></div>' +
          (editing ? '<button class="kit-btn icon danger" type="button" data-remove="' + i + '">' + icon("x") + "</button>" : '<span class="city-time"></span>');
        row.querySelector(".dn").setAttribute("aria-label", t(d.day ? "day" : "night"));
        row.querySelector(".city-name").textContent = t(id);
        row.querySelector(".city-sub").textContent = d.sub;
        if (editing) row.querySelector("[data-remove]").setAttribute("aria-label", t("remove"));
        else row.querySelector(".city-time").textContent = d.time;
        list.appendChild(row);
      });
      if ((editing || !chosen.length) && chosen.length < MAX) {
        const add = document.createElement("button");
        add.type = "button"; add.className = "kit-item city add-row"; add.id = "addRow";
        add.innerHTML = icon("plus") + "<span></span>";
        add.lastChild.textContent = t("add");
        list.appendChild(add);
      }
      if (!chosen.length && !editing) {
        const empty = document.createElement("div");
        empty.className = "kit-label empty";
        empty.textContent = t("empty");
        list.prepend(empty);
      }
    }

    function openPicker(open) {
      const picker = document.getElementById("picker");
      if (open) {
        const now = new Date();
        const picks = document.getElementById("picks");
        picks.innerHTML = "";
        Object.keys(CITIES)
          .filter((id) => !chosen.includes(id) && formatter(id))
          .sort((a, b) => t(a).localeCompare(t(b), lang))
          .forEach((id) => {
            const d = describe(id, now);
            const b = document.createElement("button");
            b.type = "button"; b.className = "pick"; b.dataset.city = id;
            b.innerHTML = "<span></span><small></small>";
            b.firstChild.textContent = t(id);
            b.lastChild.textContent = d.time;
            picks.appendChild(b);
          });
        picks.scrollTop = 0;
      }
      picker.classList.toggle("show", open);
    }

    document.getElementById("editBtn").addEventListener("click", () => { editing = !editing; render(); });
    document.getElementById("list").addEventListener("click", (event) => {
      const rm = event.target.closest("[data-remove]");
      if (rm) { chosen.splice(Number(rm.dataset.remove), 1); save("cities", chosen); render(); return; }
      if (event.target.closest("#addRow")) openPicker(true);
    });
    document.getElementById("picks").addEventListener("click", (event) => {
      const b = event.target.closest("[data-city]");
      if (!b || chosen.length >= MAX) return;
      chosen.push(b.dataset.city);
      save("cities", chosen);
      if (chosen.length >= MAX) editing = false;
      openPicker(false);
      render();
    });
    document.getElementById("pickClose").addEventListener("click", () => openPicker(false));
    // Minute resolution is all a clock face needs; checking every 5s keeps
    // the flip close to the real minute without waking the CPU each second.
    setInterval(() => { if (!document.hidden && Math.floor(Date.now() / 60000) * 60000 !== lastMinute) render(); }, 5000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

    function onLang() { render(); if (document.getElementById("picker").classList.contains("show")) openPicker(true); }
    // The screen's style and theme are applied by the kit; the app only
    // follows the language.
    if (window.BotApp) BotApp.onChange((st) => { if (st.lang !== lang) { lang = st.lang; applyI18n(); } });

    enableSwipeClose(document.getElementById("app"));
    fillIcons();
    applyI18n();
  </script>
</body>
</html>
