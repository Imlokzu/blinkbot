<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pomodoro</title>
<!-- App kit v1: the screen's own look (Material You or Deep UI, any theme
     or skin) and its safe insets. See docs/SCREEN-PLATFORM.md §2.6. -->
<link rel="stylesheet" href="/static/screen/app-kit.css">
<script src="/static/screen/app-kit.js"></script>
<style>
  /* Only what is the timer's own: the progress ring, the steppers and the
     session dots. Everything else is a kit part in the screen's style. */
  [hidden] { display: none !important; }
  .main { display: flex; gap: 10px; }

  /* "Today: n" in the bar — a quiet tonal pill, not a button */
  .today { display: inline-flex; align-items: center; gap: 5px; flex: none; min-height: 26px; padding: 0 10px;
    border-radius: 13px; background: var(--kit-tonal); color: var(--kit-on-tonal); font: 600 11px/1 var(--font); white-space: nowrap; }
  .today b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .today svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- The ring ---- */
  .ring-box { position: relative; display: grid; place-items: center; flex: 1; min-width: 0; min-height: 0; }
  .ring { position: relative; }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .track { stroke: var(--kit-surface-hi); }
  /* No transition on the arc: the Pi animates only transform and opacity,
     and a one-second step on a 25-minute ring is too small to see. */
  .arc { stroke: var(--accent); stroke-linecap: round; }
  .break .arc { stroke: var(--ok); }
  /* Deep UI: the arc is the accent's own gradient, light at the top and
     deep at the bottom (the svg is turned -90deg, so its x axis is up). */
  :root[data-ui="deep"] .arc { stroke: url(#gFocus); }
  :root[data-ui="deep"] .break .arc { stroke: url(#gBreak); }
  .g-focus-a { stop-color: color-mix(in srgb, var(--accent) 80%, #fff); }
  .g-focus-b { stop-color: color-mix(in srgb, var(--accent) 78%, #000); }
  .g-break-a { stop-color: color-mix(in srgb, var(--ok) 80%, #fff); }
  .g-break-b { stop-color: color-mix(in srgb, var(--ok) 78%, #000); }
  .ring-copy { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .ring .kit-display { font-size: 36px; transition: opacity 200ms ease; }
  .phase { color: var(--accent); font: 700 11px/1 var(--font); letter-spacing: 0.08em; text-transform: uppercase; }
  .break .phase { color: var(--ok); }
  .paused .kit-display { opacity: 0.55; }
  /* Four sessions make a set; the dots show where in the set we are */
  .dots { display: flex; justify-content: center; gap: 5px; margin-top: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--kit-surface-hi); }
  .dots i.on { background: var(--accent); }
  .break .dots i.on { background: var(--ok); }

  /* ---- Side column ---- */
  .side { display: flex; flex-direction: column; gap: 6px; width: 118px; flex: none; min-height: 0; }
  .stepper { display: flex; align-items: center; gap: 2px; padding: 4px 3px; border-radius: 14px; }
  .stepper .kit-btn.icon { width: 26px; height: 28px; min-width: 26px; min-height: 28px; background: transparent; color: var(--kit-on-tonal); }
  .stepper .kit-btn.icon svg { width: 16px; height: 16px; }
  .stepper-mid { display: flex; flex: 1; min-width: 0; flex-direction: column; align-items: center; gap: 2px; }
  .stepper-value { font: 700 15px/1 var(--font); font-variant-numeric: tabular-nums; }
  .stepper-value small { margin-left: 2px; font-size: 10px; font-weight: 600; color: var(--muted); }
  .stepper .kit-label { max-width: 100%; overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
  .side .spacer { flex: 1; }
  .side .kit-row { gap: 6px; }
  .side .kit-row .kit-btn { flex: 1; padding: 0; }
  @media (max-height: 200px) {
    .side { gap: 4px; }
    .stepper { padding-block: 1px; }
    .side .kit-btn { min-height: 30px; }
    .dots { display: none; }
  }
</style>
</head>
<body class="kit">
  <main class="kit-app" id="app">
    <header class="kit-bar">
      <span class="kit-title" data-i18n="title"></span>
      <span class="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>
        <span data-i18n="today"></span><b id="count">0</b>
      </span>
    </header>
    <section class="kit-fill main">
      <div class="ring-box" id="ringBox">
        <div class="ring" id="ring">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="gFocus" x1="1" y1="0" x2="0" y2="0"><stop offset="0" class="g-focus-a"/><stop offset="1" class="g-focus-b"/></linearGradient>
              <linearGradient id="gBreak" x1="1" y1="0" x2="0" y2="0"><stop offset="0" class="g-break-a"/><stop offset="1" class="g-break-b"/></linearGradient>
            </defs>
            <circle class="track" cx="50" cy="50" r="44"/><circle class="arc" id="arc" cx="50" cy="50" r="44"/>
          </svg>
          <div class="ring-copy">
            <div class="phase" id="phase"></div>
            <div class="kit-display" id="time">25:00</div>
            <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
          </div>
        </div>
      </div>
      <aside class="side">
        <div class="kit-card stepper">
          <button class="kit-btn icon" type="button" data-step="focus:-5" data-i18n-aria="less"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
          <span class="stepper-mid"><span class="stepper-value"><span id="focusMin"></span><small data-i18n="min"></small></span><span class="kit-label" data-i18n="focus"></span></span>
          <button class="kit-btn icon" type="button" data-step="focus:5" data-i18n-aria="more"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
        </div>
        <div class="kit-card stepper">
          <button class="kit-btn icon" type="button" data-step="break:-1" data-i18n-aria="less"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
          <span class="stepper-mid"><span class="stepper-value"><span id="breakMin"></span><small data-i18n="min"></small></span><span class="kit-label" data-i18n="break"></span></span>
          <button class="kit-btn icon" type="button" data-step="break:1" data-i18n-aria="more"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
        </div>
        <span class="spacer"></span>
        <button class="kit-btn primary block" id="toggle" type="button"></button>
        <div class="kit-row">
          <button class="kit-btn tonal" id="reset" type="button" data-i18n-aria="reset">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.8-3L3 11m0 0V6m0 5h5M4 13a8 8 0 0 0 14.8 3L21 13m0 0v5m0-5h-5"/></svg>
          </button>
          <button class="kit-btn tonal" id="skip" type="button" data-i18n-aria="skip">
            <svg viewBox="0 0 24 24"><path d="M6.5 5.5v13L15.8 12z"/><path d="M17.5 5.5v13"/></svg>
          </button>
        </div>
      </aside>
    </section>
  </main>
<script>
  const APP_ID = "pomodoro";
  const STR = {
    uk: {
      title: "Помодоро", today: "Сьогодні", focus: "Фокус", break: "Перерва", start: "Старт", pause: "Пауза", resume: "Далі",
      reset: "Скинути", skip: "Пропустити етап", less: "Менше", more: "Більше", min: "хв",
    },
    en: {
      title: "Pomodoro", today: "Today", focus: "Focus", break: "Break", start: "Start", pause: "Pause", resume: "Resume",
      reset: "Reset", skip: "Skip phase", less: "Less", more: "More", min: "min",
    },
  };
  // Stroke icons for the main button (the kit styles any svg in .kit-btn)
  const ICONS = {
    play: '<path d="M8 5.4v13.2L19.2 12z"/>',
    pause: '<path d="M8.6 5.5v13M15.4 5.5v13"/>',
  };

  // Storage throws inside a sandboxed iframe (a shared package runs with an
  // opaque origin), so every access is guarded and the timer keeps its state
  // in memory instead of failing.
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(APP_ID + "." + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
  }

  // The kit already knows the screen's language (botScreenLang)
  let lang = window.BotApp ? BotApp.lang : "uk";
  function t(key, vars) {
    let text = STR[lang][key] ?? STR.uk[key] ?? key;
    if (vars) text = text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
    return text;
  }
  function icon(name) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    render(true);
  }
  // "*" on purpose: in a sandbox our origin is "null", and naming a real
  // origin as the target would silently drop the message.
  function post(message) {
    try { window.parent.postMessage(message, "*"); } catch (_) {}
  }

  // Swipe left/right/down closes the app, same gesture as the screen's own
  // layers. Pointer capture keeps the swipe alive when the finger leaves a
  // small element; a native scroll cancels the pointer and is not a swipe.
  function enableSwipeClose(root) {
    let start = null;
    root.addEventListener("pointerdown", (event) => {
      if (start || event.target.closest("input, select, textarea, [data-noswipe]")) return;
      start = { x: event.clientX, y: event.clientY, id: event.pointerId };
      if (!event.target.closest("button")) {
        try { root.setPointerCapture(event.pointerId); } catch (_) {}
      }
    });
    function finish(event) {
      if (!start || start.id !== event.pointerId) return;
      const s = start;
      start = null;
      try { if (root.hasPointerCapture(s.id)) root.releasePointerCapture(s.id); } catch (_) {}
      if (event.type === "pointercancel") return;
      const dx = event.clientX - s.x;
      const dy = event.clientY - s.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
      if (Math.abs(dx) >= Math.abs(dy)) post({ type: "storeAppSwipe", direction: dx < 0 ? "left" : "right" });
      else if (dy > 0) post({ type: "storeAppSwipe", direction: "down" });
    }
    root.addEventListener("pointerup", finish);
    root.addEventListener("pointercancel", finish);
    window.addEventListener("pointerup", finish);
    window.addEventListener("pointercancel", finish);
    root.addEventListener("lostpointercapture", (event) => { if (start && start.id === event.pointerId) start = null; });
  }

  const CIRC = 2 * Math.PI * 44;
  const arc = document.getElementById("arc");
  arc.style.strokeDasharray = CIRC.toFixed(2);

  const settings = Object.assign({ focus: 25, break: 5 }, load("settings", {}));
  settings.focus = clamp(Number(settings.focus) || 25, 15, 50);
  settings.break = clamp(Number(settings.break) || 5, 3, 15);
  // endAt is wall-clock, so the timer survives the app being closed and
  // reopened: the iframe dies with the app, the deadline does not.
  let timer = Object.assign({ phase: "focus", running: false, endAt: 0, remaining: settings.focus * 60000 }, load("timer", {}));
  if (timer.phase !== "break") timer.phase = "focus";
  if (!(timer.remaining > 0)) timer.remaining = duration(timer.phase);
  let tickId = 0, audio = null, lastShown = "";

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function todayKey() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function todayCount() { const s = load("today", null); return s && s.day === todayKey() ? s.count : 0; }
  function addSession() { save("today", { day: todayKey(), count: todayCount() + 1 }); }
  function duration(phase) { return settings[phase] * 60000; }
  function remaining() { return timer.running ? Math.max(0, timer.endAt - Date.now()) : timer.remaining; }
  function persist() { save("timer", timer); }

  // Short and quiet on purpose: this is a nudge on a desk, not an alarm.
  function beep() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audio.currentTime;
      [[660, 0], [880, 0.22]].forEach(([freq, at]) => {
        const osc = audio.createOscillator(), gain = audio.createGain();
        osc.type = "sine"; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t0 + at);
        gain.gain.exponentialRampToValueAtTime(0.06, t0 + at + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.18);
        osc.connect(gain).connect(audio.destination);
        osc.start(t0 + at); osc.stop(t0 + at + 0.2);
      });
    } catch (_) {}
  }

  function finishPhase(silent) {
    if (!silent) beep();
    if (timer.phase === "focus") {
      addSession();
      // Focus rolls straight into the break; the next focus waits for a
      // tap, so a missed break never silently eats a work session.
      timer = { phase: "break", running: !silent, endAt: Date.now() + duration("break"), remaining: duration("break") };
    } else {
      timer = { phase: "focus", running: false, endAt: 0, remaining: duration("focus") };
    }
    persist();
    syncTick();
    render(true);
  }

  function syncTick() {
    clearInterval(tickId);
    tickId = timer.running ? setInterval(tick, 250) : 0;
  }
  function tick() {
    if (remaining() <= 0) return finishPhase(false);
    render(false);
  }

  function render(jump) {
    const left = remaining();
    const secs = Math.ceil(left / 1000);
    const shown = String(Math.floor(secs / 60)).padStart(2, "0") + ":" + String(secs % 60).padStart(2, "0");
    if (shown !== lastShown || jump) {
      lastShown = shown;
      document.getElementById("time").textContent = shown;
      const frac = 1 - left / duration(timer.phase);
      arc.style.strokeDashoffset = (CIRC * (1 - clamp(frac, 0, 1))).toFixed(2);
    }
    if (!jump) return;
    const ring = document.getElementById("ring");
    ring.classList.toggle("break", timer.phase === "break");
    ring.classList.toggle("paused", !timer.running && left < duration(timer.phase));
    document.getElementById("phase").textContent = t(timer.phase);
    document.getElementById("focusMin").textContent = settings.focus;
    document.getElementById("breakMin").textContent = settings.break;
    const count = todayCount();
    document.getElementById("count").textContent = count;
    document.querySelectorAll("#dots i").forEach((dot, i) => dot.classList.toggle("on", i < count % 4 || (count > 0 && count % 4 === 0)));
    const toggle = document.getElementById("toggle");
    const label = timer.running ? "pause" : left < duration(timer.phase) ? "resume" : "start";
    toggle.innerHTML = icon(timer.running ? "pause" : "play") + "<span></span>";
    toggle.lastChild.textContent = t(label);
  }

  // The ring takes the largest square the box allows
  function layout() {
    const box = document.getElementById("ringBox");
    const size = Math.max(100, Math.floor(Math.min(box.clientWidth, box.clientHeight)));
    const ring = document.getElementById("ring");
    ring.style.width = ring.style.height = size + "px";
    document.getElementById("time").style.fontSize = Math.round(size * 0.22) + "px";
  }

  document.getElementById("toggle").addEventListener("click", () => {
    // Created on a tap: browsers only let audio start from a gesture.
    try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (_) {}
    if (timer.running) timer = { ...timer, running: false, remaining: remaining() };
    else timer = { ...timer, running: true, endAt: Date.now() + timer.remaining };
    persist(); syncTick(); render(true);
  });
  document.getElementById("reset").addEventListener("click", () => {
    timer = { phase: "focus", running: false, endAt: 0, remaining: duration("focus") };
    persist(); syncTick(); render(true);
  });
  document.getElementById("skip").addEventListener("click", () => {
    const next = timer.phase === "focus" ? "break" : "focus";
    timer = { phase: next, running: false, endAt: 0, remaining: duration(next) };
    persist(); syncTick(); render(true);
  });
  document.querySelector(".side").addEventListener("click", (event) => {
    const b = event.target.closest("[data-step]");
    if (!b) return;
    const [key, delta] = b.dataset.step.split(":");
    const old = settings[key];
    settings[key] = key === "focus" ? clamp(settings[key] + Number(delta), 15, 50) : clamp(settings[key] + Number(delta), 3, 15);
    save("settings", settings);
    // A phase that has not started yet takes the new length at once.
    if (!timer.running && timer.phase === key && timer.remaining === old * 60000) timer.remaining = duration(key);
    persist(); render(true);
  });
  window.addEventListener("resize", layout);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) tick(); });

  enableSwipeClose(document.getElementById("app"));
  layout();
  if (timer.running && timer.endAt <= Date.now()) finishPhase(true);
  applyI18n();
  syncTick();

  // The screen's style, theme and skin are applied by the kit (the ring
  // takes its colours from its tokens in CSS); the timer only follows the
  // language.
  if (window.BotApp) BotApp.onChange((s) => { if (s.lang !== lang) { lang = s.lang; applyI18n(); } });
</script>
</body>
</html>
