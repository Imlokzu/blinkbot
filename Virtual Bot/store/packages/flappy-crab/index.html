<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Crab</title>
<!-- App kit v1: the screen's own look (Material You or Deep UI, any theme
     or skin) and its safe insets. See docs/SCREEN-PLATFORM.md §2.6. -->
<link rel="stylesheet" href="/static/screen/app-kit.css">
<script src="/static/screen/app-kit.js"></script>
<style>
  /* The game world is a canvas under the whole panel; the words on top of
     it (name, best, score, the game-over card, the start button) are kit
     parts, so they read like the rest of the screen. */
  [hidden] { display: none !important; }
  #cv { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  .hud { position: relative; touch-action: none; }

  /* Parts that come and go fade and slide; only opacity and transform move */
  .fade { transition: opacity 180ms ease, transform 180ms ease; }
  .fade.off { opacity: 0; transform: translateY(-6px); pointer-events: none; }
  footer.fade.off { transform: translateY(6px); }

  .best-pill { display: inline-flex; align-items: center; gap: 5px; flex: none; min-height: 26px; padding: 0 10px;
    border-radius: 13px; background: var(--kit-tonal); color: var(--kit-on-tonal); font: 600 11px/1 var(--font); white-space: nowrap; }
  .best-pill svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* The live score while flying: big, centred, no card behind it */
  .live { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 700; }
  :root[data-ui="material"] .live { font-weight: 600; }

  /* Game over */
  .over { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 150px; padding: 12px 18px 14px; text-align: center; }
  .over .kit-title { flex: none; font-size: 20px; }
  .over .kit-display { margin: 2px 0 4px; }
  .new-best { display: inline-flex; align-items: center; min-height: 22px; padding: 0 10px; border-radius: 11px;
    background: var(--kit-primary); color: var(--kit-on-accent); font: 700 11px/1 var(--font); }
  :root[data-ui="material"] .new-best { background: var(--kit-tonal); color: var(--kit-on-tonal); }
  @media (max-height: 200px) { .over .kit-display { font-size: 36px; } .live { font-size: 32px; } }
</style>
</head>
<body class="kit">
  <canvas id="cv"></canvas>
  <main class="kit-app hud" id="stage">
    <header class="kit-bar fade" id="bar">
      <span class="kit-title" data-i18n="title"></span>
      <span class="best-pill" id="bestPill" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8.5 20h7"/></svg>
        <span id="bestText"></span>
      </span>
    </header>
    <div class="kit-display live fade off" id="live" aria-live="polite">0</div>
    <section class="kit-fill kit-center">
      <div class="kit-card hi over fade off" id="over">
        <span class="kit-title" data-i18n="over"></span>
        <div class="kit-display" id="overScore">0</div>
        <span class="new-best" id="overNew" data-i18n="newBest" hidden></span>
        <span class="kit-label" id="overBest"></span>
      </div>
    </section>
    <footer class="kit-row center fade" id="foot">
      <button class="kit-btn primary big" id="go" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/></svg>
        <span id="goText"></span>
      </button>
    </footer>
  </main>
<script>
  const APP_ID = "flappy-crab";
  const STR = {
    uk: {
      title: "Крабик", close: "Закрити", tapToFly: "Тап, щоб злетіти", best: "Рекорд: {n}",
      over: "Бульк!", score: "Рахунок: {n}", newBest: "Новий рекорд!", again: "Тап, щоб ще раз",
    },
    en: {
      title: "Flappy Crab", close: "Close", tapToFly: "Tap to fly", best: "Best: {n}",
      over: "Splash!", score: "Score: {n}", newBest: "New best!", again: "Tap to try again",
    },
  };

  // Storage throws inside a sandboxed iframe (a shared package runs with an
  // opaque origin), so every access is guarded and the game keeps its state
  // in memory instead of failing.
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(APP_ID + "." + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
  }

  // The kit already knows the screen's language (botScreenLang)
  let lang = window.BotApp ? BotApp.lang : "uk";
  function t(key, vars) {
    let text = STR[lang][key] ?? STR.uk[key] ?? key;
    if (vars) text = text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
    return text;
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    hud();
  }

  const $ = (id) => document.getElementById(id);
  const cv = $("cv");
  const ctx = cv.getContext("2d");

  // The crab, 13x9, drawn with fillRect so it stays pixel-crisp on the
  // Pi's panel. 1 = shell, 2 = eye, 3 = claw. Two frames: claws up after
  // a flap, claws down while falling.
  const CRAB_UP = [
    "3...........3",
    "33.........33",
    ".3..2...2..3.",
    ".3..1...1..3.",
    "..111111111..",
    ".11111111111.",
    ".11111111111.",
    "..1.1...1.1..",
    ".1..1...1..1.",
  ];
  const CRAB_DOWN = [
    ".............",
    "....2...2....",
    "....1...1....",
    "..111111111..",
    "33111111111.3",
    "3.111111111.3",
    "33.1.1.1.1.33",
    "..1..1.1..1..",
    ".1.........1.",
  ];

  let W = 320, H = 240, S = 1;        // S scales the 240px-high reference world
  let state = "ready";               // ready | playing | dead
  let crab = { y: 0, home: 0, vy: 0, flapT: 0 };
  let pipes = [], bubbles = [], groundX = 0, score = 0, best = load("best", 0), newBest = false;
  let deadAt = 0, last = 0, rafId = 0, spawnIn = 0, shownScore = -1;
  let colors = {};

  const G = 900, FLAP = -270, SPEED = 88, GAP = 76, PIPE_W = 32, SPACING = 150, GROUND = 18;
  const CRAB_X = () => W * 0.28;

  // Every colour of the world comes from the kit's tokens. A probe element
  // resolves var() and color-mix() to a plain colour the canvas accepts.
  const probe = document.createElement("i");
  probe.style.display = "none";
  document.body.appendChild(probe);
  function tokenColor(expr) {
    probe.style.color = "";
    probe.style.color = expr;
    const c = getComputedStyle(probe).color;
    // color-mix() computes to "color(srgb r g b / a)"; an older canvas may
    // not parse that, so it is turned into plain rgba().
    const m = /^color\(srgb ([\d.e-]+) ([\d.e-]+) ([\d.e-]+)(?: \/ ([\d.e-]+))?\)$/.exec(c);
    if (!m) return c;
    const ch = (v) => Math.round(Math.min(1, Math.max(0, Number(v))) * 255);
    return "rgba(" + ch(m[1]) + "," + ch(m[2]) + "," + ch(m[3]) + "," + (m[4] == null ? 1 : Number(m[4])) + ")";
  }
  function vertical(top, bottom) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, top);
    g.addColorStop(1, bottom);
    return g;
  }
  function readColors() {
    const deep = document.documentElement.dataset.ui === "deep";
    // The water is the screen's background with a wash of the accent at the
    // surface; in Deep UI the wash is stronger. One hue, light over deep.
    const waterTop = tokenColor("color-mix(in srgb, var(--accent) " + (deep ? 22 : 9) + "%, var(--bg))");
    colors = {
      water: vertical(waterTop, tokenColor("var(--bg)")),
      bubble: tokenColor("color-mix(in srgb, var(--text) 16%, transparent)"),
      // Coral: tonal steps of the accent, the crab in the accent itself
      pipe: deep
        ? vertical(tokenColor("color-mix(in srgb, var(--accent) 46%, var(--bg))"), tokenColor("color-mix(in srgb, var(--accent) 22%, var(--bg))"))
        : tokenColor("color-mix(in srgb, var(--accent) 32%, var(--panel))"),
      lip: tokenColor(deep ? "color-mix(in srgb, var(--accent) 62%, var(--bg))" : "color-mix(in srgb, var(--accent) 52%, var(--panel))"),
      sand: tokenColor("var(--kit-surface-hi)"),
      line: tokenColor("color-mix(in srgb, var(--text) 14%, transparent)"),
      shell: tokenColor("var(--accent)"),
      claw: tokenColor("color-mix(in srgb, var(--accent) 72%, #000)"),
      eye: tokenColor("color-mix(in srgb, var(--accent) 12%, #000)"),
    };
  }

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    S = H / 240;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    readColors();   // the gradients span the new height
    // The first resize can come before layout (0x0), so a waiting crab
    // is re-homed whenever the real height arrives.
    if (state === "ready" && !pipes.length) crab.home = crab.y = H * 0.45;
    if (state !== "playing") draw();
  }

  function reset() {
    crab = { y: H * 0.45, home: H * 0.45, vy: 0, flapT: 0 };
    pipes = []; score = 0; newBest = false; spawnIn = 0.6;
    if (!bubbles.length) for (let i = 0; i < 7; i++) bubbles.push({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2, v: 8 + Math.random() * 14 });
  }

  function flap() {
    if (state === "dead") {
      // A short lock so the tap that killed the crab does not restart.
      if (performance.now() - deadAt < 500) return;
      reset(); state = "ready";
    }
    if (state === "ready") { state = "playing"; last = performance.now(); hud(); loop(); }
    crab.vy = FLAP * S;
    crab.flapT = 0.16;
  }

  function spawnPipe() {
    const margin = 26 * S;
    const gap = GAP * S;
    const top = margin + Math.random() * (H - GROUND * S - gap - margin * 2);
    pipes.push({ x: W + 4, top, gap, passed: false });
  }

  function update(dt) {
    crab.vy += G * S * dt;
    crab.y += crab.vy * dt;
    crab.flapT = Math.max(0, crab.flapT - dt);
    const speed = SPEED * S * (1 + Math.min(score, 30) * 0.01);
    groundX = (groundX + speed * dt) % (12 * S);
    spawnIn -= dt;
    if (spawnIn <= 0) { spawnPipe(); spawnIn = (SPACING * S) / speed; }
    pipes.forEach((p) => { p.x -= speed * dt; });
    pipes = pipes.filter((p) => p.x > -PIPE_W * S - 4);
    bubbles.forEach((b) => { b.y -= b.v * S * dt; if (b.y < -4) { b.y = H + 4; b.x = Math.random() * W; } });

    const px = 2 * S, cw = 13 * px, ch = 9 * px;
    const cx = CRAB_X() - cw / 2, cy = crab.y - ch / 2;
    // Hitbox a little smaller than the sprite: clipping a claw tip by
    // one pixel feels unfair.
    const hx = cx + px, hy = cy + px, hw = cw - 2 * px, hh = ch - 2 * px;
    if (cy + ch >= H - GROUND * S) return die();
    if (cy < -ch) crab.y = -ch / 2;
    for (const p of pipes) {
      const pw = PIPE_W * S;
      if (hx + hw > p.x && hx < p.x + pw && (hy < p.top || hy + hh > p.top + p.gap)) return die();
      if (!p.passed && p.x + pw < hx) {
        p.passed = true; score += 1;
        if (score > best) { best = score; newBest = true; save("best", best); }
      }
    }
    if (score !== shownScore) { shownScore = score; $("live").textContent = String(score); }
  }

  function die() { state = "dead"; deadAt = performance.now(); draw(); hud(); }

  function drawCrab() {
    const px = Math.max(1, Math.round(2 * S));
    const sprite = crab.flapT > 0 || state === "ready" && Math.floor(performance.now() / 400) % 2 ? CRAB_UP : CRAB_DOWN;
    const x0 = Math.round(CRAB_X() - 13 * px / 2), y0 = Math.round(crab.y - 9 * px / 2);
    for (let y = 0; y < 9; y++) for (let x = 0; x < 13; x++) {
      const ch = sprite[y][x];
      if (ch === ".") continue;
      ctx.fillStyle = ch === "1" ? colors.shell : ch === "2" ? colors.eye : colors.claw;
      ctx.fillRect(x0 + x * px, y0 + y * px, px, px);
    }
  }

  function rounded(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    ctx.fill();
  }

  function draw() {
    ctx.fillStyle = colors.water;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = colors.bubble;
    bubbles.forEach((b) => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r * S, 0, Math.PI * 2); ctx.fill(); });
    // Coral columns with a rounded cap at the gap, like a soft Material shape
    const pw = PIPE_W * S, lip = 7 * S, r = 6 * S;
    pipes.forEach((p) => {
      ctx.fillStyle = colors.pipe;
      ctx.fillRect(p.x, 0, pw, p.top - r);
      ctx.fillRect(p.x, p.top + p.gap + r, pw, H - p.top - p.gap - r);
      ctx.fillStyle = colors.lip;
      rounded(p.x - 2 * S, p.top - lip - r, pw + 4 * S, lip + r, r);
      rounded(p.x - 2 * S, p.top + p.gap, pw + 4 * S, lip + r, r);
    });
    const gy = H - GROUND * S;
    ctx.fillStyle = colors.sand;
    ctx.fillRect(0, gy, W, GROUND * S);
    ctx.fillStyle = colors.line;
    ctx.fillRect(0, gy, W, Math.max(1, S));
    for (let x = -groundX; x < W; x += 12 * S) ctx.fillRect(x, gy + 7 * S, 5 * S, Math.max(1, S));
    drawCrab();
  }

  // The words over the world: which parts show depends on the state
  function hud() {
    const playing = state === "playing", dead = state === "dead";
    $("bar").classList.toggle("off", playing);
    $("foot").classList.toggle("off", playing);
    $("live").classList.toggle("off", !playing);
    $("over").classList.toggle("off", !dead);
    $("bestPill").hidden = !best;
    $("bestText").textContent = t("best", { n: best });
    $("goText").textContent = t(dead ? "again" : "tapToFly");
    $("live").textContent = String(score);
    shownScore = score;
    $("overScore").textContent = String(score);
    $("overScore").setAttribute("aria-label", t("score", { n: score }));
    $("overNew").hidden = !newBest;
    $("overBest").textContent = newBest ? t("score", { n: score }) : t("best", { n: best });
    $("overBest").hidden = newBest;
  }

  function loop() {
    if (rafId) return;
    const tick = (now) => {
      rafId = 0;
      if (document.hidden) return;
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (state === "playing") update(dt);
      else if (state === "ready") crab.y = crab.home + Math.sin(now / 320) * 4 * S;
      draw();
      // Ready screen keeps a slow idle animation (bobbing crab); dead
      // screen is static, so the loop stops there to spare the CPU.
      if (state === "playing" || state === "ready") rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
  }

  // A tap anywhere flaps, the start button included; the button's own
  // click only matters for a keyboard press (detail 0), or it would flap twice.
  document.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    flap();
  });
  $("go").addEventListener("click", (event) => { if (event.detail === 0) flap(); });
  document.addEventListener("keydown", (event) => {
    if (event.key === " " || event.key === "ArrowUp") { event.preventDefault(); flap(); }
  });
  // Pausing a flappy game mid-air is a death sentence, so hiding the app
  // just freezes the frame and resumes from "ready" at the same height.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === "playing") { state = "ready"; crab.vy = 0; crab.home = crab.y; hud(); }
    if (!document.hidden) { last = performance.now(); loop(); }
  });
  window.addEventListener("resize", resize);

  resize();
  reset();
  applyI18n();
  last = performance.now();
  loop();

  // The kit applies the screen's style, theme and skin to the page; the
  // canvas re-reads its colours from the new tokens, and the language is
  // followed.
  if (window.BotApp) BotApp.onChange((s) => {
    readColors();
    if (state !== "playing") draw();
    if (s.lang !== lang) { lang = s.lang; applyI18n(); }
  });
</script>
</body>
</html>
