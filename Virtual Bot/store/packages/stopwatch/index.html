<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stopwatch</title>
<!-- App kit v1: the screen's own look (Material You or Deep UI, any theme
     or skin) and its safe insets. See docs/SCREEN-PLATFORM.md §2.6. -->
<link rel="stylesheet" href="/static/screen/app-kit.css">
<script src="/static/screen/app-kit.js"></script>
<style>
  /* Only what is the clock's own: the digits, the laps list, the timer
     ring and its steppers. Buttons, chips, cards and colours are kit parts. */
  [hidden] { display: none !important; }
  .kit-bar .kit-segment { flex: 0 1 184px; }
  /* A segment's idle options sit flat on the track, as on Android */
  .kit-segment .kit-chip:not(.on) { background: transparent; color: var(--muted); }
  .view { display: flex; gap: 10px; }

  /* ---- stopwatch: digits + controls, and a laps column once started ---- */
  .sw-main { flex: 1; min-width: 0; gap: 6px; }
  .digits { white-space: nowrap; font-size: 60px; }
  .digits small { font-size: 0.42em; font-weight: 400; margin-left: 1px; }
  .view.split .digits { font-size: 42px; }
  .view.split .digits.long { font-size: 32px; }
  .digits.long { font-size: 46px; }
  .status { text-transform: uppercase; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
  .controls { gap: 12px; margin-top: 8px; }
  .view.split .controls { gap: 8px; }
  .view.split .kit-btn.side { width: 40px; height: 40px; }
  /* Pixel Clock: the primary is a circle at rest and a rounded square while
     it runs; the change is instant (radius never animates on the Pi). */
  .kit-btn.play { width: 58px; height: 58px; }
  .kit-btn.play.running { border-radius: 20px; }
  .kit-btn.play svg { width: 26px; height: 26px; }
  .kit-btn.play svg.fill { fill: currentColor; stroke: none; }
  .kit-btn.side { width: 42px; height: 42px; transition: transform 110ms ease, opacity 160ms ease; }
  .kit-btn.side.gone { opacity: 0; pointer-events: none; }

  .laps { width: 128px; flex: none; display: flex; flex-direction: column; gap: 2px; padding: 0; }
  .lap { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 3px 10px; border-radius: 8px;
    background: var(--kit-surface); font-variant-numeric: tabular-nums; flex: none; }
  .lap:first-child { border-top-left-radius: 14px; border-top-right-radius: 14px; }
  .lap:last-child { border-bottom-left-radius: 14px; border-bottom-right-radius: 14px; }
  .lap-n { width: 18px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .lap-t { flex: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .lap-t b { font-size: 13px; font-weight: 600; }
  .lap-t span { color: var(--muted); font-size: 10px; }
  .lap.best .lap-t b { color: var(--ok); }
  .lap.worst .lap-t b { color: var(--accent); }
  .laps-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; border-radius: 16px; background: var(--kit-surface); color: var(--muted); font-size: 11px; text-align: center; }
  .laps-empty svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0.7; }

  /* ---- timer: a progress ring with the time inside, setup on the right ---- */
  .ring-box { position: relative; flex: 1; min-width: 0; display: grid; place-items: center; }
  .ring { width: 100%; height: 100%; max-width: 164px; max-height: 164px; aspect-ratio: 1; }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: var(--kit-surface-hi); }
  .ring .arc { stroke: var(--accent); stroke-linecap: round; }
  .ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .ring-in .kit-display { font-size: 38px; white-space: nowrap; }
  .ring-in .kit-display.long { font-size: 29px; }
  .ring-box.done .kit-display { color: var(--accent); animation: ring 1s ease-in-out infinite; }
  .ring-box.done .kit-label { color: var(--accent); font-weight: 700; }
  @keyframes ring { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .setup { width: 128px; flex: none; display: flex; flex-direction: column; gap: 6px; }
  .steppers { display: flex; flex-direction: column; gap: 6px; padding: 2px 4px; }
  .stepper { display: flex; align-items: center; gap: 6px; min-height: 26px; }
  .stepper .kit-btn { width: 26px; height: 26px; min-width: 26px; min-height: 26px; background: var(--kit-surface-hi); }
  .stepper .kit-btn svg { width: 15px; height: 15px; }
  .stepper-mid { flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: center; gap: 3px; }
  .stepper-value { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stepper-label { color: var(--muted); font-size: 10px; font-weight: 500; }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .presets .kit-chip { min-height: 26px; padding: 0; font-size: 12px; font-variant-numeric: tabular-nums; }
  .presets .kit-chip:disabled, .stepper .kit-btn:disabled { opacity: 0.4; }
  .presets .reset { display: grid; place-items: center; }
  .presets .reset svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .setup .kit-btn.primary { margin-top: auto; min-height: 36px; border-radius: 18px; font-size: 14px; }
  .setup .kit-btn.primary svg.fill { fill: currentColor; stroke: none; }

  @media (max-height: 200px) {
    .digits { font-size: 44px; } .view.split .digits { font-size: 32px; }
    .kit-btn.play { width: 46px; height: 46px; } .kit-btn.side { width: 36px; height: 36px; }
    .presets { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
</style>
</head>
<body class="kit">
  <main class="kit-app" id="app">
    <header class="kit-bar">
      <span class="kit-title" data-i18n="title"></span>
      <div class="kit-segment" id="tabs">
        <button class="kit-chip" type="button" data-tab="sw" data-i18n="tabSw"></button>
        <button class="kit-chip" type="button" data-tab="timer" data-i18n="tabTimer"></button>
      </div>
    </header>

    <section class="kit-fill view" id="viewSw">
      <div class="kit-center sw-main">
        <div class="kit-display digits" id="swTime">00:00<small>.00</small></div>
        <div class="kit-label status" id="swSub"></div>
        <div class="kit-row center controls">
          <button class="kit-btn icon tonal side" id="swReset" type="button" data-i18n-aria="reset">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
          </button>
          <button class="kit-btn icon primary play" id="swPrimary" type="button"></button>
          <button class="kit-btn icon tonal side" id="swLap" type="button" data-i18n-aria="lap">
            <svg viewBox="0 0 24 24"><path d="M6 20.5V4M6 4.5h11l-2.2 4 2.2 4H6"/></svg>
          </button>
        </div>
      </div>
      <div class="laps kit-scroll" id="laps" data-noswipe hidden></div>
    </section>

    <section class="kit-fill view" id="viewTimer" hidden>
      <div class="ring-box" id="tDisplay">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="45"/>
          <circle class="arc" id="tArc" cx="50" cy="50" r="45" transform="rotate(-90 50 50)"/>
        </svg>
        <div class="ring-in">
          <div class="kit-display" id="tTime">05:00</div>
          <div class="kit-label" id="tSub"></div>
        </div>
      </div>
      <aside class="setup">
        <div class="kit-card steppers">
          <div class="stepper">
            <button class="kit-btn icon" type="button" data-adj="-60" data-i18n-aria="minLess"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
            <span class="stepper-mid"><span class="stepper-value" id="tMin">5</span><span class="stepper-label" data-i18n="min"></span></span>
            <button class="kit-btn icon" type="button" data-adj="60" data-i18n-aria="minMore"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
          </div>
          <div class="stepper">
            <button class="kit-btn icon" type="button" data-adj="-15" data-i18n-aria="secLess"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
            <span class="stepper-mid"><span class="stepper-value" id="tSec">00</span><span class="stepper-label" data-i18n="sec"></span></span>
            <button class="kit-btn icon" type="button" data-adj="15" data-i18n-aria="secMore"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
          </div>
        </div>
        <div class="presets" id="presets"></div>
        <button class="kit-btn primary block" id="tPrimary" type="button"></button>
      </aside>
    </section>
  </main>
<script>
  const APP_ID = "stopwatch";
  const STR = {
    uk: {
      title: "Час", tabSw: "Секундомір", tabTimer: "Таймер", start: "Старт", pause: "Пауза", resume: "Далі",
      lap: "Коло", reset: "Скинути", noLaps: "Кола з'являться тут", laps: "Кіл: {n}", ready: "Готовий",
      running: "Йде", paused: "Пауза", min: "хв", sec: "сек", minLess: "Мінус хвилина", minMore: "Плюс хвилина",
      secLess: "Мінус 15 секунд", secMore: "Плюс 15 секунд", timesUp: "Час вийшов", of: "з {t}", stop: "Стоп",
    },
    en: {
      title: "Time", tabSw: "Stopwatch", tabTimer: "Timer", start: "Start", pause: "Pause", resume: "Resume",
      lap: "Lap", reset: "Reset", noLaps: "Laps show up here", laps: "Laps: {n}", ready: "Ready",
      running: "Running", paused: "Paused", min: "min", sec: "sec", minLess: "Minus a minute", minMore: "Plus a minute",
      secLess: "Minus 15 seconds", secMore: "Plus 15 seconds", timesUp: "Time's up", of: "of {t}", stop: "Stop",
    },
  };
  // Filled glyphs read better than outlines at the primary's size
  const ICONS = {
    play: '<svg class="fill" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l10.6-6.8a1 1 0 0 0 0-1.72L9.5 4.34A1 1 0 0 0 8 5.2z"/></svg>',
    pause: '<svg class="fill" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.4"/><rect x="13.5" y="5" width="4" height="14" rx="1.4"/></svg>',
    stop: '<svg class="fill" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>',
    reset: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>',
    flag: '<svg viewBox="0 0 24 24"><path d="M6 20.5V4M6 4.5h11l-2.2 4 2.2 4H6"/></svg>',
  };

  /* ---- storage, language, parent messages ---- */

  // Storage throws inside a sandboxed iframe (a shared package runs with an
  // opaque origin), so every access is guarded and the app keeps its state
  // in memory instead of failing.
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(APP_ID + "." + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
  }
  // The kit already knows the screen's language (botScreenLang)
  let lang = window.BotApp ? BotApp.lang : "uk";
  function t(key, vars) {
    let text = STR[lang][key];
    if (text == null) text = STR.uk[key];
    if (text == null) return key;
    if (vars) text = text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
    return text;
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    renderTabs();
  }
  // "*" on purpose: in a sandbox our origin is "null", and naming a real
  // origin as the target would silently drop the message.
  function post(message) {
    try { window.parent.postMessage(message, "*"); } catch (_) {}
  }
  // A swipe left/right/down across the app also means "back", as the
  // screen's own layers do (storeAppSwipe). Pointer capture keeps the swipe
  // alive when the finger leaves a small element; a native scroll (the laps
  // list) cancels the pointer and is not a swipe.
  function enableSwipeClose(root) {
    let start = null;
    root.addEventListener("pointerdown", (event) => {
      if (start || event.target.closest("input, select, textarea, [data-noswipe]")) return;
      start = { x: event.clientX, y: event.clientY, id: event.pointerId };
      if (!event.target.closest("button")) {
        try { root.setPointerCapture(event.pointerId); } catch (_) {}
      }
    });
    function finish(event) {
      if (!start || start.id !== event.pointerId) return;
      const s = start;
      start = null;
      try { if (root.hasPointerCapture(s.id)) root.releasePointerCapture(s.id); } catch (_) {}
      if (event.type === "pointercancel") return;
      const dx = event.clientX - s.x, dy = event.clientY - s.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
      if (Math.abs(dx) >= Math.abs(dy)) post({ type: "storeAppSwipe", direction: dx < 0 ? "left" : "right" });
      else if (dy > 0) post({ type: "storeAppSwipe", direction: "down" });
    }
    root.addEventListener("pointerup", finish);
    root.addEventListener("pointercancel", finish);
    window.addEventListener("pointerup", finish);
    window.addEventListener("pointercancel", finish);
    root.addEventListener("lostpointercapture", (event) => { if (start && start.id === event.pointerId) start = null; });
  }

  /* ---- state ---- */

  const $ = (id) => document.getElementById(id);
  const PRESETS = [1, 3, 5, 10, 15];
  let tab = load("tab", "sw") === "timer" ? "timer" : "sw";
  // Both clocks keep wall-clock anchors, so closing the app does not stop
  // them: reopening shows the real elapsed time.
  let sw = Object.assign({ running: false, startAt: 0, acc: 0, laps: [] }, load("sw", {}));
  let tm = Object.assign({ total: 300, running: false, endAt: 0, remaining: 300000, done: false }, load("timer", {}));
  if (!Array.isArray(sw.laps)) sw.laps = [];
  let rafId = 0, tickId = 0, audio = null;

  const pad = (n, w) => String(n).padStart(w || 2, "0");
  function fmtSw(ms) {
    const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000) % 60, h = Math.floor(ms / 3600000);
    return { main: (h ? h + ":" + pad(m) : pad(m)) + ":" + pad(s), frac: "." + pad(cs), long: h > 0 };
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
    return (h ? h + ":" + pad(m) : pad(m)) + ":" + pad(s);
  }
  function swElapsed() { return sw.acc + (sw.running ? Date.now() - sw.startAt : 0); }
  function tmLeft() { return tm.running ? Math.max(0, tm.endAt - Date.now()) : tm.remaining; }

  /* ---- stopwatch ---- */

  const swTime = $("swTime");
  function renderSwTime() {
    const f = fmtSw(swElapsed());
    swTime.innerHTML = f.main + "<small>" + f.frac + "</small>";
    swTime.classList.toggle("long", f.long);
  }
  function swLoop() {
    rafId = 0;
    if (!sw.running || document.hidden || tab !== "sw") return;
    renderSwTime();
    rafId = requestAnimationFrame(swLoop);
  }
  function renderSw() {
    const elapsed = swElapsed();
    renderSwTime();
    $("swSub").textContent = sw.laps.length ? t("laps", { n: sw.laps.length }) : t(sw.running ? "running" : elapsed ? "paused" : "ready");
    const primary = $("swPrimary");
    primary.innerHTML = ICONS[sw.running ? "pause" : "play"];
    primary.classList.toggle("running", sw.running);
    primary.setAttribute("aria-label", t(sw.running ? "pause" : elapsed ? "resume" : "start"));
    // Both side buttons stay once the watch has started, so the primary
    // stays centred; reset works only while stopped, lap only while running.
    const fresh = !sw.running && !elapsed;
    $("swReset").classList.toggle("gone", fresh);
    $("swReset").disabled = sw.running;
    $("swLap").classList.toggle("gone", fresh);
    $("swLap").disabled = !sw.running || sw.laps.length >= 99;
    // The laps column shows up once the watch has been started
    const laps = $("laps");
    const started = sw.running || elapsed > 0 || sw.laps.length > 0;
    laps.hidden = !started;
    $("viewSw").classList.toggle("split", started);
    if (!sw.laps.length) {
      laps.innerHTML = '<div class="laps-empty">' + ICONS.flag + "<span></span></div>";
      laps.firstChild.lastChild.textContent = t("noLaps");
    } else {
      const splits = sw.laps.map((v, i) => v - (i ? sw.laps[i - 1] : 0));
      const lo = Math.min(...splits), hi = Math.max(...splits);
      laps.innerHTML = splits.map((d, i) => {
        const f = fmtSw(d), total = fmtSw(sw.laps[i]);
        const cls = splits.length > 1 ? (d === lo ? " best" : d === hi ? " worst" : "") : "";
        return '<div class="lap' + cls + '"><span class="lap-n">' + (i + 1) + '</span><span class="lap-t"><b>' +
          f.main + f.frac + "</b><span>" + total.main + total.frac + "</span></span></div>";
      }).reverse().join("");
    }
    if (sw.running && !rafId) rafId = requestAnimationFrame(swLoop);
  }
  $("swPrimary").addEventListener("click", () => {
    if (sw.running) { sw.acc = swElapsed(); sw.running = false; }
    else { sw.startAt = Date.now(); sw.running = true; }
    save("sw", sw); renderSw();
  });
  $("swLap").addEventListener("click", () => {
    if (sw.running && sw.laps.length < 99) { sw.laps.push(swElapsed()); save("sw", sw); renderSw(); $("laps").scrollTop = 0; }
  });
  $("swReset").addEventListener("click", () => {
    if (sw.running) return;
    sw = { running: false, startAt: 0, acc: 0, laps: [] };
    save("sw", sw); renderSw();
  });

  /* ---- timer ---- */

  const ARC = 2 * Math.PI * 45;
  $("tArc").setAttribute("stroke-dasharray", ARC.toFixed(2));
  function beep() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audio.currentTime;
      [0, 0.3, 0.6].forEach((at) => {
        const osc = audio.createOscillator(), gain = audio.createGain();
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t0 + at);
        gain.gain.exponentialRampToValueAtTime(0.06, t0 + at + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.16);
        osc.connect(gain).connect(audio.destination);
        osc.start(t0 + at); osc.stop(t0 + at + 0.18);
      });
    } catch (_) {}
  }
  function tmTick() {
    if (tm.running && tmLeft() <= 0) {
      tm = { ...tm, running: false, remaining: 0, done: true };
      save("timer", tm);
      beep();
      syncTimer();
    }
    renderTimerTime();
  }
  function syncTimer() {
    clearInterval(tickId);
    tickId = tm.running ? setInterval(tmTick, 200) : 0;
    renderTimer();
  }
  function renderTimerTime() {
    const left = tmLeft();
    const text = tm.done ? "00:00" : fmtClock(left / 1000);
    const el = $("tTime");
    el.textContent = text;
    el.classList.toggle("long", text.length > 5);
    // The ring empties as time runs out, like the Pixel timer. It is
    // redrawn on the 200 ms tick, never animated.
    const share = tm.done ? 0 : tm.total ? Math.min(1, left / (tm.total * 1000)) : 0;
    $("tArc").setAttribute("stroke-dashoffset", (ARC * (1 - share)).toFixed(2));
  }
  function renderTimer() {
    renderTimerTime();
    $("tDisplay").classList.toggle("done", tm.done);
    $("tSub").textContent = tm.done ? t("timesUp") : t("of", { t: fmtClock(tm.total) });
    $("tMin").textContent = Math.floor(tm.total / 60);
    $("tSec").textContent = pad(tm.total % 60);
    const started = tm.running || tm.remaining < tm.total * 1000;
    const primary = $("tPrimary");
    primary.innerHTML = ICONS[tm.done ? "stop" : tm.running ? "pause" : "play"] + "<span></span>";
    primary.lastChild.textContent = t(tm.done ? "stop" : tm.running ? "pause" : started ? "resume" : "start");
    document.querySelectorAll("[data-adj]").forEach((b) => { b.disabled = tm.running; });
    $("presets").innerHTML = PRESETS.map((m) => '<button class="kit-chip' + (tm.total === m * 60 ? " on" : "") +
      '" type="button" data-preset="' + m + '"' + (tm.running ? " disabled" : "") + ">" + m + "</button>").join("") +
      '<button class="kit-chip reset" type="button" id="tReset"' + (!started && !tm.done ? " disabled" : "") + ">" + ICONS.reset + "</button>";
    $("tReset").setAttribute("aria-label", t("reset"));
  }
  function setTotal(sec) {
    tm = { total: Math.max(5, Math.min(99 * 60, sec)), running: false, endAt: 0, remaining: 0, done: false };
    tm.remaining = tm.total * 1000;
    save("timer", tm); syncTimer();
  }
  $("tPrimary").addEventListener("click", () => {
    try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (_) {}
    if (tm.done) return setTotal(tm.total);
    if (tm.running) tm = { ...tm, running: false, remaining: tmLeft() };
    else tm = { ...tm, running: true, endAt: Date.now() + tm.remaining };
    save("timer", tm); syncTimer();
  });
  $("viewTimer").addEventListener("click", (event) => {
    if (event.target.closest("#tReset")) return setTotal(tm.total);
    const adj = event.target.closest("[data-adj]");
    if (adj && !tm.running) setTotal(tm.total + Number(adj.dataset.adj));
    const preset = event.target.closest("[data-preset]");
    if (preset && !tm.running) setTotal(Number(preset.dataset.preset) * 60);
  });

  /* ---- tabs ---- */

  function renderTabs() {
    document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
    $("viewSw").hidden = tab !== "sw";
    $("viewTimer").hidden = tab !== "timer";
    if (tab === "sw") renderSw(); else renderTimer();
  }
  $("tabs").addEventListener("click", (event) => {
    const b = event.target.closest("[data-tab]");
    if (!b) return;
    tab = b.dataset.tab;
    save("tab", tab);
    renderTabs();
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { tmTick(); renderTabs(); } });

  if (tm.running && tmLeft() <= 0) tm = { ...tm, running: false, remaining: 0, done: true };
  enableSwipeClose($("app"));
  applyI18n();
  syncTimer();

  // The screen's style and theme are applied by the kit; the app only
  // follows the language.
  if (window.BotApp) BotApp.onChange((s) => { if (s.lang !== lang) { lang = s.lang; applyI18n(); } });
</script>
</body>
</html>
