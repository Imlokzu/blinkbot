<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<!-- App kit v1: the screen's own look (Material You or Deep UI, any theme
     or skin) and its safe insets. See docs/SCREEN-PLATFORM.md §2.6. -->
<link rel="stylesheet" href="/static/screen/app-kit.css">
<script src="/static/screen/app-kit.js"></script>
<style>
  /* Only what is the game's own: the board, its overlay and the side
     column's layout. The score card, buttons and pad keys are kit parts;
     the board is drawn in the kit's colours (readColors). */
  [hidden] { display: none !important; }
  .game { display: flex; gap: 8px; }
  .field { position: relative; display: grid; place-items: center; flex: 1; min-width: 0; min-height: 0; touch-action: none; }
  canvas { display: block; box-sizing: border-box; border: 1px solid transparent; border-radius: 14px; background: var(--kit-surface); }
  :root[data-ui="deep"] canvas { border-color: color-mix(in srgb, var(--text) 12%, transparent); border-radius: 16px; }
  :root[data-ui="deep"][data-theme="light"] canvas { background: #fff; border-color: color-mix(in srgb, var(--text) 10%, transparent); }

  .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 10px; border-radius: 14px;
    background: color-mix(in srgb, var(--bg) 55%, transparent); opacity: 0; pointer-events: none; transition: opacity 180ms ease; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .ov-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 16px 12px; text-align: center; }
  .ov-title { font: 700 18px/1.15 var(--font); letter-spacing: -0.01em; }
  :root[data-ui="deep"] .ov-title { font-weight: 800; }
  .ov-sub { color: var(--muted); font-size: 11px; max-width: 150px; }
  .ov-sub.hot { color: var(--accent); font-weight: 700; }
  .ov-card .kit-btn { margin-top: 4px; }

  .side { width: 102px; flex: none; display: flex; flex-direction: column; gap: 8px; }
  .score { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; }
  .score-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .score .kit-display { font-size: 32px; }
  .score .kit-btn.icon { width: 30px; height: 30px; min-width: 30px; min-height: 30px; margin-right: -3px; }
  .score .kit-btn svg { width: 15px; height: 15px; }
  .score .kit-btn svg.fill { fill: currentColor; stroke: none; }
  .best { color: var(--muted); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .best b { color: var(--text); font-weight: 700; }

  /* D-pad: four kit keys around a quiet hub */
  .pad { margin-top: auto; display: grid; grid-template-columns: repeat(3, 30px); grid-template-rows: repeat(3, 30px); gap: 6px; }
  .pad .kit-key { display: grid; place-items: center; padding: 0; }
  .pad .kit-key svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .pad .kit-key:active { background: var(--kit-tonal); color: var(--kit-on-tonal); }
  :root[data-ui="deep"] .pad .kit-key:active { background: var(--kit-primary); color: var(--kit-on-accent); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 3; }
  .pad .hub { grid-column: 2; grid-row: 2; display: grid; place-items: center; }
  .pad .hub i { width: 8px; height: 8px; border-radius: 50%; background: var(--kit-surface-hi); }
  @media (max-height: 200px) { .score .kit-display { font-size: 24px; } .pad { grid-template-columns: repeat(3, 26px); grid-template-rows: repeat(3, 26px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
</style>
</head>
<body class="kit">
  <main class="kit-app">
    <section class="kit-fill game">
      <div class="field" id="field">
        <canvas id="cv"></canvas>
        <div class="overlay" id="overlay">
          <div class="kit-card hi ov-card">
            <div class="ov-title" id="ovTitle"></div>
            <div class="ov-sub" id="ovSub"></div>
            <button class="kit-btn primary" id="ovBtn" type="button"></button>
          </div>
        </div>
      </div>
      <aside class="side">
        <div class="kit-card score">
          <span class="kit-label" data-i18n="score"></span>
          <div class="score-top">
            <div class="kit-display kit-accent" id="score">0</div>
            <button class="kit-btn icon tonal" id="pauseBtn" type="button" data-i18n-aria="pause"></button>
          </div>
          <div class="best"><span data-i18n="best"></span> <b id="best">0</b></div>
        </div>
        <div class="pad" id="pad">
          <button class="kit-key up" type="button" data-dir="up" data-i18n-aria="up"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
          <button class="kit-key left" type="button" data-dir="left" data-i18n-aria="left"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
          <span class="hub"><i></i></span>
          <button class="kit-key right" type="button" data-dir="right" data-i18n-aria="right"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
          <button class="kit-key down" type="button" data-dir="down" data-i18n-aria="down"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
      </aside>
    </section>
  </main>
<script>
  const APP_ID = "snake";
  const STR = {
    uk: {
      title: "Змійка", score: "Очки", best: "Рекорд", pause: "Пауза", resume: "Далі", close: "Закрити",
      up: "Вгору", down: "Вниз", left: "Ліворуч", right: "Праворуч",
      readyTitle: "Змійка", readySub: "Свайп по полю або кнопки", play: "Грати",
      pausedTitle: "Пауза", pausedSub: "Змійка чекає",
      overTitle: "Кінець гри", overSub: "Рахунок: {score}", newBest: "Новий рекорд!", again: "Ще раз",
    },
    en: {
      title: "Snake", score: "Score", best: "Best", pause: "Pause", resume: "Resume", close: "Close",
      up: "Up", down: "Down", left: "Left", right: "Right",
      readyTitle: "Snake", readySub: "Swipe the field or use the pad", play: "Play",
      pausedTitle: "Paused", pausedSub: "The snake is waiting",
      overTitle: "Game over", overSub: "Score: {score}", newBest: "New best!", again: "Again",
    },
  };
  const ICONS = {
    play: '<svg class="fill" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l10.6-6.8a1 1 0 0 0 0-1.72L9.5 4.34A1 1 0 0 0 8 5.2z"/></svg>',
    pause: '<svg class="fill" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.4"/><rect x="13.5" y="5" width="4" height="14" rx="1.4"/></svg>',
  };

  /* ---- storage, language ---- */

  // Storage throws inside a sandboxed iframe (a shared package runs with an
  // opaque origin), so every access is guarded and the app keeps its state
  // in memory instead of failing.
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(APP_ID + "." + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
  }
  // The kit already knows the screen's language (botScreenLang)
  let lang = window.BotApp ? BotApp.lang : "uk";
  function t(key, vars) {
    let text = STR[lang][key];
    if (text == null) text = STR.uk[key];
    if (text == null) return key;
    if (vars) text = text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
    return text;
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    showOverlay();
  }
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  /* ---- the game ---- */

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const field = document.getElementById("field");
  const overlay = document.getElementById("overlay");
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

  let cols = 20, rows = 18, cell = 10;
  let snake = [], dir = "right", queue = [], food = null;
  let score = 0, best = load("best", 0), newBest = false;
  let state = "ready";           // ready | running | paused | over
  let acc = 0, last = 0, rafId = 0;
  let colors = {};

  // The board is drawn in the screen's tokens. The canvas itself is clear:
  // its CSS background is the kit surface, so only the pieces are painted.
  function readColors() {
    colors = { snake: cssVar("--accent"), food: cssVar("--ok"), eye: cssVar("--bg"), grid: cssVar("--line") };
  }

  // The grid is fixed for a whole game; only the cell size follows the
  // box, so resizing mid-game rescales instead of moving walls.
  function layout(regrid) {
    const w = field.clientWidth - 2, h = field.clientHeight - 2;
    if (regrid) {
      cell = w >= 180 && h >= 150 ? 10 : 8;
      cols = Math.max(10, Math.floor(w / cell));
      rows = Math.max(8, Math.floor(h / cell));
    } else {
      cell = Math.max(4, Math.floor(Math.min(w / cols, h / rows)));
    }
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = cols * cell + 2 + "px";
    cv.style.height = rows * cell + 2 + "px";
    cv.width = Math.round(cols * cell * dpr);
    cv.height = Math.round(rows * cell * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    overlay.style.inset = "auto";
    overlay.style.width = cv.style.width;
    overlay.style.height = cv.style.height;
    draw();
  }

  function reset() {
    layout(true);
    const y = Math.floor(rows / 2), x = Math.floor(cols / 3);
    snake = [[x, y], [x - 1, y], [x - 2, y]];
    dir = "right";
    queue = [];
    score = 0;
    newBest = false;
    placeFood();
    updateHud();
  }

  function placeFood() {
    const free = [];
    const taken = new Set(snake.map(([x, y]) => y * cols + x));
    for (let i = 0; i < cols * rows; i++) if (!taken.has(i)) free.push(i);
    const pick = free[Math.floor(Math.random() * free.length)];
    food = pick == null ? null : [pick % cols, Math.floor(pick / cols)];
  }

  // Speeds up with every bite, down to a floor that is still playable
  // on a resistive screen.
  function interval() { return Math.max(65, 140 - score * 4); }

  function step() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    const head = [snake[0][0] + dx, snake[0][1] + dy];
    const eats = food && head[0] === food[0] && head[1] === food[1];
    const body = eats ? snake : snake.slice(0, -1);
    const hitWall = head[0] < 0 || head[1] < 0 || head[0] >= cols || head[1] >= rows;
    if (hitWall || body.some(([x, y]) => x === head[0] && y === head[1])) return gameOver();
    snake.unshift(head);
    if (eats) {
      score += 1;
      if (score > best) { best = score; newBest = true; save("best", best); }
      placeFood();
      updateHud();
    } else {
      snake.pop();
    }
  }

  // Rounded cell; roundRect is missing on older Chromium, so fall back
  // to a square rather than break the board.
  function block(x, y, size, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, size, size, r); else ctx.rect(x, y, size, size);
    ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, cols * cell, rows * cell);
    ctx.fillStyle = colors.grid;
    for (let y = 0; y < rows; y++) for (let x = (y % 2); x < cols; x += 2) ctx.fillRect(x * cell + cell / 2 - 0.5, y * cell + cell / 2 - 0.5, 1, 1);
    if (food) {
      const cx = food[0] * cell + cell / 2, cy = food[1] * cell + cell / 2 + 0.5;
      ctx.fillStyle = colors.food;
      ctx.beginPath();
      ctx.arc(cx, cy, cell / 2 - 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(cx - 0.5, food[1] * cell, 1.5, 2.5);
    }
    ctx.fillStyle = colors.snake;
    const n = snake.length;
    snake.forEach(([x, y], i) => {
      ctx.globalAlpha = i === 0 ? 1 : Math.max(0.45, 1 - (i / n) * 0.55);
      block(x * cell + 1, y * cell + 1, cell - 2, i === 0 ? cell * 0.38 : cell * 0.26);
    });
    ctx.globalAlpha = 1;
    if (n) {
      const [hx, hy] = snake[0];
      const [dx, dy] = DIRS[dir];
      const cx = hx * cell + cell / 2, cy = hy * cell + cell / 2;
      const off = cell * 0.22;
      ctx.fillStyle = colors.eye;
      ctx.fillRect(cx + dx * off - dy * off - 1, cy + dy * off - dx * off - 1, 2, 2);
      ctx.fillRect(cx + dx * off + dy * off - 1, cy + dy * off + dx * off - 1, 2, 2);
    }
  }

  function frame(now) {
    rafId = 0;
    if (state !== "running") return;
    acc += Math.min(250, now - last);
    last = now;
    let stepped = false;
    while (acc >= interval() && state === "running") { acc -= interval(); step(); stepped = true; }
    if (stepped) draw();
    if (state === "running") rafId = requestAnimationFrame(frame);
  }

  function run() {
    state = "running";
    acc = 0;
    last = performance.now();
    showOverlay();
    if (!rafId) rafId = requestAnimationFrame(frame);
  }
  function start() { reset(); run(); }
  function pause() { if (state === "running") { state = "paused"; showOverlay(); } }
  function gameOver() { state = "over"; draw(); showOverlay(); }

  function turn(next) {
    if (state === "ready" || state === "over") start();
    else if (state === "paused") run();
    const lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (next === lastDir || next === OPPOSITE[lastDir] || queue.length >= 3) return;
    queue.push(next);
  }

  function updateHud() {
    document.getElementById("score").textContent = score;
    document.getElementById("best").textContent = best;
    const btn = document.getElementById("pauseBtn");
    btn.innerHTML = ICONS[state === "running" ? "pause" : "play"];
    btn.setAttribute("aria-label", t(state === "running" ? "pause" : "resume"));
  }

  function showOverlay() {
    const title = document.getElementById("ovTitle");
    const sub = document.getElementById("ovSub");
    const btn = document.getElementById("ovBtn");
    overlay.classList.toggle("show", state !== "running");
    sub.classList.toggle("hot", state === "over" && newBest);
    if (state === "ready") { title.textContent = t("readyTitle"); sub.textContent = t("readySub"); btn.textContent = t("play"); }
    if (state === "paused") { title.textContent = t("pausedTitle"); sub.textContent = t("pausedSub"); btn.textContent = t("resume"); }
    if (state === "over") {
      title.textContent = t("overTitle");
      sub.textContent = newBest ? t("newBest") + " " + t("overSub", { score }) : t("overSub", { score });
      btn.textContent = t("again");
    }
    updateHud();
  }

  document.getElementById("ovBtn").addEventListener("click", () => { if (state === "paused") run(); else start(); });
  document.getElementById("pauseBtn").addEventListener("click", () => {
    if (state === "running") pause();
    else if (state === "paused") run();
    else start();
  });
  document.getElementById("pad").addEventListener("pointerdown", (event) => {
    const btn = event.target.closest("[data-dir]");
    if (!btn) return;
    event.preventDefault();
    turn(btn.dataset.dir);
  });

  // Swipes steer; the start point moves after each turn so one long drag
  // can make an L-shaped turn without lifting the finger.
  let swipe = null;
  field.addEventListener("pointerdown", (event) => {
    if (event.target.closest("button")) return;
    swipe = { x: event.clientX, y: event.clientY, id: event.pointerId, moved: false };
    try { field.setPointerCapture(event.pointerId); } catch (_) {}
  });
  field.addEventListener("pointermove", (event) => {
    if (!swipe || swipe.id !== event.pointerId) return;
    const dx = event.clientX - swipe.x, dy = event.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 16) return;
    if (state === "running") turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    swipe.x = event.clientX; swipe.y = event.clientY; swipe.moved = true;
  });
  field.addEventListener("pointerup", (event) => {
    if (!swipe || swipe.id !== event.pointerId) return;
    const moved = swipe.moved;
    swipe = null;
    if (!moved && state === "paused") run();
  });
  field.addEventListener("pointercancel", () => { swipe = null; });

  document.addEventListener("keydown", (event) => {
    const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" };
    if (map[event.key]) { event.preventDefault(); turn(map[event.key]); }
    if (event.key === " ") { event.preventDefault(); document.getElementById("pauseBtn").click(); }
    // The on-screen close button is gone (the screen's gestures exit);
    // Escape still leaves the game on a desktop (closeStoreApp).
    if (event.key === "Escape" && window.BotApp) { event.preventDefault(); BotApp.close(); }
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  // A frame can report 0x0 before its first layout; the ready screen just
  // rebuilds the board once the real size is known.
  window.addEventListener("resize", () => (state === "ready" ? reset() : layout(false)));

  readColors();
  reset();
  applyI18n();

  // The kit restyles the page; the board is canvas, so it re-reads the
  // tokens on every style, theme or skin change and redraws.
  if (window.BotApp) BotApp.onChange((s) => {
    readColors();
    draw();
    if (s.lang !== lang) { lang = s.lang; applyI18n(); }
  });
</script>
</body>
</html>
