<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dice</title>
<!-- App kit v1: the screen's own look (Material You or Deep UI, any theme
     or skin) and its safe insets. See docs/SCREEN-PLATFORM.md §2.6. -->
<link rel="stylesheet" href="/static/screen/app-kit.css">
<script src="/static/screen/app-kit.js"></script>
<style>
  /* Only what is the dice app's own: the dice, the coin and the pick
     chips. The page, the bar, the tabs and the buttons are kit parts. */
  [hidden] { display: none !important; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .kit-bar .kit-segment .kit-chip { padding: 0 10px; }

  .view { display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 8px; }
  /* The tray is the big tap target: tapping anywhere rolls or flips */
  .tray { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    padding: 0; overflow: hidden; cursor: pointer; }
  .tray-top { position: absolute; left: 12px; right: 12px; top: 8px; display: flex; align-items: baseline;
    justify-content: space-between; gap: 8px; pointer-events: none; }
  .total { display: flex; align-items: baseline; gap: 6px; }
  .total b { font: 600 22px/1 var(--font); font-variant-numeric: tabular-nums; color: var(--accent); }
  .hint { color: var(--muted); font-size: 11px; }

  /* Footer: how many, which die, and the one primary action */
  .controls { flex: none; }
  .controls .kit-segment .kit-chip { min-width: 28px; padding: 0 8px; font-size: 12px; }
  .controls .kit-btn.primary { margin-left: auto; }

  /* ---- Dice: solid tiles in the text colour with pips in the page
     colour, so they read as real dice in dark and light alike ---- */
  .dice-grid { display: grid; gap: 14px; margin-top: 16px; }
  .die { position: relative; display: grid; flex: none; box-sizing: border-box; width: var(--d, 52px); height: var(--d, 52px);
    padding: 15%; border-radius: 24%; background: var(--text); grid-template: repeat(3, 1fr) / repeat(3, 1fr); }
  .die i { width: 74%; height: 74%; margin: auto; border-radius: 50%; background: var(--bg); visibility: hidden; }
  .die i.on { visibility: visible; }
  .die.d20 { grid-template: 1fr / 1fr; place-items: center; padding: 0; border-radius: 0; background: transparent; }
  .die.d20 svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .die.d20 .face { fill: var(--text); stroke: var(--text); stroke-width: 1.2; stroke-linejoin: round; }
  .die.d20 .facet { fill: none; stroke: var(--bg); stroke-width: 0.7; stroke-linejoin: round; opacity: 0.3; }
  .die.d20 b { position: relative; margin-top: 9%; color: var(--bg); font: 800 calc(var(--d, 52px) * 0.27)/1 var(--font); font-variant-numeric: tabular-nums; }
  /* The highest d20 wears the accent */
  .die.d20.best .face { fill: var(--accent); stroke: var(--accent); }
  .die.d20.best .facet { stroke: var(--kit-on-accent); }
  .die.d20.best b { color: var(--kit-on-accent); }
  .rolling .die { animation: tumble .5s cubic-bezier(.3, .7, .4, 1); }
  .rolling .die:nth-child(2n) { animation-name: tumble2; }
  @keyframes tumble { 0% { transform: rotate(0) scale(1); } 30% { transform: rotate(-160deg) scale(.8) translateY(-6px); } 70% { transform: rotate(-330deg) scale(1.06); } 100% { transform: rotate(-360deg) scale(1); } }
  @keyframes tumble2 { 0% { transform: rotate(0) scale(1); } 30% { transform: rotate(170deg) scale(.82) translateY(-5px); } 70% { transform: rotate(340deg) scale(1.05); } 100% { transform: rotate(360deg) scale(1); } }

  /* ---- Coin: heads in the primary, tails tonal — one hue, two faces ---- */
  .tally { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .tally span { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 0 9px; border-radius: 11px;
    background: var(--kit-surface-hi); color: var(--muted); font: 600 11px/1 var(--font); }
  .tally b { color: var(--text); font-variant-numeric: tabular-nums; }
  /* Landscape panel: the coin on the left, the result and the tally beside it */
  .coin-tray { gap: 22px; }
  .coin-side { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0; }
  .coin-wrap { perspective: 400px; }
  .coin { display: grid; place-items: center; width: 92px; height: 92px; border-radius: 50%;
    background: var(--kit-primary); color: var(--kit-on-accent); }
  .coin svg.i { width: 40px; height: 40px; stroke-width: 1.7; }
  .coin.tails { background: var(--kit-tonal); color: var(--kit-on-tonal); }
  .flipping .coin { animation: flip .7s cubic-bezier(.3, .6, .4, 1); }
  @keyframes flip { 0% { transform: rotateX(0) translateY(0); } 50% { transform: rotateX(900deg) translateY(-14px) scale(1.08); } 100% { transform: rotateX(1800deg) translateY(0); } }
  .coin-label { font: 700 24px/1.1 var(--font); letter-spacing: -0.01em; transition: opacity .15s ease; }
  .flipping .coin-label { opacity: 0; }

  /* ---- Pick: options as chips; the run of light lands on the winner ---- */
  .options { flex: 1; min-height: 0; display: flex; align-content: flex-start; flex-wrap: wrap; gap: 6px; padding: 10px; }
  .opt { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; min-height: 30px; padding: 0 3px 0 12px;
    border-radius: 15px; background: var(--kit-surface-hi); font: 600 12px/1 var(--font);
    transition: transform .12s ease, opacity .12s ease; }
  .opt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt .kit-btn.icon { width: 24px; height: 24px; min-width: 24px; min-height: 24px; background: transparent; color: var(--muted); }
  .opt .kit-btn.icon svg { width: 14px; height: 14px; }
  .opt.lit { background: var(--kit-tonal); color: var(--kit-on-tonal); transform: scale(1.06); }
  .opt.win { background: var(--kit-primary); color: var(--kit-on-accent); transform: scale(1.1); }
  .opt.win .kit-btn.icon { color: var(--kit-on-accent); }
  .picking .opt:not(.lit) { opacity: .5; }
  .empty { margin: auto; color: var(--muted); font-size: 12px; }
  .add { flex: none; margin: 0; }
  .add input { flex: 1; min-width: 0; height: 34px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 17px;
    background: var(--kit-surface-hi); color: var(--text); font: 500 12px/1 var(--font); outline: none; }
  .add input:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  .add input::placeholder { color: var(--muted); }
  .add input:disabled { opacity: .6; }

  @media (prefers-reduced-motion: reduce) { .rolling .die, .flipping .coin { animation: none; } .opt, .coin-label { transition: none; } }
</style>
</head>
<body class="kit">
  <main class="kit-app" id="app">
    <header class="kit-bar">
      <span class="kit-title" data-i18n="title"></span>
      <div class="kit-segment" id="tabs">
        <button class="kit-chip" type="button" data-tab="dice" data-i18n="tabDice"></button>
        <button class="kit-chip" type="button" data-tab="coin" data-i18n="tabCoin"></button>
        <button class="kit-chip" type="button" data-tab="pick" data-i18n="tabPick"></button>
      </div>
    </header>

    <section class="view" id="viewDice">
      <div class="kit-card tray" id="tray" role="button"></div>
      <footer class="kit-row controls">
        <div class="kit-segment" id="count">
          <button class="kit-chip" type="button" data-count="1">1</button>
          <button class="kit-chip" type="button" data-count="2">2</button>
          <button class="kit-chip" type="button" data-count="3">3</button>
          <button class="kit-chip" type="button" data-count="4">4</button>
        </div>
        <div class="kit-segment" id="sides">
          <button class="kit-chip" type="button" data-sides="6">d6</button>
          <button class="kit-chip" type="button" data-sides="20">d20</button>
        </div>
        <button class="kit-btn primary" id="roll" type="button"><span data-icon="dice"></span><span data-i18n="roll"></span></button>
      </footer>
    </section>

    <section class="view" id="viewCoin" hidden>
      <div class="kit-card tray coin-tray" id="coinTray" role="button">
        <div class="coin-wrap"><div class="coin" id="coin"></div></div>
        <div class="coin-side">
          <div class="coin-label" id="coinLabel"></div>
          <div class="tally"><span><span data-i18n="heads"></span> <b id="nHeads">0</b></span><span><span data-i18n="tails"></span> <b id="nTails">0</b></span></div>
        </div>
      </div>
      <footer class="kit-row controls">
        <button class="kit-btn icon" id="coinReset" type="button" data-icon="reset" data-i18n-aria="resetTally"></button>
        <button class="kit-btn primary" id="flip" type="button"><span data-icon="target"></span><span data-i18n="flip"></span></button>
      </footer>
    </section>

    <section class="view" id="viewPick" hidden>
      <div class="kit-card kit-scroll options" id="options"></div>
      <form class="kit-row add" id="addForm" autocomplete="off">
        <input id="optInput" maxlength="24">
        <button class="kit-btn icon" type="submit" data-icon="plus" data-i18n-aria="add"></button>
        <button class="kit-btn primary" id="pick" type="button"><span data-icon="shuffle"></span><span data-i18n="pick"></span></button>
      </form>
    </section>
  </main>
<script>
  const APP_ID = "dice";
  const STR = {
    uk: {
      title: "Кубики", tabDice: "Кубики", tabCoin: "Монета", tabPick: "Вибір",
      roll: "Кинути", total: "Сума", tapHint: "тап - кинути", flip: "Підкинути", heads: "Орел", tails: "Решка",
      resetTally: "Скинути лічильник", pick: "Обрати", add: "Додати", addPlaceholder: "Новий варіант",
      remove: "Прибрати", empty: "Додай хоча б два варіанти", defaults: "Піца|Суші|Борщ|Вареники",
      full: "Максимум 8 варіантів",
    },
    en: {
      title: "Dice", tabDice: "Dice", tabCoin: "Coin", tabPick: "Pick",
      roll: "Roll", total: "Total", tapHint: "tap to roll", flip: "Flip", heads: "Heads", tails: "Tails",
      resetTally: "Reset tally", pick: "Pick", add: "Add", addPlaceholder: "New option",
      remove: "Remove", empty: "Add at least two options", defaults: "Pizza|Sushi|Tacos|Pasta",
      full: "8 options at most",
    },
  };
  const ICONS = {
    dice: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 8.5h.01M15.5 8.5h.01M12 12h.01M8.5 15.5h.01M15.5 15.5h.01"/>',
    target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12h.01"/>',
    reset: '<path d="M20 11a8 8 0 0 0-14.8-3L3 11m0 0V6m0 5h5M4 13a8 8 0 0 0 14.8 3L21 13m0 0v5m0-5h-5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    shuffle: '<path d="M3 7h3.5c4 0 5 10 9 10H21M3 17h3.5c1.6 0 2.7-1.6 3.6-3.6M13.9 9.6C14.8 8 15.9 7 17.5 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/>',
    x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    star: '<path d="M12 3.8l2.5 5.2 5.7.7-4.2 3.9 1.1 5.6L12 16.4l-5.1 2.8L8 13.6 3.8 9.7l5.7-.7z"/>'
  };

  // Storage throws inside a sandboxed iframe (a shared package runs with an
  // opaque origin), so every access is guarded and the app keeps its state
  // in memory instead of failing.
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(APP_ID + "." + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
  }

  // The kit already knows the screen's language (botScreenLang)
  let lang = window.BotApp ? BotApp.lang : "uk";
  function t(key) { return STR[lang][key] ?? STR.uk[key] ?? key; }
  function icon(name) {
    return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
  }
  function fillIcons() {
    document.querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = icon(el.dataset.icon); });
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    renderAll();
  }

  // Which pips are lit for each face, cells numbered 0..8 row by row.
  const PIPS = { 1: [4], 2: [2, 6], 3: [2, 4, 6], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  // A d20 seen face-on: the hexagon outline and the facet lines to its centre triangle.
  const D20_SHAPE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="face" d="M12 1.8 21.2 7v10L12 22.2 2.8 17V7z"/>' +
    '<path class="facet" d="M12 4.6 18.6 16.2H5.4z"/></svg>';
  let prefs = Object.assign({ tab: "dice", count: 2, sides: 6 }, load("prefs", {}));
  let dice = [], coinSide = "heads", tally = { heads: 0, tails: 0 };
  let options = load("options", null);   // null = the localised defaults
  let busy = false, winner = -1;
  const rand = (n) => 1 + Math.floor(Math.random() * n);

  function savePrefs() { save("prefs", prefs); }
  function renderTabs() {
    document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === prefs.tab));
    document.getElementById("viewDice").hidden = prefs.tab !== "dice";
    document.getElementById("viewCoin").hidden = prefs.tab !== "coin";
    document.getElementById("viewPick").hidden = prefs.tab !== "pick";
  }

  function dieHtml(value, best) {
    if (prefs.sides === 20) return '<div class="die d20' + (best ? " best" : "") + '">' + D20_SHAPE + "<b>" + value + "</b></div>";
    const on = PIPS[value];
    let cells = "";
    for (let i = 0; i < 9; i++) cells += '<i class="' + (on.includes(i) ? "on" : "") + '"></i>';
    return '<div class="die' + (best ? " best" : "") + '">' + cells + "</div>";
  }
  function renderDice() {
    if (dice.length !== prefs.count) dice = Array.from({ length: prefs.count }, () => rand(prefs.sides));
    const tray = document.getElementById("tray");
    // Three or four dice go on one row or two, whichever leaves each die
    // bigger, so it stays readable at arm's length on a 2.4" panel.
    const fit = (rows, perRow) => Math.min(72, (tray.clientHeight - 44) / rows - 14, (tray.clientWidth - 24) / perRow - 14);
    const oneRow = fit(1, prefs.count);
    const twoRows = prefs.count > 2 ? fit(2, 2) : 0;
    const perRow = twoRows > oneRow ? 2 : prefs.count;
    const size = Math.floor(Math.max(oneRow, twoRows));
    tray.style.setProperty("--d", Math.max(30, size) + "px");
    const top = Math.max(...dice);
    tray.innerHTML = '<div class="tray-top"><div class="total kit-label"><span></span><b></b></div><div class="hint"></div></div>' +
      '<div class="dice-grid" style="grid-template-columns:repeat(' + perRow + ',auto)">' +
      dice.map((v) => dieHtml(v, prefs.sides === 20 && dice.length > 1 && v === top)).join("") + "</div>";
    tray.querySelector(".total span").textContent = t("total");
    tray.querySelector(".total b").textContent = dice.reduce((x, y) => x + y, 0);
    tray.querySelector(".hint").textContent = t("tapHint");
    document.querySelectorAll("[data-count]").forEach((b) => b.classList.toggle("on", Number(b.dataset.count) === prefs.count));
    document.querySelectorAll("[data-sides]").forEach((b) => b.classList.toggle("on", Number(b.dataset.sides) === prefs.sides));
  }
  function roll() {
    if (busy) return;
    busy = true;
    const tray = document.getElementById("tray");
    dice = Array.from({ length: prefs.count }, () => rand(prefs.sides));
    renderDice();
    tray.classList.remove("rolling");
    void tray.offsetWidth;
    tray.classList.add("rolling");
    setTimeout(() => { tray.classList.remove("rolling"); busy = false; }, 520);
  }

  function renderCoin() {
    const coin = document.getElementById("coin");
    coin.className = "coin" + (coinSide === "tails" ? " tails" : "");
    coin.innerHTML = icon(coinSide === "heads" ? "star" : "target");
    document.getElementById("coinLabel").textContent = t(coinSide);
    document.getElementById("nHeads").textContent = tally.heads;
    document.getElementById("nTails").textContent = tally.tails;
  }
  function flip() {
    if (busy) return;
    busy = true;
    const tray = document.getElementById("coinTray");
    tray.classList.remove("flipping");
    void tray.offsetWidth;
    tray.classList.add("flipping");
    coinSide = Math.random() < .5 ? "heads" : "tails";
    // The face swaps mid-flip, while the coin is edge-on and unreadable.
    setTimeout(() => renderCoin(), 350);
    setTimeout(() => { tally[coinSide] += 1; renderCoin(); tray.classList.remove("flipping"); busy = false; }, 720);
  }

  function currentOptions() { return options || t("defaults").split("|"); }
  function renderOptions() {
    const box = document.getElementById("options");
    const list = currentOptions();
    box.innerHTML = "";
    if (!list.length) { box.innerHTML = '<span class="empty"></span>'; box.firstChild.textContent = t("empty"); }
    list.forEach((text, i) => {
      const chip = document.createElement("span");
      chip.className = "opt" + (i === winner ? " win" : "");
      chip.innerHTML = "<span></span>" + '<button class="kit-btn icon" type="button" data-remove="' + i + '">' + icon("x") + "</button>";
      chip.firstChild.textContent = text;
      chip.lastChild.setAttribute("aria-label", t("remove"));
      box.appendChild(chip);
    });
    document.getElementById("pick").disabled = list.length < 2;
    const input = document.getElementById("optInput");
    input.placeholder = list.length >= 8 ? t("full") : t("addPlaceholder");
    input.disabled = list.length >= 8;
  }
  function pick() {
    const list = currentOptions();
    if (busy || list.length < 2) return;
    busy = true;
    winner = -1;
    renderOptions();
    const box = document.getElementById("options");
    const chips = [...box.querySelectorAll(".opt")];
    const target = Math.floor(Math.random() * list.length);
    // A slowing run of highlights that lands on the pick: suspense in
    // under two seconds, and every hop is just a class toggle.
    const hops = list.length * 2 + target;
    let hop = 0;
    box.classList.add("picking");
    const next = () => {
      chips.forEach((c, i) => c.classList.toggle("lit", i === hop % list.length));
      if (hop >= hops) {
        box.classList.remove("picking");
        winner = target;
        busy = false;
        renderOptions();
        return;
      }
      hop += 1;
      setTimeout(next, 55 + Math.pow(hop / hops, 3) * 260);
    };
    next();
  }

  document.getElementById("tabs").addEventListener("click", (event) => {
    const b = event.target.closest("[data-tab]");
    if (!b || busy) return;
    prefs.tab = b.dataset.tab;
    savePrefs();
    renderAll();
  });
  document.getElementById("count").addEventListener("click", (event) => {
    const b = event.target.closest("[data-count]");
    if (!b || busy) return;
    prefs.count = Number(b.dataset.count);
    dice = [];
    savePrefs();
    renderDice();
  });
  document.getElementById("sides").addEventListener("click", (event) => {
    const b = event.target.closest("[data-sides]");
    if (!b || busy) return;
    prefs.sides = Number(b.dataset.sides);
    dice = [];
    savePrefs();
    renderDice();
  });
  document.getElementById("roll").addEventListener("click", roll);
  document.getElementById("tray").addEventListener("click", roll);
  document.getElementById("flip").addEventListener("click", flip);
  document.getElementById("coinTray").addEventListener("click", flip);
  document.getElementById("coinReset").addEventListener("click", () => { tally = { heads: 0, tails: 0 }; renderCoin(); });
  document.getElementById("pick").addEventListener("click", pick);
  document.getElementById("addForm").addEventListener("submit", (event) => {
    event.preventDefault();
    const input = document.getElementById("optInput");
    const text = input.value.trim().slice(0, 24);
    const list = currentOptions().slice();
    if (!text || list.length >= 8 || busy) return;
    list.push(text);
    options = list; winner = -1;
    save("options", options);
    input.value = "";
    renderOptions();
  });
  document.getElementById("options").addEventListener("click", (event) => {
    const b = event.target.closest("[data-remove]");
    if (!b || busy) return;
    const list = currentOptions().slice();
    list.splice(Number(b.dataset.remove), 1);
    options = list; winner = -1;
    save("options", options);
    renderOptions();
  });
  window.addEventListener("resize", () => renderAll());

  function renderAll() {
    renderTabs();
    if (prefs.tab === "dice") renderDice();
    if (prefs.tab === "coin") renderCoin();
    if (prefs.tab === "pick") renderOptions();
  }

  if (![1, 2, 3, 4].includes(prefs.count)) prefs.count = 2;
  if (prefs.sides !== 20) prefs.sides = 6;
  if (!["dice", "coin", "pick"].includes(prefs.tab)) prefs.tab = "dice";
  if (!Array.isArray(options)) options = null;
  else options = options.filter((o) => typeof o === "string").slice(0, 8);

  fillIcons();
  applyI18n();

  // The screen's style and theme are applied by the kit; the app only
  // follows the language (the default pick list is localised).
  if (window.BotApp) BotApp.onChange((s) => { if (s.lang !== lang) { lang = s.lang; applyI18n(); } });
</script>
</body>
</html>
