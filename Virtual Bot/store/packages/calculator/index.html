<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calculator</title>
<!-- App kit v1: the screen's own look (Material You or Deep UI, any theme
     or skin) and its safe insets. See docs/SCREEN-PLATFORM.md §2.6. -->
<link rel="stylesheet" href="/static/screen/app-kit.css">
<script src="/static/screen/app-kit.js"></script>
<style>
  /* Only what is the calculator's own: the readout and the keypad. The
     page, the bar, the buttons and the list are kit parts. */
  [hidden] { display: none !important; }
  .kit-app { gap: 6px; }

  /* The bar carries the running expression next to the title, so the
     keypad gets the height a 240 px panel can spare. */
  .expr { flex: 1; min-width: 0; overflow: hidden; color: var(--muted); font: 500 13px/1.2 var(--font);
    font-variant-numeric: tabular-nums; text-align: right; text-overflow: ellipsis; white-space: nowrap; direction: rtl; }
  .expr span { direction: ltr; unicode-bidi: isolate; }
  .kit-bar .kit-title { flex: none; }
  .kit-bar .kit-btn.icon { width: 30px; height: 30px; }
  .kit-bar .kit-btn.icon.on { background: var(--kit-tonal); color: var(--kit-on-tonal); }

  /* The number itself: big, light, right-aligned, on the page — no box,
     as on a phone calculator. Long numbers shrink with a transform. */
  .readout { flex: none; display: flex; justify-content: flex-end; min-width: 0; padding: 0 4px; overflow: hidden; }
  .value { font: 300 38px/1 var(--font); letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
    white-space: nowrap; transform-origin: right center; }
  :root[data-ui="material"] .value { font-weight: 400; }
  .value.error { color: var(--accent); font-size: 26px; line-height: 38px; font-weight: 600; }

  .body { position: relative; flex: 1; min-height: 0; }
  .keys { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: 6px; height: 100%; transition: opacity 150ms ease; }
  .kit-key { min-width: 0; min-height: 24px; padding: 0; border-radius: 999px; font-size: 18px;
    font-weight: 500; font-variant-numeric: tabular-nums; touch-action: manipulation; }
  :root[data-ui="deep"] .kit-key { border-radius: 14px; font-weight: 600; }
  /* Four tiers, one hue: digits on the raised surface, operators tonal,
     functions quieter with accent text, and "=" the one primary key. */
  .kit-key.tonal { font-size: 21px; }
  .kit-key.fn { background: var(--kit-surface); color: var(--accent); font-size: 15px; font-weight: 600; }
  .kit-key.accent { font-size: 22px; }
  .kit-key.lit { outline: 2px solid var(--accent); outline-offset: -2px; }
  .kit-key svg { width: 20px; height: 20px; vertical-align: middle; fill: none; stroke: currentColor;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* Recent results slide over the keypad */
  .history { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-start;
    opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity 150ms ease, transform 150ms ease; }
  .history.show { opacity: 1; pointer-events: auto; transform: none; }
  .body.hist .keys { opacity: 0; pointer-events: none; }
  .h-row { width: 100%; min-height: 32px; border: 0; color: var(--text); font: inherit; text-align: right;
    font-variant-numeric: tabular-nums; cursor: pointer; }
  .h-row:active { background: var(--kit-surface-hi); }
  .h-expr { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-val { flex: none; font-size: 16px; font-weight: 700; }
  .h-head { padding: 2px 4px 6px; }
  .h-empty { margin: auto; color: var(--muted); font-size: 12px; text-align: center; }

  @media (max-height: 200px) { .value { font-size: 30px; } .kit-key { font-size: 15px; } }
  @media (prefers-reduced-motion: reduce) { .keys, .history { transition: none; } }
</style>
</head>
<body class="kit">
  <main class="kit-app" id="app">
    <header class="kit-bar">
      <span class="kit-title" data-i18n="title"></span>
      <div class="expr" id="expr"></div>
      <button class="kit-btn icon" id="histBtn" type="button" data-i18n-aria="history">
        <svg viewBox="0 0 24 24"><path d="M4.5 9.5A8 8 0 1 1 6.8 17"/><path d="M4.5 4.5v5h5M12 7.5v5l3 2"/></svg>
      </button>
    </header>
    <div class="readout"><div class="value" id="value">0</div></div>
    <section class="body" id="body">
      <div class="keys" id="keys"></div>
      <div class="history kit-scroll" id="history"></div>
    </section>
  </main>
<script>
  const APP_ID = "calculator";
  const STR = {
    uk: { title: "Калькулятор", history: "Останні результати", noHistory: "Тут будуть 5 останніх результатів", error: "Помилка", backspace: "Стерти", clear: "Очистити", sign: "Змінити знак", percent: "Відсоток" },
    en: { title: "Calculator", history: "Recent results", noHistory: "Your last 5 results show up here", error: "Error", backspace: "Delete", clear: "Clear", sign: "Change sign", percent: "Percent" },
  };
  const BACKSPACE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10.5A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H9l-6-7z"/><path d="m12 9.5 5 5M17 9.5l-5 5"/></svg>';

  // Storage throws inside a sandboxed iframe (a shared package runs with an
  // opaque origin), so every access is guarded and the app keeps its state
  // in memory instead of failing.
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(APP_ID + "." + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (_) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(APP_ID + "." + key, JSON.stringify(value)); } catch (_) {}
  }

  // The kit already knows the screen's language (botScreenLang)
  let lang = window.BotApp ? BotApp.lang : "uk";
  function t(key) { return STR[lang][key] ?? STR.uk[key] ?? key; }
  function applyI18n() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    buildKeys();
    render();
    if (document.getElementById("history").classList.contains("show")) renderHistory();
  }

  const OPS = { "/": "÷", "*": "×", "-": "−", "+": "+" };
  const LAYOUT = [
    ["7", "8", "9", "/", "C"],
    ["4", "5", "6", "*", "back"],
    ["1", "2", "3", "-", "%"],
    ["neg", "0", ".", "+", "="],
  ];
  let tokens = [], entry = "0", evaluated = false, error = false, lastExpr = "";
  let history = load("history", []);
  if (!Array.isArray(history)) history = [];

  // The decimal mark follows the language: a comma in Ukrainian, a dot
  // in English. Internally numbers always use a dot.
  function mark() { return lang === "uk" ? "," : "."; }
  function show(numStr) {
    if (numStr === "" || numStr == null) return "";
    const neg = numStr.startsWith("-");
    let [int, frac] = numStr.replace("-", "").split(".");
    if (/e/.test(int)) return numStr.replace(".", mark());
    int = int.replace(/\B(?=(\d{3})+(?!\d))/g, lang === "uk" ? " " : ",");
    return (neg ? "−" : "") + int + (frac != null ? mark() + frac : "");
  }
  function fmt(n) {
    if (!isFinite(n)) return null;
    const abs = Math.abs(n);
    if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) return n.toExponential(5).replace(/\.?0+e/, "e");
    return String(parseFloat(n.toPrecision(12)));
  }

  function evaluate(list) {
    // Two passes: multiplication/division first, as people expect from
    // "2 + 3 x 4" typed on any phone calculator.
    const nums = [Number(list[0])], ops = [];
    for (let i = 1; i < list.length; i += 2) {
      const op = list[i], n = Number(list[i + 1]);
      if (op === "*") nums[nums.length - 1] *= n;
      else if (op === "/") { if (n === 0) return NaN; nums[nums.length - 1] /= n; }
      else { ops.push(op); nums.push(n); }
    }
    return ops.reduce((acc, op, i) => (op === "+" ? acc + nums[i + 1] : acc - nums[i + 1]), nums[0]);
  }

  function press(key) {
    if (error && key !== "C") { tokens = []; entry = "0"; error = false; evaluated = false; if (!/[0-9.]/.test(key)) return render(); }
    if (/^[0-9]$/.test(key)) {
      if (evaluated) { tokens = []; entry = "0"; evaluated = false; }
      if (entry.replace(/[-.]/g, "").length >= 12) return;
      entry = entry === "0" ? key : entry === "-0" ? "-" + key : entry + key;
    } else if (key === ".") {
      if (evaluated) { tokens = []; entry = "0"; evaluated = false; }
      if (entry === "") entry = "0";
      if (!entry.includes(".")) entry += ".";
    } else if (OPS[key]) {
      evaluated = false;
      if (entry === "" && tokens.length) tokens[tokens.length - 1] = key;
      else { tokens.push(String(Number(entry))); tokens.push(key); }
      entry = "";
    } else if (key === "=") {
      if (!tokens.length) return;
      const list = tokens.slice();
      if (entry === "") list.pop(); else list.push(String(Number(entry)));
      const result = fmt(evaluate(list));
      const expr = list.map((x) => (OPS[x] ? OPS[x] : show(x))).join(" ");
      if (result == null) { error = true; tokens = []; entry = "0"; }
      else {
        history.unshift({ expr, value: result });
        history = history.slice(0, 5);
        save("history", history);
        tokens = []; entry = result; evaluated = true;
        lastExpr = expr + " =";
      }
    } else if (key === "C") {
      tokens = []; entry = "0"; evaluated = false; error = false; lastExpr = "";
    } else if (key === "back") {
      if (evaluated) { entry = "0"; evaluated = false; lastExpr = ""; }
      else if (entry !== "") entry = entry.length > 1 && entry !== "-0" ? entry.slice(0, -1).replace(/^-$/, "0") : "0";
      else if (tokens.length) { tokens.pop(); entry = tokens.pop() || "0"; }
    } else if (key === "neg") {
      if (entry === "") entry = "-0";
      else entry = entry.startsWith("-") ? entry.slice(1) : "-" + entry;
      evaluated = false;
    } else if (key === "%") {
      if (entry === "") return;
      const prevOp = tokens[tokens.length - 1];
      // "200 + 10 %" means 10 % of 200, the way desk calculators do it.
      const base = prevOp === "+" || prevOp === "-" ? Number(tokens[tokens.length - 2]) : 1;
      entry = fmt(base * Number(entry) / 100) || "0";
      evaluated = false;
    }
    if (!evaluated && key !== "=") lastExpr = "";
    render();
  }
  function render() {
    const value = document.getElementById("value");
    value.classList.toggle("error", error);
    value.textContent = error ? t("error") : entry === "" ? show(tokens[tokens.length - 2] || "0") : show(entry);
    // Shrink long numbers with a transform so the row never reflows.
    value.style.transform = "";
    const room = value.parentElement.clientWidth - 8;
    if (value.scrollWidth > room) value.style.transform = "scale(" + (room / value.scrollWidth).toFixed(3) + ")";
    const expr = document.getElementById("expr");
    expr.innerHTML = "<span></span>";
    expr.firstChild.textContent = lastExpr || tokens.map((x) => (OPS[x] ? OPS[x] : show(x))).join(" ");
    const pending = entry === "" ? tokens[tokens.length - 1] : null;
    document.querySelectorAll(".kit-key.tonal").forEach((k) => k.classList.toggle("lit", k.dataset.key === pending));
  }

  function buildKeys() {
    const keys = document.getElementById("keys");
    keys.innerHTML = "";
    LAYOUT.flat().forEach((k) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.key = k;
      b.className = "kit-key" + (OPS[k] ? " tonal" : k === "=" ? " accent" : ["C", "back", "%", "neg"].includes(k) ? " fn" : "");
      if (k === "back") { b.innerHTML = BACKSPACE; b.setAttribute("aria-label", t("backspace")); }
      else b.textContent = OPS[k] || (k === "." ? mark() : k === "neg" ? "±" : k);
      if (k === "C") b.setAttribute("aria-label", t("clear"));
      if (k === "neg") b.setAttribute("aria-label", t("sign"));
      if (k === "%") b.setAttribute("aria-label", t("percent"));
      keys.appendChild(b);
    });
  }

  function renderHistory() {
    const box = document.getElementById("history");
    box.innerHTML = "";
    if (!history.length) { box.innerHTML = '<div class="h-empty"></div>'; box.firstChild.textContent = t("noHistory"); return; }
    const head = document.createElement("div");
    head.className = "kit-label h-head";
    head.textContent = t("history");
    box.appendChild(head);
    const list = document.createElement("div");
    list.className = "kit-list";
    history.forEach((h, i) => {
      const row = document.createElement("button");
      row.type = "button"; row.className = "kit-item h-row"; row.dataset.h = i;
      row.innerHTML = '<span class="kit-grow h-expr"></span><span class="h-val"></span>';
      row.firstChild.textContent = h.expr + " =";
      row.lastChild.textContent = show(h.value);
      list.appendChild(row);
    });
    box.appendChild(list);
  }
  function toggleHistory(open) {
    const box = document.getElementById("history");
    const visible = open != null ? open : !box.classList.contains("show");
    if (visible) renderHistory();
    box.classList.toggle("show", visible);
    document.getElementById("body").classList.toggle("hist", visible);
    document.getElementById("histBtn").classList.toggle("on", visible);
  }

  document.getElementById("keys").addEventListener("click", (event) => {
    const b = event.target.closest("[data-key]");
    if (b) press(b.dataset.key);
  });
  document.getElementById("histBtn").addEventListener("click", () => toggleHistory());
  document.getElementById("history").addEventListener("click", (event) => {
    const row = event.target.closest("[data-h]");
    if (row) {
      const h = history[Number(row.dataset.h)];
      if (h) { if (evaluated || error) tokens = []; entry = h.value; evaluated = false; error = false; lastExpr = ""; render(); }
    }
    toggleHistory(false);
  });
  document.addEventListener("keydown", (event) => {
    const k = event.key;
    const map = { Enter: "=", "=": "=", Backspace: "back", Escape: "C", ",": ".", x: "*", X: "*" };
    const key = map[k] || k;
    if (/^[0-9]$/.test(key) || OPS[key] || ["=", "back", "C", ".", "%"].includes(key)) { event.preventDefault(); press(key); }
  });
  window.addEventListener("resize", render);

  applyI18n();

  // The screen's style and theme are applied by the kit; the app only
  // follows the language (the decimal mark changes with it).
  if (window.BotApp) BotApp.onChange((s) => { if (s.lang !== lang) { lang = s.lang; applyI18n(); } });
</script>
</body>
</html>
